name: sync-v04672-once

on:
  push:
    branches:
      - fix/muse-sticky-routing-v04672

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/muse-sticky-routing-v04672
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Synchronize v0.46.72 and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.46.71"'
          new = 'const version = "0.46.72"'
          if old not in s:
              raise SystemExit('config.go version anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('installer/FlipAi.iss')
          s = p.read_text()
          old = '#define MyVersion "0.46.71"'
          new = '#define MyVersion "0.46.72"'
          if old not in s:
              raise SystemExit('installer version anchor not found')
          p.write_text(s.replace(old, new, 1))

          Path('VERSION').write_text('0.46.72\n')
          notes = (
              '# FlipAi v0.46.72\n\n'
              'This patch fixes Muse sticky SMS routing after Muse has been selected with `MU:`.\n\n'
              '## Muse sticky routing fix\n\n'
              '- After `MU: ...` selects Muse, following SMS messages without a prefix now continue to Muse instead of falling back to Codex.\n'
              '- The sticky command parser now dispatches Muse agent `U` through the Muse parser instead of the legacy Codex/Claude parser.\n'
              '- Legacy sticky-agent validation and shared-number target validation now recognize Muse as a first-class provider.\n'
              '- The fix does not change Muse WebView login/session handling or the other provider routes.\n\n'
              '## Regression coverage\n\n'
              '- Added a reproduction of the real failure: `MU: hi` stores `route:MU`, then an unprefixed `Check my last email` must resolve to Muse (`U`) with the original text preserved.\n'
              '- Added coverage for legacy Muse sticky state and shared-number Muse targeting.\n'
              '- Full tests and vet run before the patch metadata is committed.\n\n'
              "No Muse API key is required; FlipAi uses the user's signed-in Muse web session.\n"
          )
          Path('docs/RELEASE-NOTES.md').write_text(notes)
          PY
          go test ./...
          go vet ./...
      - name: Commit synchronized version and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/sync-v04672-once.yml
          git config user.name "FlipAi release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize v0.46.72 sticky routing patch"
          git push origin HEAD:fix/muse-sticky-routing-v04672
