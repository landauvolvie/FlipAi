name: claude-chat-integrate

on:
  push:
    branches:
      - feature/claude-chat-v04619
    paths:
      - .github/workflows/claude-chat-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/claude-chat-v04619
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply integration edits
        run: |
          python scripts/claude_chat_integrate.py
          python scripts/claude_chat_finalize.py
      - name: Format and test
        run: |
          gofmt -w agents.go bridge.go claude_chat_*.go commands.go config.go main.go sms_*.go ui_actions.go ui_actions_agents.go ui_page_agents.go zzzzz_claude_chat_ui.go
          go test ./...
          go vet ./...
      - name: Commit integrated source
        run: |
          set -euo pipefail
          git rm .github/workflows/claude-chat-integrate.yml scripts/claude_chat_integrate.py scripts/claude_chat_finalize.py
          git config user.name 'FlipAi build integration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release v0.46.19: integrate Claude Chat agent'
          git push origin HEAD:feature/claude-chat-v04619
