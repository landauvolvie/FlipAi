name: claude-chat-integrate

on:
  push:
    branches: [feature/claude-chat-v04619]
    paths:
      - .github/workflows/claude-chat-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/claude-chat-v04619
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply asserted shared-file edits
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:90]!r}")
              p.write_text(s.replace(old, new, 1))

          # Bridge execution: H is a real browser-chat destination, independent of G.
          replace_once('bridge.go', '''\tif !rc.Status && !rc.New && len(m.Attachments) > 0 {
\t\tif rc.Agent == "G" {
\t\t\tprepErr = errors.New("ChatGPT Chat over Google Voice supports text messages in this release; switch to C: or A: for an attachment")
\t\t} else {''', '''\tif !rc.Status && !rc.New && len(m.Attachments) > 0 {
\t\tif rc.Agent == "G" || rc.Agent == "H" {
\t\t\tprepErr = fmt.Errorf("%s over Google Voice supports text messages in this release; switch to C: or A: for an attachment", agentDisplayName(rc.Agent))
\t\t} else {''')

          replace_once('bridge.go', '''\t\tcase "G":
\t\t\terr = b.newChatGPTConversation(ctx)
\t\t\tfinal = "New ChatGPT conversation started."
\t\tdefault:
\t\t\t// Claude sessions are created by the CLI on the turn that uses them.
\t\t\tb.startNewClaudeSession()
\t\t\tfinal = "New Claude conversation started."
\t\t}''', '''\t\tcase "G":
\t\t\terr = b.newChatGPTConversation(ctx)
\t\t\tfinal = "New ChatGPT conversation started."
\t\tcase "H":
\t\t\terr = b.newClaudeChatConversation(ctx)
\t\t\tfinal = "New Claude Chat conversation started."
\t\tdefault:
\t\t\t// Claude sessions are created by the CLI on the turn that uses them.
\t\t\tb.startNewClaudeSession()
\t\t\tfinal = "New Claude conversation started."
\t\t}''')

          replace_once('bridge.go', '''\t} else if rc.Agent == "G" {
\t\tb.event("info", "agent", "ChatGPT Chat command started", rc.Sender, "G", m.ID)
\t\tfinal, err = b.runChatGPTSMS(ctx, rc.Text)
\t} else {
\t\tb.event("info", "agent", "Codex command started", rc.Sender, "C", m.ID)
\t\tfinal, err = b.runCodexWithAttachments(ctx, rc.Text, rc.Sender, inbound)
\t}''', '''\t} else if rc.Agent == "G" {
\t\tb.event("info", "agent", "ChatGPT Chat command started", rc.Sender, "G", m.ID)
\t\tfinal, err = b.runChatGPTSMS(ctx, rc.Text)
\t} else if rc.Agent == "H" {
\t\tb.event("info", "agent", "Claude Chat command started", rc.Sender, "H", m.ID)
\t\tfinal, err = b.runClaudeChatSMS(ctx, rc.Text)
\t} else {
\t\tb.event("info", "agent", "Codex command started", rc.Sender, "C", m.ID)
\t\tfinal, err = b.runCodexWithAttachments(ctx, rc.Text, rc.Sender, inbound)
\t}''')

          # Agents page view model: give the new pane its own server-rendered settings.
          replace_once('ui_page_agents.go', '''\tCodexAccess   agentAccessView
\tClaudeAccess  agentAccessView
\tChatGPTAccess agentAccessView''', '''\tCodexAccess      agentAccessView
\tClaudeAccess     agentAccessView
\tChatGPTAccess    agentAccessView
\tClaudeChatAccess agentAccessView''')

          replace_once('ui_page_agents.go', '''\tcase "G":
\t\tprefix = "chatgpt"
\t}
\treturn prefix + strings.ToUpper(name[:1]) + name[1:]''', '''\tcase "G":
\t\tprefix = "chatgpt"
\tcase "H":
\t\tprefix = "claudeChat"
\t}
\treturn prefix + strings.ToUpper(name[:1]) + name[1:]''')

          replace_once('ui_page_agents.go', '''\tview.CodexAccess = newAgentAccessView(cfg, "C", configuredCodexPrefix(cfg))
\tview.ClaudeAccess = newAgentAccessView(cfg, "A", configuredClaudePrefix(cfg))
\tview.ChatGPTAccess = newAgentAccessView(cfg, "G", configuredChatGPTPrefix(cfg))''', '''\tview.CodexAccess = newAgentAccessView(cfg, "C", configuredCodexPrefix(cfg))
\tview.ClaudeAccess = newAgentAccessView(cfg, "A", configuredClaudePrefix(cfg))
\tview.ChatGPTAccess = newAgentAccessView(cfg, "G", configuredChatGPTPrefix(cfg))
\tview.ClaudeChatAccess = newAgentAccessView(cfg, "H", configuredClaudeChatPrefix(cfg))''')

          replace_once('ui_page_agents.go', '''\t\tInterval: interval, AckDelay: settings.AckDelaySeconds, SMSOnly: agent == "G",
\t\tIsDefault: false,''', '''\t\tInterval: interval, AckDelay: settings.AckDelaySeconds, SMSOnly: agent == "G" || agent == "H",
\t\tIsDefault: false,''')

          replace_once('ui_page_agents.go', 'Hint: "Edit once. Codex, Claude, and ChatGPT Chat all receive this same line."', 'Hint: "Edit once. Codex, Claude, ChatGPT Chat, and Claude Chat all receive this same line."')

          # Shared Agents save handler: validate four unique shortcuts and persist H controls.
          replace_once('ui_actions.go', '''if r.Form.Has("codexPrefix") || r.Form.Has("claudePrefix") || r.Form.Has("chatgptPrefix") || r.Form.Has("newSessionCommand") {
\t\t\tcodexPrefix, claudePrefix, chatGPTPrefix, newSession := configuredCodexPrefix(*cfg), configuredClaudePrefix(*cfg), configuredChatGPTPrefix(*cfg), configuredNewSessionCommand(*cfg)''', '''if r.Form.Has("codexPrefix") || r.Form.Has("claudePrefix") || r.Form.Has("chatgptPrefix") || r.Form.Has("claudeChatPrefix") || r.Form.Has("newSessionCommand") {
\t\t\tcodexPrefix, claudePrefix, chatGPTPrefix, claudeChatPrefix, newSession := configuredCodexPrefix(*cfg), configuredClaudePrefix(*cfg), configuredChatGPTPrefix(*cfg), configuredClaudeChatPrefix(*cfg), configuredNewSessionCommand(*cfg)''')

          replace_once('ui_actions.go', '''\t\t\tif r.Form.Has("chatgptPrefix") {
\t\t\t\tchatGPTPrefix, err = validateCommandToken(r.FormValue("chatgptPrefix"), "ChatGPT shortcut")
\t\t\t\tif err != nil {
\t\t\t\t\treturn err
\t\t\t\t}
\t\t\t}
\t\t\tif strings.EqualFold(codexPrefix, claudePrefix) || strings.EqualFold(codexPrefix, chatGPTPrefix) || strings.EqualFold(claudePrefix, chatGPTPrefix) {
\t\t\t\treturn fmt.Errorf("Codex, Claude, and ChatGPT shortcuts must all be different")
\t\t\t}''', '''\t\t\tif r.Form.Has("chatgptPrefix") {
\t\t\t\tchatGPTPrefix, err = validateCommandToken(r.FormValue("chatgptPrefix"), "ChatGPT shortcut")
\t\t\t\tif err != nil {
\t\t\t\t\treturn err
\t\t\t\t}
\t\t\t}
\t\t\tif r.Form.Has("claudeChatPrefix") {
\t\t\t\tclaudeChatPrefix, err = validateCommandToken(r.FormValue("claudeChatPrefix"), "Claude Chat shortcut")
\t\t\t\tif err != nil {
\t\t\t\t\treturn err
\t\t\t\t}
\t\t\t}
\t\t\tprefixes := []string{codexPrefix, claudePrefix, chatGPTPrefix, claudeChatPrefix}
\t\t\tfor i := range prefixes {
\t\t\t\tfor j := i + 1; j < len(prefixes); j++ {
\t\t\t\t\tif strings.EqualFold(prefixes[i], prefixes[j]) {
\t\t\t\t\t\treturn fmt.Errorf("Codex, Claude, ChatGPT Chat, and Claude Chat shortcuts must all be different")
\t\t\t\t\t}
\t\t\t\t}
\t\t\t}''')

          replace_once('ui_actions.go', '''\t\t\tcfg.CodexPrefix, cfg.ClaudePrefix, cfg.ChatGPTPrefix, cfg.NewSessionCommand = codexPrefix, claudePrefix, chatGPTPrefix, newSession''', '''\t\t\tcfg.CodexPrefix, cfg.ClaudePrefix, cfg.ChatGPTPrefix, cfg.ClaudeChatPrefix, cfg.NewSessionCommand = codexPrefix, claudePrefix, chatGPTPrefix, claudeChatPrefix, newSession''')
          replace_once('ui_actions.go', '''\t\tfor _, agent := range []string{"C", "A", "G"} {
\t\t\tif err := applyAgentAccessForm(cfg, r, agent); err != nil {''', '''\t\tfor _, agent := range []string{"C", "A", "G", "H"} {
\t\t\tif err := applyAgentAccessForm(cfg, r, agent); err != nil {''')
          replace_once('ui_actions.go', '''\t\tcfg.Codex.Instruction = ""
\t\tcfg.Claude.Instruction = ""
\t\tcfg.ChatGPT.Instruction = ""''', '''\t\tcfg.Codex.Instruction = ""
\t\tcfg.Claude.Instruction = ""
\t\tcfg.ChatGPT.Instruction = ""
\t\tcfg.ClaudeChat.Instruction = ""''')

          # Fresh installs are already in the four-agent schema; shutdown waits for both browser agents.
          replace_once('main.go', '''\t\tcfg.Security.AgentsMigrated = true
\t\tcfg.Security.ChatGPTAgentMigrated = true''', '''\t\tcfg.Security.AgentsMigrated = true
\t\tcfg.Security.ChatGPTAgentMigrated = true
\t\tcfg.Security.ClaudeChatAgentMigrated = true''')
          replace_once('main.go', '''!platformVoiceStillOpen() && !chatGPTBrowserStillOpen(dataDir)''', '''!platformVoiceStillOpen() && !chatGPTBrowserStillOpen(dataDir) && !claudeChatBrowserStillOpen(dataDir)''')

          # Preserve an intentional zero-second receipt delay; fresh G/H defaults are already 30 seconds.
          replace_once('agents.go', '''\t\t// Browser-chat agents wait a little before sending a receipt so quick
\t\t// conversational responses do not create a redundant extra SMS.
\t\tif (agent == "G" || agent == "H") && s.AckDelaySeconds == 0 {
\t\t\ts.AckDelaySeconds = 30
\t\t}
''', '')

          # Exactly one Claude Chat WebView2 owner, including the visible one-time login window.
          replace_once('claude_chat_webview_mode_windows.go', '''\tif mode == "--claude-chat-worker" {
\t\trelease, owner, err := acquireNamedInstance(`Local\\FlipAi-ClaudeChat-WebView`, "Claude Chat WebView worker")
\t\tif err == nil {
\t\t\tif !owner {
\t\t\t\tos.Exit(0)
\t\t\t}
\t\t\tclaudeChatWorkerInstanceRelease = release
\t\t}
\t}''', '''\tif mode == "--claude-chat-worker" || mode == "--claude-chat-login" {
\t\trelease, owner, err := acquireNamedInstance(`Local\\FlipAi-ClaudeChat-WebView`, "Claude Chat WebView owner")
\t\tif err == nil {
\t\t\tif !owner {
\t\t\t\tos.Exit(0)
\t\t\t}
\t\t\tclaudeChatWorkerInstanceRelease = release
\t\t}
\t}''')

          # Never mistake the newly-sent user bubble for Claude's answer.
          replace_once('claude_chat_webview_windows.go', '''  const assistants=()=>unique([
    ...all('[data-testid="assistant-message"]'),
    ...all('[data-testid="chat-message-content"]'),
    ...all('.font-claude-response-body'),
    ...all('.font-claude-message'),
    ...all('.standard-markdown')
  ]).filter(n=>text(n));''', '''  const assistants=()=>{
    const explicit=unique([...all('[data-testid="assistant-message"]'),...all('[data-testid="assistant-message"] [data-testid="chat-message-content"]')]).filter(n=>text(n));
    if(explicit.length)return explicit;
    return unique([...all('.font-claude-response-body'),...all('.font-claude-message'),...all('.standard-markdown')]).filter(n=>text(n));
  };''')

          # The mux lives outside the WebView files. Duplicate ChatGPT's four authenticated routes by name.
          routed = False
          for p in Path('.').glob('*.go'):
              s = p.read_text()
              if 'HandleFunc' not in s or '/chatgpt/status.json' not in s:
                  continue
              lines = s.splitlines(True)
              out = []
              added = 0
              for line in lines:
                  out.append(line)
                  if 'HandleFunc' in line and any(x in line for x in ['/chatgpt/status.json', '/chatgpt/connect', '/chatgpt/test', '/chatgpt/disconnect']):
                      clone = line.replace('/chatgpt/', '/claude-chat/').replace('chatGPT', 'claudeChat')
                      if clone not in s:
                          out.append(clone)
                          added += 1
              if added:
                  p.write_text(''.join(out))
                  routed = True
                  print(f'added {added} Claude Chat route(s) in {p}')
          if not routed:
              raise SystemExit('could not find ChatGPT HTTP routes to clone')

      - name: Format and test Linux build
        run: |
          gofmt -w agents.go bridge.go claude_chat_*.go commands.go config.go main.go sms_*.go ui_actions.go ui_actions_agents.go ui_page_agents.go zzzzz_claude_chat_ui.go
          go test ./...
          go vet ./...

      - name: Commit integrated source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/claude-chat-integrate.yml
          git config user.name 'FlipAi build integration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate Claude Chat across routing and Agents UI'
          git push origin HEAD:feature/claude-chat-v04619
