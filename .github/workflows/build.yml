name: build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Generate branded FlipAi icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          .\scripts\Generate-FlipAiIcon.ps1 -OutputPath .\dist\FlipAi.ico

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist\FlipAi.exe .
          if (-not (Test-Path .\dist\FlipAi.exe)) { throw 'FlipAi.exe was not built' }

      - name: Windows background and tray lifecycle smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'FlipAi-Lifecycle-Data'
          $env:AISMSBRIDGE_NO_BROWSER = '1'
          $env:FLIPAI_TRAY_ICON_TEST_CAPTURE = Join-Path $env:RUNNER_TEMP 'flipai-tray-icon.txt'
          Remove-Item $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $env:FLIPAI_TRAY_ICON_TEST_CAPTURE -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null

          function Get-BridgeProcess([string]$arg) {
            @(Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq 'FlipAi.exe' -and ("$($_.CommandLine)" -match [regex]::Escape($arg))
            })
          }
          function Wait-Health([int]$seconds = 20) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 1
                if ($r.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw 'background host never became healthy'
          }
          function Wait-ProcessArg([string]$arg, [int]$seconds = 15, [int]$notPid = 0) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              $p = @(Get-BridgeProcess $arg | Where-Object { $_.ProcessId -ne $notPid })
              if ($p.Count -gt 0) { return $p[0] }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw "process $arg did not appear"
          }
          function Wait-NoBridge([int]$seconds = 15) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              $p = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'FlipAi.exe' })
              if ($p.Count -eq 0) { return }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            $left = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'FlipAi.exe' } | Select-Object ProcessId,CommandLine | Format-Table | Out-String)
            throw "FlipAi processes remained after Quit: $left"
          }

          $launcher = Start-Process -FilePath '.\dist\FlipAi.exe' -PassThru
          if (-not $launcher.WaitForExit(15000)) { throw 'launcher did not exit after opening settings' }
          Wait-Health
          $watchdogProc = Wait-ProcessArg '--watchdog'
          $hostProc = Wait-ProcessArg '--host'
          $trayProc = Wait-ProcessArg '--tray'
          Start-Sleep -Seconds 2
          if ($trayProc.ProcessId -notin @((Get-BridgeProcess '--tray').ProcessId)) { throw 'tray process exited unexpectedly' }
          if (-not (Test-Path $env:FLIPAI_TRAY_ICON_TEST_CAPTURE)) { throw 'tray did not report an icon source' }
          $iconSource = Get-Content $env:FLIPAI_TRAY_ICON_TEST_CAPTURE -Raw
          if ($iconSource -notmatch '^file:.*FlipAi\.ico$') { throw "tray did not load the branded icon: $iconSource" }
          Wait-Health

          $second = Start-Process -FilePath '.\dist\FlipAi.exe' -ArgumentList '--watchdog' -PassThru
          if (-not $second.WaitForExit(5000)) { throw 'duplicate watchdog did not exit' }
          if (@(Get-BridgeProcess '--watchdog').Count -ne 1) { throw 'more than one watchdog is running' }

          $oldHostPid = $hostProc.ProcessId
          Stop-Process -Id $oldHostPid -Force
          $hostProc2 = Wait-ProcessArg '--host' 20 $oldHostPid
          Wait-Health 20

          $oldTrayPid = $trayProc.ProcessId
          Stop-Process -Id $oldTrayPid -Force
          $trayProc2 = Wait-ProcessArg '--tray' 20 $oldTrayPid
          Start-Sleep -Seconds 2
          if ($trayProc2.ProcessId -notin @((Get-BridgeProcess '--tray').ProcessId)) { throw 'restarted tray did not stay alive' }

          Start-Process -FilePath '.\dist\FlipAi.exe' -ArgumentList '--quit' -Wait
          Wait-NoBridge 15
          Start-Sleep -Seconds 2
          Wait-NoBridge 2

      - name: The FlipAi window opens
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The lifecycle test above runs with the window suppressed, which is
          # exactly how a bug that stopped the window opening reached a release.
          # This one opens it for real.
          #
          # The launcher process is the check: it blocks for as long as it owns
          # the window, so a launcher that has exited, or one with no window
          # title, means nothing opened.
          $dataDir = Join-Path $env:RUNNER_TEMP 'FlipAi-Window-Opens'
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $env:LOCALAPPDATA = $dataDir
          Remove-Item Env:AISMSBRIDGE_NO_BROWSER -ErrorAction SilentlyContinue
          Remove-Item Env:FLIPAI_BROWSER_TEST_CAPTURE -ErrorAction SilentlyContinue

          Start-Process -FilePath '.\dist\FlipAi.exe'
          $deadline = (Get-Date).AddSeconds(90)
          $window = $null
          do {
            $launcher = @(Get-CimInstance Win32_Process |
              Where-Object { $_.Name -eq 'FlipAi.exe' -and "$($_.CommandLine)" -notmatch '--' })
            foreach ($p in $launcher) {
              $proc = Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
              if ($proc -and $proc.MainWindowTitle -eq 'FlipAi') { $window = $proc; break }
            }
            if ($window) { break }
            Start-Sleep -Milliseconds 500
          } while ((Get-Date) -lt $deadline)

          if (-not $window) {
            @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'FlipAi.exe' } |
              Select-Object ProcessId,CommandLine | Format-Table | Out-String) | Write-Host
            @(Get-Process -Name FlipAi -ErrorAction SilentlyContinue |
              Select-Object Id,MainWindowTitle | Format-Table | Out-String) | Write-Host
            throw 'FlipAi did not open its desktop window'
          }
          Write-Host "FlipAi window is open (pid $($window.Id))."

          Start-Process -FilePath '.\dist\FlipAi.exe' -ArgumentList '--quit' -Wait
          Start-Sleep -Seconds 2
          Get-Process -Name FlipAi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Google Voice window opens on a real desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $env:RUNNER_TEMP 'FlipAi-Voice-Window'
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $env:LOCALAPPDATA = $dataDir
          $env:AISMSBRIDGE_NO_BROWSER = '1'
          $stateFile = Join-Path $dataDir 'AISMSBridge\voice-call-state.json'

          function Get-VoiceState {
            if (-not (Test-Path $stateFile)) { return $null }
            try { return Get-Content $stateFile -Raw | ConvertFrom-Json } catch { return $null }
          }
          function Show-VoiceState([string]$why) {
            Write-Host "--- $why ---"
            Write-Host "session id: $((Get-Process -Id $PID).SessionId)"
            if (Test-Path $stateFile) { Get-Content $stateFile -Raw | Write-Host }
            else { Write-Host 'voice-call-state.json was never written' }
            @(Get-Process -Name FlipAi -ErrorAction SilentlyContinue |
              Select-Object Id,MainWindowTitle | Format-Table | Out-String) | Write-Host
          }
          # A window on screen is not Google Voice. The frame is a plain Win32
          # window, created in a few hundred milliseconds; WebView2 is embedded
          # into it afterwards and that step can fail, taking the window with
          # it. browserRunning is the window process saying the browser is
          # really up, so it is what these checks wait for.
          function Wait-VoiceRunning([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              $s = Get-VoiceState
              if ($s -and $s.browserRunning) { return 'running' }
              if ($s -and $s.lastOpenError) { return 'failed' }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            return 'timeout'
          }
          function Wait-VoiceWindow([int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              $p = @(Get-Process -Name FlipAi -ErrorAction SilentlyContinue |
                     Where-Object { $_.MainWindowTitle -like '*Google Voice*' })
              if ($p.Count -gt 0) { return $p[0] }
              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)
            return $null
          }
          function Stop-AllFlipAi {
            Get-Process -Name FlipAi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

          # 1. The window process on its own. This is what Open ultimately runs,
          #    and it is also the preflight: a hosted runner that cannot embed
          #    WebView2 in a second window cannot exercise any of this, and
          #    that is a fact about the runner rather than about FlipAi. It is
          #    reported and the checks are skipped, never passed silently.
          Start-Process -FilePath '.\dist\FlipAi.exe' -ArgumentList '--google-voice','--visible'
          $state = Wait-VoiceRunning 120
          if ($state -ne 'running') {
            Show-VoiceState "Google Voice did not finish loading ($state)"
            $s = Get-VoiceState
            $reason = if ($s) { "$($s.lastOpenError)$($s.lastError)" } else { '' }
            Stop-AllFlipAi
            if ($state -eq 'timeout' -and -not $reason) {
              throw 'the Google Voice window process never reported success or failure'
            }
            if ($reason -notmatch 'WebView2') {
              throw "Google Voice failed to load for a reason that is not the runner's WebView2: $reason"
            }
            Write-Host "::warning::This runner cannot embed WebView2 in the Google Voice window ($reason); skipping the Google Voice desktop checks."
            exit 0
          }
          $win = Wait-VoiceWindow 30
          if (-not $win) {
            Show-VoiceState 'Google Voice is running but has no window'
            throw 'FlipAi --google-voice did not create a window'
          }
          Write-Host "Google Voice window: '$($win.MainWindowTitle)' (pid $($win.Id))"
          Show-VoiceState 'window is up'
          Stop-Process -Id $win.Id -Force
          Start-Sleep -Seconds 3

          # 2. The path the Open button actually takes: the running app, the
          #    loopback voice endpoint, and the same Origin the desktop UI
          #    sends. /open must not report success over a window that is not
          #    there -- that false success is what made a window that opened
          #    and vanished look like it had worked.
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $launcher = Start-Process -FilePath '.\dist\FlipAi.exe' -PassThru
          if (-not $launcher.WaitForExit(20000)) { throw 'launcher did not exit' }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            try { if ((Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 1).StatusCode -eq 200) { break } } catch {}
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)

          $open = $null
          try {
            $open = Invoke-WebRequest 'http://127.0.0.1:8771/open' -Method POST -UseBasicParsing -TimeoutSec 120 `
              -Headers @{ Origin = 'http://127.0.0.1:8765'; 'Content-Type' = 'application/json' } -Body '{}'
          } catch {
            Show-VoiceState 'POST /open failed'
            throw "POST /open failed: $($_.Exception.Message)"
          }
          if ($open.StatusCode -ne 200) { Show-VoiceState 'bad /open status'; throw "/open returned $($open.StatusCode)" }
          $s = Get-VoiceState
          if (-not ($s -and $s.browserRunning)) {
            Show-VoiceState '/open reported success without Google Voice running'
            throw '/open reported success but Google Voice is not running'
          }
          $win = Wait-VoiceWindow 30
          if (-not $win) {
            Show-VoiceState '/open reported success with no window'
            throw '/open reported success but no Google Voice window exists'
          }
          Write-Host "Open button path produced: '$($win.MainWindowTitle)'"
          Show-VoiceState 'open button path succeeded'
          Start-Process -FilePath '.\dist\FlipAi.exe' -ArgumentList '--quit' -Wait
          Start-Sleep -Seconds 3
          Stop-AllFlipAi

          # 3. Quit has to take everything with it, including the Google Voice
          #    window, or the data folder stays locked and a second host can
          #    keep polling the mailbox.
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $launcher = Start-Process -FilePath '.\dist\FlipAi.exe' -PassThru
          if (-not $launcher.WaitForExit(20000)) { throw 'launcher did not exit' }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            try { if ((Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 1).StatusCode -eq 200) { break } } catch {}
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          Start-Process -FilePath '.\dist\FlipAi.exe' -ArgumentList '--google-voice','--visible'
          if ((Wait-VoiceRunning 120) -ne 'running') { Show-VoiceState 'Google Voice missing before quit'; throw 'Google Voice did not load before the quit test' }
          Start-Process -FilePath '.\dist\FlipAi.exe' -ArgumentList '--quit' -Wait
          $left = @(Get-Process -Name FlipAi -ErrorAction SilentlyContinue)
          if ($left.Count -gt 0) {
            Show-VoiceState 'processes survived quit'
            throw "Quit left $($left.Count) FlipAi process(es) running"
          }
          Write-Host 'Quit stopped every FlipAi process, Google Voice window included.'

      - name: Microsoft Defender scan app (when available)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) -or -not (Get-Command Start-MpScan -ErrorAction SilentlyContinue)) {
            Write-Host 'Microsoft Defender PowerShell cmdlets are not installed on this hosted runner.'
            exit 0
          }
          $exe = (Resolve-Path '.\dist\FlipAi.exe').Path
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($null -eq $status -or -not $status.AntivirusEnabled) {
            Write-Host 'Microsoft Defender is not enabled on this hosted runner.'
            exit 0
          }
          Start-MpScan -ScanType CustomScan -ScanPath $exe
          $hits = @()
          if (Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue) {
            $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
              $_.Resources -and (($_.Resources -join "`n") -match [regex]::Escape($exe))
            })
          }
          if ($hits.Count -gt 0) { throw "Microsoft Defender reported $($hits.Count) detection(s) for FlipAi.exe" }
          Write-Host 'Microsoft Defender reported no detection for FlipAi.exe.'

      - name: Install Inno Setup compiler if needed
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler was not found' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build no-admin Windows Setup EXE
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Remove-Item .\installer-output -Recurse -Force -ErrorAction SilentlyContinue
          & $env:ISCC "/DMyVersion=$version" "/DSourceDir=$((Resolve-Path .\dist).Path)" .\installer\FlipAi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = ".\installer-output\FlipAi-Setup-v$version.exe"
          if (-not (Test-Path $setup)) { throw "Setup EXE not found: $setup" }

      - name: Real installer install, Start Menu, startup, Settings, and uninstall test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Resolve-Path ".\installer-output\FlipAi-Setup-v$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'FlipAi-Installed'
          $dataDir = Join-Path $env:RUNNER_TEMP 'FlipAi-Installed-Data'
          $browserCapture = Join-Path $env:RUNNER_TEMP 'flipai-open-settings.txt'
          $trayCapture = Join-Path $env:RUNNER_TEMP 'flipai-installed-tray-icon.txt'

          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $dataDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $browserCapture,$trayCapture -Force -ErrorAction SilentlyContinue

          $args = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installDir`"")
          $p = Start-Process -FilePath $setup -ArgumentList $args -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }

          $app = Join-Path $installDir 'FlipAi.exe'
          $icon = Join-Path $installDir 'FlipAi.ico'
          $uninstaller = Join-Path $installDir 'unins000.exe'
          foreach ($path in @($app,$icon,$uninstaller)) { if (-not (Test-Path $path)) { throw "installed file missing: $path" } }

          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\FlipAi.lnk'
          if (-not (Test-Path $shortcut)) { throw "Start Menu shortcut missing: $shortcut" }

          $uninstallEntry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Where-Object {
            (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq 'FlipAi'
          } | Select-Object -First 1
          if (-not $uninstallEntry) { throw 'FlipAi is missing from the per-user Windows uninstall registry' }

          $runValue = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction Stop).FlipAi
          if (-not $runValue -or $runValue -notmatch 'FlipAi\.exe.*--watchdog') { throw "FlipAi startup entry is wrong: $runValue" }
          $legacyRun = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name AISMSBridge -ErrorAction SilentlyContinue).AISMSBridge
          if ($legacyRun) { throw 'legacy AISMSBridge startup entry still exists' }

          $env:LOCALAPPDATA = $dataDir
          $env:FLIPAI_BROWSER_TEST_CAPTURE = $browserCapture
          $env:FLIPAI_TRAY_ICON_TEST_CAPTURE = $trayCapture
          Remove-Item Env:AISMSBRIDGE_NO_BROWSER -ErrorAction SilentlyContinue

          function Wait-Health([int]$seconds = 20) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 1
                if ($r.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw 'installed FlipAi host never became healthy'
          }
          function Wait-NoInstalledFlipAi([int]$seconds = 15) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              $p = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'FlipAi.exe' })
              if ($p.Count -eq 0) { return }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw 'installed FlipAi processes remained running'
          }

          $launcher = Start-Process -FilePath $app -PassThru
          if (-not $launcher.WaitForExit(15000)) { throw 'installed launcher did not exit' }
          Wait-Health
          Start-Sleep -Seconds 2

          if (-not (Test-Path $browserCapture)) { throw 'Open Settings did not invoke the browser opener' }
          $opened = Get-Content $browserCapture -Raw
          if ($opened -notmatch '^http://127\.0\.0\.1:8765/\?token=') { throw "Settings target is wrong: $opened" }

          if (-not (Test-Path $trayCapture)) { throw 'installed tray did not report its icon source' }
          $traySource = Get-Content $trayCapture -Raw
          if ($traySource -notmatch '^file:.*FlipAi\.ico$') { throw "installed tray used the wrong icon: $traySource" }

          Start-Process -FilePath $app -ArgumentList '--quit' -Wait
          Wait-NoInstalledFlipAi

          $u = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          Start-Sleep -Seconds 1

          if (Test-Path $app) { throw 'FlipAi.exe remained after uninstall' }
          if (Test-Path $shortcut) { throw 'Start Menu shortcut remained after uninstall' }
          $stillRegistered = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Where-Object {
            (Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue).DisplayName -eq 'FlipAi'
          } | Select-Object -First 1
          if ($stillRegistered) { throw 'FlipAi uninstall registry entry remained after uninstall' }
          $startupAfter = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name FlipAi -ErrorAction SilentlyContinue).FlipAi
          if ($startupAfter) { throw 'FlipAi startup entry remained after uninstall' }

      - name: Microsoft Defender scan installer (when available)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) -or -not (Get-Command Start-MpScan -ErrorAction SilentlyContinue)) { exit 0 }
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = (Resolve-Path ".\installer-output\FlipAi-Setup-v$version.exe").Path
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($null -eq $status -or -not $status.AntivirusEnabled) { exit 0 }
          Start-MpScan -ScanType CustomScan -ScanPath $setup
          $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            $_.Resources -and (($_.Resources -join "`n") -match [regex]::Escape($setup))
          })
          if ($hits.Count -gt 0) { throw "Microsoft Defender reported $($hits.Count) detection(s) for the FlipAi installer" }
          Write-Host 'Microsoft Defender reported no detection for the FlipAi installer.'

      - name: SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $setup = ".\installer-output\FlipAi-Setup-v$version.exe"
          $h = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$h  FlipAi-Setup-v$version.exe" | Out-File -Encoding ascii .\installer-output\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FlipAi-Windows-Setup
          path: |
            installer-output/FlipAi-Setup-*.exe
            installer-output/SHA256SUMS.txt
