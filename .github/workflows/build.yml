name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The call flow's closest thing to a real call: the exact script FlipAi injects
  # into Google Voice, and the exact scripts its control channel evaluates, run
  # in real headless Chromium against a stand-in Google Voice page with the real
  # Go call bridge behind them. It needs a Linux runner because that is where
  # Playwright's Chromium installs cleanly, and until now it ran nowhere in CI --
  # every call-flow regression test was passing only on a developer's machine.
  call-flow-in-a-real-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm install -g playwright@1.49.1
          npx --yes playwright@1.49.1 install --with-deps chromium
          echo "FLIPAI_PLAYWRIGHT_MODULE=$(npm root -g)/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Call flow, page script and control channel in headless Chromium
        # Named explicitly and checked for a PASS line, because the failure this
        # job exists to prevent is a browser test reporting "ok" without having
        # run. FLIPAI_PLAYWRIGHT_MODULE is set, so they also fail rather than
        # skip if the browser install did not work.
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'RealBrowser$' . 2>&1 | tee browser.log
          for t in TestGoogleVoiceCallFlowInRealBrowser TestVoiceCardsWorkInARealBrowser; do
            grep -q -- "--- PASS: $t" browser.log || { echo "::error::$t did not run"; exit 1; }
          done

      - name: Full test suite on Linux
        run: go test -count=1 ./...

  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Generate branded FlipAi icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          .\scripts\Generate-FlipAiIcon.ps1 -OutputPath .\dist\FlipAi.ico

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          # Keep Go symbol/debug metadata in the binary. Stripping saves a few
          # megabytes but gives static-analysis engines less structure to inspect
          # and provides no functional benefit for a desktop application.
          go build -trimpath -ldflags "-H=windowsgui" -o dist\FlipAi.exe .
          if (-not (Test-Path .\dist\FlipAi.exe)) { throw 'FlipAi.exe was not built' }

      - name: FlipAi desktop and background lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'FlipAi-Lifecycle'
          Remove-Item Env:AISMSBRIDGE_NO_BROWSER -ErrorAction SilentlyContinue
          Remove-Item $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          Start-Process '.\dist\FlipAi.exe'
          $deadline=(Get-Date).AddSeconds(40)
          do {
            try { if ((Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 1).StatusCode -eq 200) { break } } catch {}
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          try { $h=Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 2 } catch { throw 'FlipAi background host never became healthy' }
          if ($h.StatusCode -ne 200) { throw 'FlipAi health endpoint did not return 200' }
          $window=$null
          $deadline=(Get-Date).AddSeconds(40)
          do {
            $window=Get-Process -Name FlipAi -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -eq 'FlipAi' } | Select-Object -First 1
            if($window){break}
            Start-Sleep -Milliseconds 300
          } while((Get-Date)-lt $deadline)
          if(-not $window){
            @(Get-Process -Name FlipAi -ErrorAction SilentlyContinue | Select-Object Id,MainWindowTitle,Path | Format-Table | Out-String) | Write-Host
            throw 'FlipAi desktop window did not open'
          }
          Start-Process '.\dist\FlipAi.exe' -ArgumentList '--quit' -Wait

          # --quit waits for the host and Google Voice receiver to stop, while
          # the tray/window/watchdog can need a few more scheduler ticks to
          # finish their Win32 message loops. Treat shutdown as successful only
          # when every FlipAi process is actually gone, but allow that graceful
          # cleanup up to 20 seconds instead of racing it with a fixed 2s sleep.
          $left=@()
          $deadline=(Get-Date).AddSeconds(20)
          do {
            $left=@(Get-Process -Name FlipAi -ErrorAction SilentlyContinue)
            if($left.Count -eq 0){break}
            Start-Sleep -Milliseconds 250
          } while((Get-Date)-lt $deadline)
          if($left.Count -gt 0){
            $detail=@(Get-CimInstance Win32_Process -Filter "Name='FlipAi.exe'" -ErrorAction SilentlyContinue |
              Select-Object ProcessId,CommandLine | Format-Table -AutoSize -Wrap | Out-String)
            Write-Host 'FlipAi processes still running:'
            Write-Host $detail
            @($left | Select-Object Id,MainWindowTitle,Path | Format-Table | Out-String) | Write-Host
            $left | Stop-Process -Force -ErrorAction SilentlyContinue
            throw 'FlipAi processes survived Quit for more than 20 seconds'
          }

      - name: Google Voice runs inside FlipAi, with no external browser
        shell: pwsh
        run: |
          .\scripts\Assert-GoogleVoiceReceiver.ps1 `
            -Exe (Resolve-Path .\dist\FlipAi.exe).Path `
            -DataRoot (Join-Path $env:RUNNER_TEMP 'FlipAi-Voice-Receiver')

      - name: Refresh Microsoft Defender intelligence
        shell: pwsh
        run: |
          if(Get-Command Update-MpSignature -ErrorAction SilentlyContinue){
            try { Update-MpSignature | Out-Null } catch { Write-Host "Defender signature refresh was unavailable: $($_.Exception.Message)" }
          }

      - name: Microsoft Defender scan app when available
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)){exit 0}
          $status=Get-MpComputerStatus -ErrorAction SilentlyContinue
          if($null -eq $status -or -not $status.AntivirusEnabled){exit 0}
          $exe=(Resolve-Path '.\dist\FlipAi.exe').Path
          Start-MpScan -ScanType CustomScan -ScanPath $exe
          if(Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue){
            $hits=@(Get-MpThreatDetection -ErrorAction SilentlyContinue|Where-Object {$_.Resources -and (($_.Resources -join "`n") -match [regex]::Escape($exe))})
            if($hits.Count -gt 0){throw "Defender reported $($hits.Count) detection(s) for FlipAi.exe"}
          }

      - name: Install Inno Setup compiler if needed
        shell: pwsh
        run: |
          $candidates=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc=$candidates|Where-Object {Test-Path $_}|Select-Object -First 1
          if(-not $iscc){choco install innosetup --yes --no-progress;$iscc=$candidates|Where-Object {Test-Path $_}|Select-Object -First 1}
          if(-not $iscc){throw 'Inno Setup compiler was not found'}
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          Remove-Item .\installer-output -Recurse -Force -ErrorAction SilentlyContinue
          & $env:ISCC "/DMyVersion=$version" "/DSourceDir=$((Resolve-Path .\dist).Path)" .\installer\FlipAi.iss
          if($LASTEXITCODE -ne 0){throw "ISCC failed with exit code $LASTEXITCODE"}
          $setup=".\installer-output\FlipAi-Setup-v$version.exe"
          if(-not (Test-Path $setup)){throw "Setup EXE not found: $setup"}

      - name: Installer install smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content VERSION -Raw).Trim()
          $setup=(Resolve-Path ".\installer-output\FlipAi-Setup-v$version.exe").Path
          $target=Join-Path $env:LOCALAPPDATA 'Programs\FlipAi'
          Get-Process -Name FlipAi -ErrorAction SilentlyContinue|Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if(-not (Test-Path (Join-Path $target 'FlipAi.exe'))){throw 'Installer did not install FlipAi.exe'}
          $unins=Join-Path $target 'unins000.exe'
          if(-not (Test-Path $unins)){throw 'Installer did not create uninstaller'}

      - name: Microsoft Defender scan installer and installed app when available
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)){exit 0}
          $status=Get-MpComputerStatus -ErrorAction SilentlyContinue
          if($null -eq $status -or -not $status.AntivirusEnabled){exit 0}
          $version=(Get-Content VERSION -Raw).Trim()
          $setup=(Resolve-Path ".\installer-output\FlipAi-Setup-v$version.exe").Path
          $target=Join-Path $env:LOCALAPPDATA 'Programs\FlipAi'
          foreach($path in @($setup,$target)){
            Start-MpScan -ScanType CustomScan -ScanPath $path
            if(Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue){
              $hits=@(Get-MpThreatDetection -ErrorAction SilentlyContinue|Where-Object {$_.Resources -and (($_.Resources -join "`n") -match [regex]::Escape($path))})
              if($hits.Count -gt 0){throw "Defender reported $($hits.Count) detection(s) for $path"}
            }
          }

      - name: Installer uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:LOCALAPPDATA 'Programs\FlipAi'
          $unins=Join-Path $target 'unins000.exe'
          Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          Start-Sleep -Seconds 2
          if(Test-Path (Join-Path $target 'FlipAi.exe')){throw 'Uninstaller left FlipAi.exe behind'}

      - name: SHA-256
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          $setup=".\installer-output\FlipAi-Setup-v$version.exe"
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FlipAi-Setup-v$version.exe" | Set-Content .\installer-output\SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: FlipAi-windows
          path: |
            installer-output/FlipAi-Setup-v*.exe
            installer-output/SHA256SUMS.txt
