name: temporary-protocol-object-key-fix
on:
  push:
    branches:
      - feature/chatgpt-bridge-map-v04610
    paths:
      - .github/workflows/_tmp-protocol-object-keys.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-bridge-map-v04610
          fetch-depth: 0
      - name: Include unquoted request object keys
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chatgpt_protocol_map.go')
          s = p.read_text(encoding='utf-8')
          old = '''\t\tfor _, m := range chatGPTStringKeyRegex.FindAllStringSubmatch(window, 500) {
          \t\t\tif len(m) >= 2 && chatGPTInterestingRequestKeys[m[1]] {
          \t\t\t\tout.RequestShapeKeys = append(out.RequestShapeKeys, path+" -> "+m[1])
          \t\t\t}
          \t\t}
          '''
          new = old + '''\t\tfor _, m := range chatGPTObjectKeyRegex.FindAllStringSubmatch(window, 500) {
          \t\t\tif len(m) >= 2 && chatGPTInterestingRequestKeys[m[1]] {
          \t\t\t\tout.RequestShapeKeys = append(out.RequestShapeKeys, path+" -> "+m[1])
          \t\t\t}
          \t\t}
          '''
          assert old in s, 'request key extraction anchor missing'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          gofmt -w chatgpt_protocol_map.go
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/_tmp-protocol-object-keys.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Map unquoted ChatGPT request object keys"
          git push origin HEAD:feature/chatgpt-bridge-map-v04610
