name: Apply fresh-session bridge patch

on:
  push:
    branches:
      - feature/sms-new-modifier-ui-v04653

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sms-new-modifier-ui-v04653
      - name: Apply focused bridge changes
        shell: python
        run: |
          from pathlib import Path

          p = Path("bridge.go")
          s = p.read_text()

          old = '''\tctx, cancel := context.WithTimeout(parent, timeout)\n\tdefer cancel()\n\n\t// Optional heartbeat so a long turn reports in, the way watching the\n\t// desktop app does. Stops as soon as the turn returns.\n\tif agentSettings(b.cfg, rc.Agent).progressEnabled() && !rc.Status && !rc.New {'''
          new = '''\tctx, cancel := context.WithTimeout(parent, timeout)\n\tdefer cancel()\n\n\t// A NEW modifier may be reset-only (OW NEW:) or reset-and-run\n\t// (OW NEW: research this). Treat the latter as a real agent turn for\n\t// attachments, progress, health, and the final reply.\n\tfreshTurn := rc.New && remoteCommandHasTurn(rc)\n\n\t// Optional heartbeat so a long turn reports in, the way watching the\n\t// desktop app does. Stops as soon as the turn returns.\n\tif agentSettings(b.cfg, rc.Agent).progressEnabled() && !rc.Status && (!rc.New || freshTurn) {'''
          assert s.count(old) == 1, "heartbeat anchor changed"
          s = s.replace(old, new, 1)

          old = '''\tif !rc.Status && !rc.New && len(m.Attachments) > 0 {'''
          new = '''\tif !rc.Status && (!rc.New || freshTurn) && len(m.Attachments) > 0 {'''
          assert s.count(old) == 1, "attachment anchor changed"
          s = s.replace(old, new, 1)

          old = '''\t} else if rc.New {\n\t\tb.event("info", "agent", "Starting a new agent conversation", rc.Sender, rc.Agent, m.ID)'''
          new = '''\t} else if freshTurn {\n\t\tb.event("info", "agent", "Starting a fresh agent conversation and first turn", rc.Sender, rc.Agent, m.ID)\n\t\tfinal, err = b.runFreshAgentTurn(ctx, rc, inbound)\n\t} else if rc.New && remoteCommandHasBrowserMode(rc) {\n\t\tb.event("info", "agent", "Starting a new browser-mode conversation", rc.Sender, rc.Agent, m.ID)\n\t\tfinal, err = b.resetAgentConversation(ctx, rc)\n\t} else if rc.New {\n\t\tb.event("info", "agent", "Starting a new agent conversation", rc.Sender, rc.Agent, m.ID)'''
          assert s.count(old) == 1, "NEW execution anchor changed"
          s = s.replace(old, new, 1)

          old = '''\t// and new-conversation commands never reach an agent, so they say nothing.\n\tif !rc.Status && !rc.New {'''
          new = '''\t// Reset-only commands never reach an agent, but NEW plus a prompt does.\n\tif !rc.Status && (!rc.New || freshTurn) {'''
          assert s.count(old) == 1, "health anchor changed"
          s = s.replace(old, new, 1)

          p.write_text(s)
      - name: Format and verify
        run: |
          gofmt -w bridge.go sms_fresh_turn.go sms_routes.go sms_sticky_chatgpt.go sms_claude_chat.go
          go test ./...
      - name: Commit bridge patch and remove helper workflow
        run: |
          rm .github/workflows/apply-fresh-session-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge.go sms_fresh_turn.go sms_routes.go sms_sticky_chatgpt.go sms_claude_chat.go .github/workflows/apply-fresh-session-patch.yml
          git commit -m "Run NEW modifier as a fresh agent turn"
          git push origin HEAD:feature/sms-new-modifier-ui-v04653
