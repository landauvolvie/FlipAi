name: oneoff-30s-updater-patch

on:
  push:
    branches:
      - codex/update-check-30-seconds

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, '[patch-done]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/update-check-30-seconds
          fetch-depth: 0
      - name: Apply 30-second updater patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('update.go', '// FlipAi ships as a GitHub release. Updates are intentionally quiet: the host\n// checks every five minutes, downloads a newer installer in the background,\n// and leaves installation to the small button beside the version in the app.\nconst (\n\tupdateRepo          = "landauvolvie/FlipAi"\n\tupdateAPI           = "https://api.github.com/repos/" + updateRepo + "/releases/latest"\n\tupdateCheckInterval = 5 * time.Minute\n)\n\n// updateAPIURL is a variable so tests can point the check at a local server.\nvar updateAPIURL = updateAPI', '// FlipAi ships as a GitHub release. Updates are intentionally quiet: the host\n// checks a tiny version marker every 30 seconds, downloads a newer installer\n// in the background, and leaves installation to the small button beside the\n// version in the app. The heavier GitHub release API is only queried after the\n// marker says a newer version exists.\nconst (\n\tupdateRepo          = "landauvolvie/FlipAi"\n\tupdateAPI           = "https://api.github.com/repos/" + updateRepo + "/releases/latest"\n\tupdateVersionFeed   = "https://raw.githubusercontent.com/" + updateRepo + "/main/VERSION"\n\tupdateCheckInterval = 30 * time.Second\n)\n\n// These are variables so tests can point both network checks at local servers.\nvar (\n\tupdateAPIURL         = updateAPI\n\tupdateVersionFeedURL = updateVersionFeed\n)')

          marker_fn = base64.b64decode('').decode()
          p = Path('update.go')
          text = p.read_text(encoding='utf-8')
          anchor = '// fetchLatestRelease asks GitHub for the newest published release. It sends no\n'
          if marker_fn.strip() not in text:
              if anchor not in text:
                  raise SystemExit('missing fetchLatestRelease anchor')
              p.write_text(text.replace(anchor, marker_fn + anchor, 1), encoding='utf-8')

          replace('update.go', '\tinfo, err := fetchLatestRelease(ctx)\n', '\tif !force {\n\t\tmarker, err := fetchLatestVersionMarker(ctx)\n\t\tif err != nil {\n\t\t\tcurrent.CheckedAt = time.Now()\n\t\t\tcurrent.Error = truncate(err.Error(), 200)\n\t\t\tsaveUpdateState(a.statePath, current)\n\t\t\treturn current\n\t\t}\n\t\tif !versionLess(version, marker) {\n\t\t\tcurrent.CheckedAt = time.Now()\n\t\t\tcurrent.Error = ""\n\t\t\tsaveUpdateState(a.statePath, current)\n\t\t\treturn current\n\t\t}\n\t\tif current.Version == marker && current.AssetURL != "" {\n\t\t\tcurrent.CheckedAt = time.Now()\n\t\t\tcurrent.Error = ""\n\t\t\tsaveUpdateState(a.statePath, current)\n\t\t\treturn current\n\t\t}\n\t}\n\tinfo, err := fetchLatestRelease(ctx)\n')
          replace('update.go', '// watchForUpdates performs an early check after startup and then checks exactly\n// every five minutes. A newer release is downloaded and verified immediately,', '// watchForUpdates performs an early check after startup and then checks exactly\n// every 30 seconds. A newer release is downloaded and verified immediately,')

          replace('quiet_updater_test.go', 'func TestAppUpdateCheckIsAlwaysFiveMinutes(t *testing.T) {', 'func TestAppUpdateCheckIsAlwaysThirtySeconds(t *testing.T) {')
          replace('quiet_updater_test.go', 'if got := a.updateInterval(); got != 5*time.Minute {\n\t\tt.Fatalf("update interval = %v, want 5m", got)\n\t}', 'if got := a.updateInterval(); got != 30*time.Second {\n\t\tt.Fatalf("update interval = %v, want 30s", got)\n\t}')

          Path('update_marker_test.go').write_text(base64.b64decode('').decode(), encoding='utf-8')

          replace('config.go', 'const version = "0.46.27"', 'const version = "0.46.28"')
          Path('VERSION').write_text('0.46.28\n', encoding='utf-8')
          replace('installer/FlipAi.iss', '#define MyVersion "0.46.27"', '#define MyVersion "0.46.28"')
          Path('docs/RELEASE-NOTES.md').write_text(base64.b64decode('').decode(), encoding='utf-8')
          PY

          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.go quiet_updater_test.go update_marker_test.go config.go VERSION installer/FlipAi.iss docs/RELEASE-NOTES.md
          git commit -m "Check for FlipAi updates every 30 seconds [patch-done]"
          git push origin HEAD:codex/update-check-30-seconds
