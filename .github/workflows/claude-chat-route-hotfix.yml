name: claude-chat-route-hotfix

on:
  push:
    branches:
      - fix/claude-chat-connect-404-v04620-2
    paths:
      - .github/workflows/claude-chat-route-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/claude-chat-connect-404-v04620-2
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Apply Claude Chat route fix
        run: python scripts/claude_chat_route_hotfix.py
      - name: Format and verify
        run: |
          gofmt -w webui.go config.go claude_chat_routes_test.go
          go test ./...
          go vet ./...
      - name: Commit hotfix source
        run: |
          set -euo pipefail
          git rm .github/workflows/claude-chat-route-hotfix.yml scripts/claude_chat_route_hotfix.py
          git config user.name 'FlipAi hotfix integration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Claude Chat Connect 404 and bump v0.46.20'
          git push origin HEAD:fix/claude-chat-connect-404-v04620-2
