name: patch-v04667-once

on:
  push:
    branches:
      - fix/chatgpt-route-boundaries-v04667
    paths:
      - .github/workflows/patch-v04667.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-route-boundaries-v04667
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          gofmt -w chatgpt_webview_windows.go chatgpt_webview_windows_test.go config.go
          go test ./...
      - name: Commit patched release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ChatGPT Chat/Work route boundaries and prepare v0.46.67"
          git push origin HEAD:fix/chatgpt-route-boundaries-v04667
