name: voice-feature-patch

on:
  push:
    branches: [feature/google-voice-calls]
    paths:
      - .github/workflows/voice-feature-patch.yml

permissions:
  contents: write

jobs:
  patch-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/google-voice-calls
      - name: Update compiled app version and remove one-shot workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.19.0"'
          new = 'const version = "0.20.0"'
          if old not in s and new not in s:
              raise SystemExit('expected version constant was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/voice-feature-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.go
          git commit -m "Bump FlipAi to 0.20.0 for Google Voice calls"
          git push origin HEAD:feature/google-voice-calls
