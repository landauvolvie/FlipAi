name: temporary-v04610-finalizer

on:
  push:
    branches:
      - feature/chatgpt-bridge-map-v04610
    paths:
      - .github/workflows/_tmp-finalize-v04610.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-bridge-map-v04610
          fetch-depth: 0
      - name: Finalize protocol mapper release
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cfg = Path('config.go')
          s = cfg.read_text(encoding='utf-8')
          old = 'const version = "0.46.9"'
          assert old in s, 'version constant anchor missing'
          cfg.write_text(s.replace(old, 'const version = "0.46.10"', 1), encoding='utf-8')
          Path('VERSION').write_text('0.46.10\n', encoding='utf-8')

          arch = Path('chatgpt_architecture_windows.go')
          s = arch.read_text(encoding='utf-8')
          anchor = 'func assessChatGPTDirectPath(p chatGPTDirectProbeResult) string {'
          i = s.find(anchor)
          assert i >= 0, 'assessment function anchor missing'
          replacement = '''func assessChatGPTDirectPath(p chatGPTDirectProbeResult) string {
          \tmappedIPC := strings.ToLower(strings.Join(p.ASARIPCCandidates, " "))
          \tmappedProtocol := strings.ToLower(strings.Join(p.ASARMarkerSources, " "))
          \thasBridgeMap := strings.Contains(mappedIPC, "bridge exposure:") || strings.Contains(mappedIPC, "bridge method:") || strings.Contains(mappedIPC, "ipc binding:")
          \thasExternalSignal := strings.Contains(mappedIPC, "external transport signal:")
          \thasBackendRoute := strings.Contains(mappedProtocol, "backend route:")
          \thasRequestShape := strings.Contains(mappedProtocol, "request key:")
          \thasAuthFlow := strings.Contains(mappedProtocol, "auth flow:")

          \tif hasBridgeMap && hasExternalSignal {
          \t\treturn "FlipAi mapped electronBridge/IPC and also found external-transport-related primitives in the real ChatGPT app bundle. Do not treat that as callable yet: the diagnostic reports the exact files and primitive names so we can determine whether any is actually owned by regular Chat and exposes a stable local endpoint."
          \t}
          \tif hasBridgeMap && hasBackendRoute {
          \t\tif hasRequestShape && hasAuthFlow {
          \t\t\treturn "FlipAi mapped the internal Electron bridge, regular ChatGPT cloud backend routes, conversation request-shape key names, and desktop authentication-flow markers. The Electron bridge is renderer-to-main IPC, not an externally callable API by itself, and this PC still exposes no ChatGPT-owned local listener/debug transport. Option 2 is therefore narrowed to an independently authenticated cloud request path; the diagnostic now contains the static protocol pieces needed to decide whether that can be implemented without copying the desktop app's private session credentials."
          \t\t}
          \t\treturn "FlipAi mapped the internal Electron bridge and regular ChatGPT cloud backend routes. The bridge is renderer-to-main IPC, not an externally callable process API, and there is still no ChatGPT-owned local listener/debug channel. The remaining Option 2 path is an independently authenticated cloud request flow; request/auth shape must be proven before any send test."
          \t}
          \tif hasBridgeMap {
          \t\treturn "FlipAi mapped electronBridge and Electron IPC call directions, but no externally callable regular-Chat transport is proven. Internal ipcRenderer/ipcMain channels cannot be invoked from FlipAi merely because their names are visible."
          \t}
          \tif len(p.ASARIPCCandidates) > 0 {
          \t\treturn "The real Electron app.asar contains IPC/bridge channel names. They are internal application evidence, not proof of an externally callable ChatGPT API."
          \t}
          \tif len(p.ASARMarkerSources) > 0 {
          \t\treturn "The real Electron app.asar contains attributable Chat/backend markers. FlipAi can distinguish regular ChatGPT application code from bundled Codex/browser tooling, but no callable background interface is proven."
          \t}
          \tjoinedExt := strings.ToLower(strings.Join(p.AppExtensions, " "))
          \tif strings.Contains(joinedExt, "windows.appservice") {
          \t\treturn "The ChatGPT package declares a Windows AppService. That is the strongest supported-looking local backend candidate and should be protocol-tested before any cloud/private endpoint."
          \t}
          \tif p.provenTransport() {
          \t\treturn "A ChatGPT-owned live local transport exists. The next implementation should fingerprint that owned transport and test a harmless request before enabling SMS routing."
          \t}
          \tappSpecific := strings.ToLower(strings.Join(p.MarkerSources, " "))
          \tif appSpecific != "" && strings.Contains(appSpecific, "backend-api") {
          \t\treturn "No externally callable local API is exposed, but app-specific installed code references ChatGPT backend-api/conversation machinery. A shippable direct integration would still need a supported authentication/session interface rather than copying private ChatGPT credentials."
          \t}
          \tif len(p.MarkerSources) == 0 && len(p.NoisyMarkerSources) > 0 {
          \t\treturn "The protocol strings found earlier are confined to bundled browser/Codex/runtime tooling, not proven regular ChatGPT Chat code. There is still no safe direct request interface to call."
          \t}
          \tif len(p.ProtocolSchemes) > 0 {
          \t\treturn "The package exposes activation protocol scheme(s), but no local chat backend. Those schemes may open/navigate the app; they are not evidence of a message-send API."
          \t}
          \tif len(p.OpenAIDNSNames) > 0 || len(p.NetworkPeers) > 0 {
          \t\treturn "The desktop client has cloud network activity but no owned local API/IPC endpoint was found. Option 2 is therefore not yet callable without an official local or independently authenticated cloud interface."
          \t}
          \treturn "No ChatGPT-owned local API, app service, debugging channel, or attributable regular-Chat protocol was found. Do not enable SMS routing from this evidence alone."
          }
          '''
          arch.write_text(s[:i] + replacement, encoding='utf-8')

          ui = Path('zzzz_chatgpt_direct_ui.go')
          s = ui.read_text(encoding='utf-8')
          pairs = [
              ('Electron app bundle test', 'Chat request protocol map'),
              ('Map the real Electron app.asar bundle and its background IPC/backend code without controlling the visible app.', 'Map electronBridge, IPC handlers, Chat backend routes, request schema and authentication-flow markers without controlling the visible app.'),
              ('data-test-busy="Inspecting ChatGPT app bundle"', 'data-test-busy="Mapping ChatGPT request protocol"'),
              ('Run app bundle deep scan', 'Map Chat request protocol'),
              ('This is the deepest read-only direct-path test.', 'This is the full read-only protocol map.'),
              ('FlipAi still checks the Windows runtime and package architecture, then opens the installed Electron app.asar index so Chat/backend and IPC clues can be tied to the exact regular ChatGPT JavaScript files instead of bundled Codex, Playwright, browser or runtime noise.', 'FlipAi checks the Windows runtime and then maps the real Electron app.asar: contextBridge exposure, bridge properties, ipcRenderer/ipcMain directions, regular Chat backend routes, conversation request field names, OAuth/PKCE markers, streaming transports, and any server/pipe primitives. Values and credentials are never returned.'),
              ('Indexes regular app-code files and attributes Chat/backend/IPC markers to exact bundle paths.', 'Maps regular app-code files, electronBridge/IPC directions, backend routes, request key names, auth-flow markers and external transport primitives.'),
              ('Keep the regular ChatGPT desktop app open and signed in, then press <b>Run app bundle deep scan</b>. Copy the full result, especially Electron ASAR archives opened, ASAR app-code protocol marker sources, ASAR IPC/bridge candidates, the ASAR scan note, and Direct-backend assessment.', 'Keep the regular ChatGPT desktop app open and signed in, then press <b>Map Chat request protocol</b>. Copy the full result, especially BACKEND ROUTE, REQUEST KEY, AUTH FLOW, BRIDGE EXPOSURE, BRIDGE METHOD, IPC BINDING, EXTERNAL TRANSPORT SIGNAL, the ASAR scan note, and Direct-backend assessment.'),
              ('If app.asar exposes a regular ChatGPT IPC bridge, the next build can map and harmlessly protocol-test that exact channel. If it contains only cloud request code, the result tells us there is no clean local background message interface exposed by the desktop app.', 'This pass distinguishes internal Electron IPC from anything externally callable and maps the cloud request/auth shape at the same time. If no external transport exists, we should know whether Option 2 can only work through an independent authenticated ChatGPT cloud session rather than a local desktop bridge.'),
          ]
          for old_text, new_text in pairs:
              assert old_text in s, f'UI anchor missing: {old_text[:60]}'
              s = s.replace(old_text, new_text, 1)
          ui.write_text(s, encoding='utf-8')

          release_lines = [
              '# FlipAi v0.46.10',
              '',
              'This release follows the v0.46.9 ASAR result, which found the real ChatGPT Electron bundle, `electronBridge`, regular ChatGPT backend routes, conversation/WebSocket markers, and internal Electron IPC names while still proving that no ChatGPT-owned local listener or DevTools transport is exposed.',
              '',
              '## Full Chat request protocol map',
              '',
              '- Maps `contextBridge.exposeInMainWorld` exposure names, including `electronBridge`.',
              '- Maps `ipcRenderer` calls and `ipcMain` handlers by direction and channel name.',
              '- Maps bridge method/property names near the exposed Electron bridge without returning their values.',
              '- Extracts regular ChatGPT `/backend-api` and `/conversation` route paths with query strings removed.',
              '- Extracts conversation request-shape **key names only** around those routes, such as message/conversation/model/parent identifiers when present.',
              '- Detects OAuth/PKCE flow markers (`auth.openai.com`, authorize, client-id field, redirect field, code challenge/verifier) without reading or returning credentials.',
              '- Identifies streaming/runtime mechanisms such as WebSocket, SSE, fetch, Electron net, MessagePort/MessageChannel, utility processes and webContents messaging.',
              '- Looks for external-callability primitives such as Node servers, WebSocketServer, Windows pipe paths, stdin/stdout and Electron protocol handlers, attributed to exact app-bundle files.',
              '- Updates the Direct-backend assessment so internal Electron IPC is never mistaken for an API FlipAi can call from another process.',
              '',
              '## Privacy boundary',
              '',
              'The mapper remains static package inspection only. It does not read ChatGPT cookies, tokens, Local Storage, IndexedDB, session storage, request bodies, network payloads, Windows credential values, process memory, or full process command lines. It does not enable DevTools, use accessibility, move the mouse, type into ChatGPT, or launch a hidden ChatGPT browser.',
              '',
              '## What to do',
              '',
              'Keep ChatGPT desktop open and signed in. In FlipAi go to **Agents -> ChatGPT Chat -> Map Chat request protocol** and copy the complete result. The decisive lines are **BRIDGE EXPOSURE**, **BRIDGE METHOD**, **IPC BINDING**, **BACKEND ROUTE**, **REQUEST KEY**, **AUTH FLOW**, **EXTERNAL TRANSPORT SIGNAL**, the ASAR scan note, and **Direct-backend assessment**.',
              '',
          ]
          Path('docs/RELEASE-NOTES.md').write_text('\n'.join(release_lines), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/_tmp-finalize-v04610.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize ChatGPT protocol mapper v0.46.10"
          git push origin HEAD:feature/chatgpt-bridge-map-v04610
