name: release-v0.46.30

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/version-lockstep-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  prepare-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare v0.46.30 in lockstep
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{path} did not contain expected {old!r}')
              p.write_text(s.replace(old, new, 1))

          replace_once('VERSION', '0.46.29', '0.46.30')
          replace_once('config.go', 'const version = "0.46.29"', 'const version = "0.46.30"')
          replace_once('installer/FlipAi.iss', '#define MyVersion "0.46.29"', '#define MyVersion "0.46.30"')

          notes = [
              '# FlipAi v0.46.30',
              '',
              'Agent logos now render correctly and consistently throughout FlipAi.',
              '',
              '## Agent logos',
              '',
              '- Replaced the hand-drawn approximations with current web-sourced SVG product marks for OpenAI / ChatGPT, Codex, Claude Code, Claude, Grok, and Gemini.',
              '- The uploaded reference screenshots are not used as application assets.',
              '- Codex and Gemini are rendered as isolated SVG images so their gradient IDs cannot collide when the same logo appears multiple times on one page.',
              '- Removed legacy background and recoloring rules that were turning Codex into a blank square and Gemini into a blue block.',
              '- The same shared marks are used on the Agents page, Activity filters, and Activity rows.',
              '',
              '## Reliability',
              '',
              '- Added regression tests for all six agent-to-logo mappings and for isolated SVG rendering.',
              '- Browser, Linux, Windows, race, Google Voice, Defender, installer, and uninstall smoke checks passed before this release was prepared.',
              '',
          ]
          Path('docs/RELEASE-NOTES.md').write_text('\n'.join(notes))
          PY

          test "$(tr -d '\r\n' < VERSION)" = "0.46.30"
          grep -q 'const version = "0.46.30"' config.go
          grep -q '#define MyVersion "0.46.30"' installer/FlipAi.iss
          grep -q '# FlipAi v0.46.30' docs/RELEASE-NOTES.md

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION config.go installer/FlipAi.iss docs/RELEASE-NOTES.md
          git commit -m 'Release FlipAi v0.46.30'
          git push origin HEAD:main

      - name: Publish v0.46.30
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
