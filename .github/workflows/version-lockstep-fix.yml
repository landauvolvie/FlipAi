name: version-lockstep-fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/version-lockstep-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  fix-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep version constants in lockstep
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.46.28"'
          new = 'const version = "0.46.29"'
          if old not in s:
              raise SystemExit('config.go did not contain expected 0.46.28 version constant')
          p.write_text(s.replace(old, new, 1))

          p = Path('installer/FlipAi.iss')
          s = p.read_text()
          old = '#define MyVersion "0.46.28"'
          new = '#define MyVersion "0.46.29"'
          if old not in s:
              raise SystemExit('installer did not contain expected 0.46.28 fallback version')
          p.write_text(s.replace(old, new, 1))
          PY
          test "$(tr -d '\r\n' < VERSION)" = "0.46.29"
          grep -q 'const version = "0.46.29"' config.go
          grep -q '#define MyVersion "0.46.29"' installer/FlipAi.iss

      - name: Commit lockstep fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.go installer/FlipAi.iss
          git commit -m 'Keep v0.46.29 version in lockstep'
          git push origin HEAD:main

      - name: Retrigger v0.46.29 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main
