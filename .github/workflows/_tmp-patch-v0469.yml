name: temporary-v0469-integration
on:
  push:
    branches: [feature/chatgpt-asar-deep-scan-v0469]
    paths:
      - .github/workflows/_tmp-patch-v0469.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-asar-deep-scan-v0469
          fetch-depth: 0
      - name: Integrate ASAR diagnostic and bump version
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Result fields.
          replace_once('chatgpt_direct.go',
              '\tNoisyMarkerSources  []string `json:"noisyMarkerSources,omitempty"`\n\tDirectAssessment    string   `json:"directAssessment,omitempty"`',
              '\tNoisyMarkerSources  []string `json:"noisyMarkerSources,omitempty"`\n\tASARArchives        []string `json:"asarArchives,omitempty"`\n\tASARCodeEntries     []string `json:"asarCodeEntries,omitempty"`\n\tASARMarkerSources   []string `json:"asarMarkerSources,omitempty"`\n\tASARIPCCandidates   []string `json:"asarIpcCandidates,omitempty"`\n\tASARScanDetail      string   `json:"asarScanDetail,omitempty"`\n\tDirectAssessment    string   `json:"directAssessment,omitempty"`')

          # Summary output.
          replace_once('chatgpt_direct.go',
              '\tlines = appendSummaryList(lines, "Generic/runtime marker sources ignored for connection decisions", p.NoisyMarkerSources, 20)\n\tif strings.TrimSpace(p.DirectAssessment) != "" {',
              '\tlines = appendSummaryList(lines, "Generic/runtime marker sources ignored for connection decisions", p.NoisyMarkerSources, 20)\n\tlines = appendSummaryList(lines, "Electron ASAR archives opened", p.ASARArchives, 10)\n\tlines = appendSummaryList(lines, "ASAR app-code entries indexed", p.ASARCodeEntries, 40)\n\tlines = appendSummaryList(lines, "ASAR app-code protocol marker sources", p.ASARMarkerSources, 40)\n\tlines = appendSummaryList(lines, "ASAR IPC/bridge candidates", p.ASARIPCCandidates, 40)\n\tif strings.TrimSpace(p.ASARScanDetail) != "" {\n\t\tlines = append(lines, "ASAR scan note: "+strings.TrimSpace(p.ASARScanDetail))\n\t}\n\tif strings.TrimSpace(p.DirectAssessment) != "" {')

          # Run ASAR scan after the broad package survey, then recalculate assessment.
          replace_once('chatgpt_direct.go',
              '\tif err := augmentChatGPTDirectProbe(ctx, &probe); err != nil {\n\t\tprobe.RuntimeSignals = append(probe.RuntimeSignals, "architecture add-on could not complete: "+truncate(err.Error(), 180))\n\t}\n\tprobe.LoopbackPorts',
              '\tif err := augmentChatGPTDirectProbe(ctx, &probe); err != nil {\n\t\tprobe.RuntimeSignals = append(probe.RuntimeSignals, "architecture add-on could not complete: "+truncate(err.Error(), 180))\n\t}\n\tif err := augmentChatGPTASARProbe(ctx, &probe); err != nil {\n\t\tprobe.ASARScanDetail = "ASAR add-on could not complete: " + truncate(err.Error(), 180)\n\t}\n\tprobe.DirectAssessment = assessChatGPTDirectPath(probe)\n\tprobe.LoopbackPorts')

          # Normalize ASAR output.
          replace_once('chatgpt_direct.go',
              '\tprobe.NoisyMarkerSources = uniqueSortedStrings(probe.NoisyMarkerSources)\n\tmessage := probe.summary()',
              '\tprobe.NoisyMarkerSources = uniqueSortedStrings(probe.NoisyMarkerSources)\n\tprobe.ASARArchives = uniqueSortedStrings(probe.ASARArchives)\n\tprobe.ASARCodeEntries = uniqueSortedStrings(probe.ASARCodeEntries)\n\tprobe.ASARMarkerSources = uniqueSortedStrings(probe.ASARMarkerSources)\n\tprobe.ASARIPCCandidates = uniqueSortedStrings(probe.ASARIPCCandidates)\n\tmessage := probe.summary()')

          # Assessment: app.asar is the decisive next evidence because it is the
          # actual Electron application bundle, not bundled browser tooling.
          replace_once('chatgpt_architecture_windows.go',
              'func assessChatGPTDirectPath(p chatGPTDirectProbeResult) string {\n\tjoinedExt := strings.ToLower(strings.Join(p.AppExtensions, " "))',
              'func assessChatGPTDirectPath(p chatGPTDirectProbeResult) string {\n\tif len(p.ASARIPCCandidates) > 0 {\n\t\treturn "The real Electron app.asar contains IPC/bridge channel names. That is now the strongest direct-path evidence: the next build should map those exact channels to their main/preload/renderer handlers and test only a harmless background invocation if the channel is owned by regular ChatGPT Chat."\n\t}\n\tif len(p.ASARMarkerSources) > 0 {\n\t\treturn "The real Electron app.asar contains attributable Chat/backend markers. FlipAi can now distinguish regular ChatGPT application code from bundled Codex/browser tooling; the next build should trace those exact app-bundle call sites before attempting any request."\n\t}\n\tjoinedExt := strings.ToLower(strings.Join(p.AppExtensions, " "))')

          # UI wording.
          replace_once('zzzz_chatgpt_direct_ui.go', 'Run full architecture diagnostic', 'Run app bundle deep scan')
          replace_once('zzzz_chatgpt_direct_ui.go',
              'Find the background protocol used by regular ChatGPT without controlling the visible app.',
              'Map the real Electron app.asar bundle and its background IPC/backend code without controlling the visible app.')
          replace_once('zzzz_chatgpt_direct_ui.go',
              'FlipAi first checks live ChatGPT-owned transports, then safely inspects the installed ChatGPT program package for protocol/IPC clues.',
              'FlipAi checks live ChatGPT-owned transports, Windows package architecture, and now opens the installed Electron app.asar index to attribute protocol/IPC clues to the exact regular-app JavaScript files.')

          # Version.
          Path('VERSION').write_text('0.46.9\n', encoding='utf-8')
          replace_once('config.go', 'const version = "0.46.8"', 'const version = "0.46.9"')

          # Release notes.
          Path('docs/RELEASE-NOTES.md').write_text('''# FlipAi v0.46.9

This release follows the v0.46.8 real-PC result: ChatGPT is an Electron/Chromium desktop client, but it exposes no ChatGPT-owned localhost API, DevTools endpoint, named pipe, Windows AppService, or message-send activation protocol. The only registered protocol is `codex://`, and the earlier backend-looking strings were not attributable to regular ChatGPT app code.

## Electron app.asar deep scan

- Parses Electron `app.asar` directly instead of treating it as an opaque binary blob.
- Reads the ASAR file index and attributes findings to exact application-bundle paths.
- Scans regular app JavaScript/JSON/HTML while excluding `node_modules`, CUA, Playwright, PDF.js, Codex app tools, browser/chrome plugins, locales and asset noise.
- Reports app-code entries, strong Chat/backend/conversation markers and Electron IPC/bridge channel candidates such as `ipcMain.handle`, `ipcRenderer.invoke/send`, and `contextBridge.exposeInMainWorld` names.
- Recalculates the Direct-backend assessment after the ASAR scan so app-bundle evidence outranks generic runtime strings.
- Keeps the diagnostic read-only: no accessibility, mouse/keyboard automation, hidden ChatGPT browser, DevTools enabling, protocol invocation, cookies/tokens, profile storage, process memory or network-payload capture.

## Why this is the next step

The real v0.46.8 result proved there is no externally advertised local ChatGPT transport to call. The next remaining non-invasive source of truth is the Electron application bundle itself. If regular ChatGPT has an internal main/preload/renderer bridge, v0.46.9 should expose the exact channel and file names. If the ASAR contains only direct cloud-request code and no callable bridge, we will know that a clean local background integration is not exposed by the desktop app.

Keep ChatGPT desktop open and signed in, install v0.46.9, go to Agents -> ChatGPT Chat, run **Run app bundle deep scan**, and copy the entire result, especially the ASAR sections and Direct-backend assessment.
''', encoding='utf-8')

          Path('.github/workflows/_tmp-patch-v0469.yml').unlink()
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate ChatGPT app.asar deep diagnostic v0.46.9"
          git push origin HEAD:feature/chatgpt-asar-deep-scan-v0469
