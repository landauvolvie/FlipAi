name: sync-v04671-once

on:
  push:
    branches:
      - fix/muse-agents-ui-v04671

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/muse-agents-ui-v04671
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Synchronize v0.46.71 and validate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.46.70"'
          new = 'const version = "0.46.71"'
          if old not in s:
              raise SystemExit('config.go version anchor not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('installer/FlipAi.iss')
          s = p.read_text()
          old = '#define MyVersion "0.46.70"'
          new = '#define MyVersion "0.46.71"'
          if old not in s:
              raise SystemExit('installer version anchor not found')
          p.write_text(s.replace(old, new, 1))

          Path('VERSION').write_text('0.46.71\n')
          PY
          go test ./...
          go vet ./...
      - name: Commit synchronized version and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/sync-v04671-once.yml
          git config user.name "FlipAi release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize v0.46.71 patch release"
          git push origin HEAD:fix/muse-agents-ui-v04671
