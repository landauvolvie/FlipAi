name: apply-long-turn-no-cap

on:
  push:
    branches: [fix/long-running-model-progress-20260907]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove elapsed-time cap from agent turns'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/long-running-model-progress-20260907
          fetch-depth: 0
      - name: Remove elapsed-time cap and self-delete patch workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bridge.go')
          s = p.read_text()
          old = '''\ttimeout := time.Duration(b.cfg.TurnTimeoutMinutes) * time.Minute
\tif timeout <= 0 {
\t\ttimeout = 90 * time.Minute
\t}
\tctx, cancel := context.WithTimeout(parent, timeout)
\tdefer cancel()
'''
          new = '''\t// Agent/model turns have no elapsed-time deadline. Long browser work, Codex,
\t// Claude Code, research, and image generation may legitimately run for many
\t// minutes. The turn ends only when the provider completes/fails or when the
\t// parent app context is cancelled during a real shutdown.
\tctx, cancel := context.WithCancel(parent)
\tdefer cancel()
'''
          if old not in s:
              raise SystemExit('expected Bridge.execute timeout block was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/apply-long-turn-no-cap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bridge.go .github/workflows/apply-long-turn-no-cap.yml
          git commit -m 'Remove elapsed-time cap from agent turns'
          git push origin HEAD:fix/long-running-model-progress-20260907
