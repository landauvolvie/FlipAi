name: release

# Version, compiled app and installer version are kept in lockstep before publishing.
# Publish the CI-green v0.44 field fix; existing v0.44 assets are replaced only after every release check passes.
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # No release is cut without the call flow having been run in a real browser:
  # the script FlipAi injects into Google Voice and the scripts its control
  # channel evaluates, against a stand-in Google Voice page with the real call
  # bridge behind them. See build.yml for why this needs a Linux runner.
  call-flow-in-a-real-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          set -euo pipefail
          npm install -g playwright@1.49.1
          npx --yes playwright@1.49.1 install --with-deps chromium
          echo "FLIPAI_PLAYWRIGHT_MODULE=$(npm root -g)/playwright/index.mjs" >> "$GITHUB_ENV"

      - name: Call flow, page script and control channel in headless Chromium
        # Named explicitly and checked for a PASS line, because the failure this
        # job exists to prevent is a browser test reporting "ok" without having
        # run. FLIPAI_PLAYWRIGHT_MODULE is set, so they also fail rather than
        # skip if the browser install did not work.
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'RealBrowser$' . 2>&1 | tee browser.log
          for t in TestGoogleVoiceCallFlowInRealBrowser TestVoiceCardsWorkInARealBrowser; do
            grep -q -- "--- PASS: $t" browser.log || { echo "::error::$t did not run"; exit 1; }
          done

      - name: Full test suite on Linux
        run: go test -count=1 ./...

  release-windows-x64:
    needs: call-flow-in-a-real-browser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$'){throw "Invalid VERSION: $version"}
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Generate branded FlipAi icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          .\scripts\Generate-FlipAiIcon.ps1 -OutputPath .\dist\FlipAi.ico

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist\FlipAi.exe .
          if(-not (Test-Path .\dist\FlipAi.exe)){throw 'FlipAi.exe was not built'}

      - name: Google Voice runs inside FlipAi, with no external browser
        shell: pwsh
        run: |
          .\scripts\Assert-GoogleVoiceReceiver.ps1 `
            -Exe (Resolve-Path .\dist\FlipAi.exe).Path `
            -DataRoot (Join-Path $env:RUNNER_TEMP 'FlipAi-Voice-Receiver')

      - name: Install Inno Setup compiler if needed
        shell: pwsh
        run: |
          $candidates=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc=$candidates|Where-Object {Test-Path $_}|Select-Object -First 1
          if(-not $iscc){choco install innosetup --yes --no-progress;$iscc=$candidates|Where-Object {Test-Path $_}|Select-Object -First 1}
          if(-not $iscc){throw 'Inno Setup compiler was not found'}
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version='${{ steps.version.outputs.version }}'
          Remove-Item .\installer-output -Recurse -Force -ErrorAction SilentlyContinue
          & $env:ISCC "/DMyVersion=$version" "/DSourceDir=$((Resolve-Path .\dist).Path)" .\installer\FlipAi.iss
          if($LASTEXITCODE -ne 0){throw "ISCC failed with exit code $LASTEXITCODE"}
          $setup=".\installer-output\FlipAi-Setup-v$version.exe"
          if(-not (Test-Path $setup)){throw "Setup EXE not found: $setup"}

      - name: Real installer smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='${{ steps.version.outputs.version }}'
          $setup=(Resolve-Path ".\installer-output\FlipAi-Setup-v$version.exe").Path
          $target=Join-Path $env:LOCALAPPDATA 'Programs\FlipAi'
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if(-not (Test-Path (Join-Path $target 'FlipAi.exe'))){throw 'Installer did not install FlipAi.exe'}
          $unins=Join-Path $target 'unins000.exe'
          if(-not (Test-Path $unins)){throw 'Installer did not create uninstaller'}
          Start-Process $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          if(Test-Path (Join-Path $target 'FlipAi.exe')){throw 'Uninstaller left FlipAi.exe behind'}

      - name: Microsoft Defender scan installer when available
        shell: pwsh
        run: |
          if(-not (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue)){exit 0}
          $status=Get-MpComputerStatus -ErrorAction SilentlyContinue
          if($null -eq $status -or -not $status.AntivirusEnabled){exit 0}
          $version='${{ steps.version.outputs.version }}'
          $setup=(Resolve-Path ".\installer-output\FlipAi-Setup-v$version.exe").Path
          Start-MpScan -ScanType CustomScan -ScanPath $setup
          if(Get-Command Get-MpThreatDetection -ErrorAction SilentlyContinue){
            $hits=@(Get-MpThreatDetection -ErrorAction SilentlyContinue|Where-Object {$_.Resources -and (($_.Resources -join "`n") -match [regex]::Escape($setup))})
            if($hits.Count -gt 0){throw "Defender reported $($hits.Count) detection(s) for the installer"}
          }

      - name: SHA-256
        shell: pwsh
        run: |
          $version='${{ steps.version.outputs.version }}'
          $setup=".\installer-output\FlipAi-Setup-v$version.exe"
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FlipAi-Setup-v$version.exe" | Set-Content .\installer-output\SHA256SUMS.txt -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $version='${{ steps.version.outputs.version }}'
          $tag='v'+$version
          $setup=".\installer-output\FlipAi-Setup-v$version.exe"
          # The notes ship with the change they describe, so they are reviewed
          # with it rather than written into this workflow after the fact.
          $notesFile='.\docs\RELEASE-NOTES.md'
          if(-not (Test-Path $notesFile)){throw "docs/RELEASE-NOTES.md is missing; release notes ship with the release"}
          $notes=Get-Content $notesFile -Raw
          if($notes -notmatch [regex]::Escape($version)){throw "docs/RELEASE-NOTES.md does not describe $version"}
          # Native command output cannot be used as the condition here because
          # it is redirected to $null. Check gh's exit code explicitly instead.
          gh release view $tag *> $null
          $releaseExists=($LASTEXITCODE -eq 0)
          if($releaseExists){
            gh release upload $tag $setup .\installer-output\SHA256SUMS.txt --clobber
            if($LASTEXITCODE -ne 0){throw "uploading replacement assets for $tag failed with exit code $LASTEXITCODE"}
            gh release edit $tag --title "FlipAi $tag" --notes-file $notesFile
            if($LASTEXITCODE -ne 0){throw "editing $tag failed with exit code $LASTEXITCODE"}
          } else {
            gh release create $tag $setup .\installer-output\SHA256SUMS.txt --title "FlipAi $tag" --notes-file $notesFile
            if($LASTEXITCODE -ne 0){throw "creating $tag failed with exit code $LASTEXITCODE"}
          }
          Write-Host "Published $tag with the installer and SHA256SUMS.txt"
