name: release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Windows x64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package\docs | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o package\AISMSBridge.exe .
          Copy-Item README.md,LICENSE,SECURITY.md,CONTRIBUTING.md package\
          Copy-Item docs\ARCHITECTURE.md,docs\THREAT-MODEL.md package\docs\

      - name: Windows lifecycle smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'AISMSBridge-Lifecycle'
          $env:AISMSBRIDGE_NO_BROWSER = '1'
          Remove-Item $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null

          function Get-BridgeProcess([string]$arg) {
            @(Get-CimInstance Win32_Process | Where-Object {
              $_.Name -eq 'AISMSBridge.exe' -and ("$($_.CommandLine)" -match [regex]::Escape($arg))
            })
          }
          function Wait-Health([int]$seconds = 20) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              try {
                $r = Invoke-WebRequest 'http://127.0.0.1:8765/health' -UseBasicParsing -TimeoutSec 1
                if ($r.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw 'background host never became healthy'
          }
          function Wait-ProcessArg([string]$arg, [int]$seconds = 15, [int]$notPid = 0) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              $p = @(Get-BridgeProcess $arg | Where-Object { $_.ProcessId -ne $notPid })
              if ($p.Count -gt 0) { return $p[0] }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            throw "process $arg did not appear"
          }
          function Wait-NoBridge([int]$seconds = 15) {
            $deadline = (Get-Date).AddSeconds($seconds)
            do {
              $p = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'AISMSBridge.exe' })
              if ($p.Count -eq 0) { return }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            $left = @(Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'AISMSBridge.exe' } | Select-Object ProcessId,CommandLine | Format-Table | Out-String)
            throw "bridge processes remained after Quit: $left"
          }

          $launcher = Start-Process -FilePath '.\package\AISMSBridge.exe' -PassThru
          if (-not $launcher.WaitForExit(15000)) { throw 'launcher did not exit after opening settings' }
          Wait-Health
          $watchdogProc = Wait-ProcessArg '--watchdog'
          $hostProc = Wait-ProcessArg '--host'
          $trayProc = Wait-ProcessArg '--tray'
          Start-Sleep -Seconds 2
          if ($trayProc.ProcessId -notin @((Get-BridgeProcess '--tray').ProcessId)) { throw 'tray process exited unexpectedly' }
          Wait-Health

          $second = Start-Process -FilePath '.\package\AISMSBridge.exe' -ArgumentList '--watchdog' -PassThru
          if (-not $second.WaitForExit(5000)) { throw 'duplicate watchdog did not exit' }
          if (@(Get-BridgeProcess '--watchdog').Count -ne 1) { throw 'more than one watchdog is running' }

          $oldHostPid = $hostProc.ProcessId
          Stop-Process -Id $oldHostPid -Force
          $hostProc2 = Wait-ProcessArg '--host' 20 $oldHostPid
          Wait-Health 20

          $oldTrayPid = $trayProc.ProcessId
          Stop-Process -Id $oldTrayPid -Force
          $trayProc2 = Wait-ProcessArg '--tray' 20 $oldTrayPid
          Start-Sleep -Seconds 2
          if ($trayProc2.ProcessId -notin @((Get-BridgeProcess '--tray').ProcessId)) { throw 'restarted tray did not stay alive' }

          Start-Process -FilePath '.\package\AISMSBridge.exe' -ArgumentList '--quit' -Wait
          Wait-NoBridge 15
          Start-Sleep -Seconds 2
          Wait-NoBridge 2

      - name: Microsoft Defender scan (when available)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path '.\package\AISMSBridge.exe').Path
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($null -eq $status -or -not $status.AntivirusEnabled) {
            Write-Host 'Microsoft Defender is not enabled on this hosted runner; source safety tests still ran.'
            exit 0
          }
          Start-MpScan -ScanType CustomScan -ScanPath $exe
          $hits = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | Where-Object {
            $_.Resources -and (($_.Resources -join "`n") -match [regex]::Escape($exe))
          })
          if ($hits.Count -gt 0) {
            throw "Microsoft Defender reported $($hits.Count) detection(s) for AISMSBridge.exe"
          }
          Write-Host 'Microsoft Defender reported no detection for AISMSBridge.exe.'

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $zip = "AISMSBridge-v$version-windows-x64.zip"
          $exe = "FlipAi-v$version-windows-x64.exe"
          Copy-Item package\AISMSBridge.exe $exe -Force
          Compress-Archive -Path package\* -DestinationPath $zip -Force
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  $exe"
            "$zipHash  $zip"
          ) | Out-File -Encoding ascii SHA256SUMS.txt
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AISMSBridge-windows-x64
          path: |
            ${{ steps.package.outputs.exe }}
            ${{ steps.package.outputs.zip }}
            SHA256SUMS.txt

      - name: Create GitHub Release if this version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $exe = '${{ steps.package.outputs.exe }}'
          $zip = '${{ steps.package.outputs.zip }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged."
            exit 0
          }
          gh release create $tag $exe $zip SHA256SUMS.txt --target $env:GITHUB_SHA --title "FlipAi $tag" --generate-notes
