name: bump-settings-v0464

on:
  push:
    branches:
      - release/settings-v0.46.4
    paths:
      - .github/workflows/bump-settings-v0464.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/settings-v0.46.4

      - name: Bump compiled version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'const version = "0.46.3"' config.go
          sed -i 's/const version = "0.46.3"/const version = "0.46.4"/' config.go
          grep -q 'const version = "0.46.4"' config.go
          rm .github/workflows/bump-settings-v0464.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.go .github/workflows/bump-settings-v0464.yml
          git commit -m 'Bump FlipAi app version to 0.46.4'
          git push origin HEAD:release/settings-v0.46.4
