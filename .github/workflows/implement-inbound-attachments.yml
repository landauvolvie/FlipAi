name: implement-inbound-attachments

on:
  push:
    branches: [feature/inbound-google-voice-attachments]
    paths:
      - .github/workflows/implement-inbound-attachments.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inbound-google-voice-attachments
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply source integration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch target missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace("gmail.go",
          '''type GmailMessage struct {
          \tID, Subject, From, ReplyTo, AuthenticationResults, Body, Snippet string
          \tInternalDate                                                     time.Time
          }
          ''',
          '''type GmailMessage struct {
          \tID, Subject, From, ReplyTo, AuthenticationResults, Body, Snippet string
          \tInternalDate                                                     time.Time
          \tAttachments                                                      []MailAttachment
          }
          ''')

          replace("imap.go",
          '''\tbody, _ := extractMailBody(m.Header, m.Body)
          ''',
          '''\tbody, attachments, _ := extractMailContent(m.Header, m.Body)
          ''')

          replace("imap.go",
          '''\treturn GmailMessage{ID: id, Subject: subject, From: from, ReplyTo: replyTo, AuthenticationResults: authResults, Body: body, Snippet: snippet, InternalDate: internalDate}, nil
          ''',
          '''\treturn GmailMessage{ID: id, Subject: subject, From: from, ReplyTo: replyTo, AuthenticationResults: authResults, Body: body, Snippet: snippet, InternalDate: internalDate, Attachments: attachments}, nil
          ''')

          replace("bridge.go",
          '''\tcmd := extractGoogleVoiceCommand(m.Body)
          \tif cmd == "" {
          \t\treturn "", sender, false, "Google Voice message contained no SMS command text"
          \t}
          ''',
          '''\tcmd := extractGoogleVoiceCommand(m.Body)
          \tif cmd == "" && !hasSupportedMailAttachments(m.Attachments) {
          \t\treturn "", sender, false, "Google Voice message contained no SMS command text or supported attachment"
          \t}
          ''')

          replace("bridge.go",
          '''\t\trc, err := parseRemoteCommand(raw, b.cfg, senderAgent)
          ''',
          '''\t\trc, err := parseRemoteCommandForMessage(raw, b.cfg, senderAgent, m)
          ''')

          replace("bridge.go",
          '''\tvar final string
          \tvar err error
          \tif rc.Status {
          ''',
          '''\tvar inbound []InboundAttachment
          \tvar cleanupInbound func()
          \tvar prepErr error
          \tif !rc.Status && !rc.New && len(m.Attachments) > 0 {
          \t\tinbound, cleanupInbound, prepErr = prepareInboundAttachments(m.Attachments)
          \t\tif cleanupInbound != nil {
          \t\t\tdefer cleanupInbound()
          \t\t}
          \t}

          \tvar final string
          \tvar err error
          \tif prepErr != nil {
          \t\terr = prepErr
          \t} else if rc.Status {
          ''')

          replace("bridge.go",
          '''\t\tfinal, err = b.runClaude(ctx, rc.Text, rc.Sender)
          ''',
          '''\t\tfinal, err = b.runClaude(ctx, rc.Text, rc.Sender, inbound)
          ''')

          replace("bridge.go",
          '''\t\tfinal, err = b.runCodex(ctx, rc.Text, rc.Sender)
          ''',
          '''\t\tfinal, err = b.runCodex(ctx, rc.Text, rc.Sender, inbound)
          ''')

          replace("bridge.go",
          '''func (b *Bridge) runClaude(ctx context.Context, command, sender string) (string, error) {
          \tif b.claude == nil {
          \t\treturn "", errors.New("Claude Code unavailable")
          \t}
          \tprompt := b.composePrompt("A", command)
          ''',
          '''func (b *Bridge) runClaude(ctx context.Context, command, sender string, attachments []InboundAttachment) (string, error) {
          \tif b.claude == nil {
          \t\treturn "", errors.New("Claude Code unavailable")
          \t}
          \tprompt := promptForInboundAttachments(b.composePrompt("A", command), attachments)
          ''')

          replace("bridge.go",
          '''func (b *Bridge) runCodex(ctx context.Context, command, sender string) (string, error) {
          ''',
          '''func (b *Bridge) runCodex(ctx context.Context, command, sender string, attachments []InboundAttachment) (string, error) {
          ''')

          replace("bridge.go",
          '''\tparams := map[string]any{"threadId": tid, "input": []map[string]any{{"type": "text", "text": b.composePrompt("C", command)}}}
          ''',
          '''\tprompt := promptForInboundAttachments(b.composePrompt("C", command), attachments)
          \tparams := map[string]any{"threadId": tid, "input": codexInputForInbound(prompt, attachments)}
          ''')

          Path(".github/workflows/implement-inbound-attachments.yml").unlink()
          PY

          gofmt -w attachments.go attachments_test.go gmail.go imap.go bridge.go
          git diff --check
          go test ./...
          go vet ./...
          go test -race ./...

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: relay Google Voice attachments to agents"
          git push origin HEAD:feature/inbound-google-voice-attachments
