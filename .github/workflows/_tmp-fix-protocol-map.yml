name: temporary-protocol-map-fix
on:
  push:
    branches:
      - feature/chatgpt-bridge-map-v04610
    paths:
      - .github/workflows/_tmp-fix-protocol-map.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-bridge-map-v04610
          fetch-depth: 0
      - name: Patch and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('chatgpt_protocol_map.go')
          s = p.read_text(encoding='utf-8')
          old = '\t\t\tif len(m) >= 2 && chatGPTInterestingRequestKeys[m[1]] {\n\t\t\t\tout.RequestShapeKeys = append(out.RequestShapeKeys, path+" -> "+m[1])\n\t\t\t}\n\t}\n\n\tlow := strings.ToLower(text)'
          new = '\t\t\tif len(m) >= 2 && chatGPTInterestingRequestKeys[m[1]] {\n\t\t\t\tout.RequestShapeKeys = append(out.RequestShapeKeys, path+" -> "+m[1])\n\t\t\t}\n\t\t}\n\t}\n\n\tlow := strings.ToLower(text)'
          assert old in s, 'missing request-key loop anchor'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          gofmt -w chatgpt_protocol_map.go chatgpt_direct_test.go chatgpt_architecture_windows.go chatgpt_asar_probe_windows.go
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/_tmp-fix-protocol-map.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix and format ChatGPT protocol mapper"
          git push origin HEAD:feature/chatgpt-bridge-map-v04610
