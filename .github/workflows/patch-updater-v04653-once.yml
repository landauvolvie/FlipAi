name: patch-updater-v04653-once

on:
  push:
    branches:
      - updater-progress-v04653

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updater-progress-v04653
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - name: Apply updater implementation
        run: python3 scripts/patch_updater_v04653.py
      - name: Format
        run: gofmt -w update.go update_status.go update_startup.go main.go webui.go zzzzzzzz_quiet_updater_ui.go quiet_updater_test.go update_startup_test.go config.go
      - name: Validate diff
        run: git diff --check
      - name: Test
        run: go test ./...
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.go update_status.go update_startup.go update_startup_test.go main.go webui.go zzzzzzzz_quiet_updater_ui.go quiet_updater_test.go config.go VERSION installer/FlipAi.iss docs/RELEASE-NOTES.md
          git commit -m "Add progressive resumable updater and restart install"
          git push origin HEAD:updater-progress-v04653
