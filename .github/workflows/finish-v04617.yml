'''
          ack_helpers = insert_after + '''
func (b *Bridge) sendReceipt(ctx context.Context, m GmailMessage, rc remoteCommand, depth int) {
\tagentName := agentDisplayName(rc.Agent)
\tline := "✓ " + agentName + " working on it…"
\tif depth > 1 {
\t\tline = fmt.Sprintf("✓ Queued for %s (%d ahead)…", agentName, depth-1)
\t}
\tb.notify(ctx, m, line)
}

func (b *Bridge) scheduleReceipt(ctx context.Context, m GmailMessage, rc remoteCommand, depth int, done <-chan struct{}) {
\tsettings := agentSettings(b.cfg, rc.Agent)
\tif !settings.ackEnabled() {
\t\treturn
\t}
\tdelay := settings.ackDelay()
\tif delay <= 0 {
\t\tb.sendReceipt(ctx, m, rc, depth)
\t\treturn
\t}
\tgo func() {
\t\tt := time.NewTimer(delay)
\t\tdefer t.Stop()
\t\tselect {
\t\tcase <-ctx.Done():
\t\t\treturn
\t\tcase <-done:
\t\t\treturn
\t\tcase <-t.C:
\t\t\t// If completion and the timer became ready together, completion wins.
\t\t\tselect {
\t\t\tcase <-done:
