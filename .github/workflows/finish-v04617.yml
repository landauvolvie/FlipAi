\t\t}
\t\tsort.Slice(kept, func(i, j int) bool { return kept[i].Number < kept[j].Number })
\t\ts.Phones = kept
\t\tif agent == "G" {
\t\t\ts.CallerNames = ""
\t\t} else {
\t\t\tnames, _ := normalizeAllowedCallerLabels(s.CallerNames, false)
\t\t\tkeptNames := names[:0]
\t\t\tfor _, name := range names {
\t\t\t\tkey := strings.ToLower(name)
\t\t\t\tif claimedNames[key] {
\t\t\t\t\tcontinue
\t\t\t\t}
\t\t\t\tclaimedNames[key] = true
\t\t\t\tkeptNames = append(keptNames, name)
\t\t\t}
\t\t\ts.CallerNames = strings.Join(keptNames, "\\n")
\t\t}
\t\tif s.CodeHash == "" {
