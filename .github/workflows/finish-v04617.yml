name: finish-v04617

on:
  push:
    branches:
      - fix/full-single-google-voice-replies-v04616
    paths:
      - .github/workflows/finish-v04617.yml

permissions:
  contents: write

jobs:
  unify-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply unified agent UX and delayed ChatGPT acknowledgement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def rep(path, old, new, expected=1):
              s = read(path)
              n = s.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {n}: {old[:120]!r}')
              write(path, s.replace(old, new, expected))

          def between(path, start, end, replacement):
              s = read(path)
              a = s.find(start)
              if a < 0:
                  raise SystemExit(f'{path}: start marker not found: {start!r}')
              b = s.find(end, a)
              if b < 0:
                  raise SystemExit(f'{path}: end marker not found: {end!r}')
              write(path, s[:a] + replacement + s[b:])

          # -----------------------------------------------------------------
          # Version + one genuinely shared SMS instruction.
          # -----------------------------------------------------------------
          rep('config.go', 'const version = "0.46.16"', 'const version = "0.46.17"')
          rep('config.go',
              'const defaultReplyStyleHint = "Your answer is delivered to the user as an SMS text message, so keep it brief and in plain text."',
              'const defaultReplyStyleHint = "Reply for SMS. Keep it brief and plain text."')
          rep('VERSION', '0.46.16\n', '0.46.17\n')
          rep('installer/FlipAi.iss', '#define MyVersion "0.46.16"', '#define MyVersion "0.46.17"')

          rep('config.go',
              '\tCodexPrefix        string `json:"codexPrefix,omitempty"`\n\tClaudePrefix       string `json:"claudePrefix,omitempty"`\n\tNewSessionCommand  string `json:"newSessionCommand,omitempty"`',
              '\tCodexPrefix        string `json:"codexPrefix,omitempty"`\n\tClaudePrefix       string `json:"claudePrefix,omitempty"`\n\tChatGPTPrefix      string `json:"chatgptPrefix,omitempty"`\n\tNewSessionCommand  string `json:"newSessionCommand,omitempty"`')
          rep('config.go',
              '\tCodex       CodexConfig       `json:"codex"`\n\tClaude      ClaudeConfig      `json:"claude"`',
              '\tCodex       CodexConfig       `json:"codex"`\n\tClaude      ClaudeConfig      `json:"claude"`\n\tChatGPT     ChatGPTConfig     `json:"chatgpt"`')
          rep('config.go',
              'type CodexConfig struct {\n\tAgentSettings\n\n\tApprovalPolicy string `json:"approvalPolicy"`\n}\n\ntype ClaudeConfig struct {',
              'type CodexConfig struct {\n\tAgentSettings\n\n\tApprovalPolicy string `json:"approvalPolicy"`\n}\n\n// ChatGPTConfig gives regular ChatGPT Chat the same SMS-facing shape as the\n// CLI agents. Its browser connection remains separate because the underlying\n// connection mechanism is different.\ntype ChatGPTConfig struct {\n\tAgentSettings\n}\n\ntype ClaudeConfig struct {')
          rep('config.go',
              '\tAgentsMigrated bool `json:"agentsMigrated,omitempty"`',
              '\tAgentsMigrated       bool `json:"agentsMigrated,omitempty"`\n\tChatGPTAgentMigrated bool `json:"chatgptAgentMigrated,omitempty"`')
          rep('config.go',
              '\t\tDefaultAgent: "C", CodexPrefix: defaultCodexPrefix, ClaudePrefix: defaultClaudePrefix, NewSessionCommand: defaultNewSessionCommand,',
              '\t\tDefaultAgent: "C", CodexPrefix: defaultCodexPrefix, ClaudePrefix: defaultClaudePrefix, ChatGPTPrefix: defaultChatGPTPrefix, NewSessionCommand: defaultNewSessionCommand,')
          rep('config.go',
              '\t\tCodex:    CodexConfig{ApprovalPolicy: "never"},\n\t\tClaude:   ClaudeConfig{PermissionMode: claudeFullAccess, UseChrome: true, SessionMode: claudeSessionModePrint},\n\t\tSecurity: SecurityConfig{RequireCode: true},',
              '\t\tCodex:  CodexConfig{ApprovalPolicy: "never"},\n\t\tClaude: ClaudeConfig{PermissionMode: claudeFullAccess, UseChrome: true, SessionMode: claudeSessionModePrint},\n\t\tChatGPT: ChatGPTConfig{AgentSettings: AgentSettings{\n\t\t\tReplyAck: boolPtr(true), ProgressUpdates: boolPtr(true), ProgressIntervalSeconds: 120, AckDelaySeconds: 30,\n\t\t}},\n\t\tSecurity: SecurityConfig{RequireCode: false},')

          between('config.go',
                  'func (c Config) progressIntervalFor(agent string) time.Duration {',
                  '\n}\n\n// replyStyleHintFor',
                  '''func (c Config) progressIntervalFor(agent string) time.Duration {
\tseconds := agentSettings(c, agent).ProgressIntervalSeconds
\tif seconds <= 0 {
\t\tseconds = c.GoogleVoice.ProgressIntervalSeconds
\t}
\tif seconds < 30 {
\t\tseconds = 120
\t}
\treturn time.Duration(seconds) * time.Second
}''')
          between('config.go',
                  'func (c Config) replyStyleHintFor(agent string) string {',
                  '\n}\n\n// normalizeReplyStyleHint',
                  '''func (c Config) replyStyleHintFor(agent string) string {
\t// One instruction applies to every agent. The agent argument remains so the
\t// call sites stay explicit about what they are composing, but it no longer
\t// selects different prompt text.
\t_ = agent
\tif shared := strings.TrimSpace(c.GoogleVoice.ReplyStyleHint); shared != "" {
\t\treturn shared
\t}
\treturn defaultReplyStyleHint
}''')
          rep('config.go',
              '\tcfg.CodexPrefix = normalizeCommandToken(cfg.CodexPrefix, defaultCodexPrefix)\n\tcfg.ClaudePrefix = normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n\tcfg.NewSessionCommand = normalizeCommandToken(cfg.NewSessionCommand, defaultNewSessionCommand)\n\tif strings.EqualFold(cfg.CodexPrefix, cfg.ClaudePrefix) {\n\t\tcfg.CodexPrefix, cfg.ClaudePrefix = defaultCodexPrefix, defaultClaudePrefix\n\t}',
              '\tcfg.CodexPrefix = normalizeCommandToken(cfg.CodexPrefix, defaultCodexPrefix)\n\tcfg.ClaudePrefix = normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n\tcfg.ChatGPTPrefix = normalizeCommandToken(cfg.ChatGPTPrefix, defaultChatGPTPrefix)\n\tcfg.NewSessionCommand = normalizeCommandToken(cfg.NewSessionCommand, defaultNewSessionCommand)\n\tif strings.EqualFold(cfg.CodexPrefix, cfg.ClaudePrefix) || strings.EqualFold(cfg.CodexPrefix, cfg.ChatGPTPrefix) || strings.EqualFold(cfg.ClaudePrefix, cfg.ChatGPTPrefix) {\n\t\tcfg.CodexPrefix, cfg.ClaudePrefix, cfg.ChatGPTPrefix = defaultCodexPrefix, defaultClaudePrefix, defaultChatGPTPrefix\n\t}')

          # Prefix parity.
          rep('commands.go',
              '\tdefaultClaudePrefix      = "A"\n\tdefaultNewSessionCommand = "NEW"',
              '\tdefaultClaudePrefix      = "A"\n\tdefaultChatGPTPrefix     = "G"\n\tdefaultNewSessionCommand = "NEW"')
          rep('commands.go',
              'func configuredClaudePrefix(cfg Config) string {\n\treturn normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n}\n\nfunc configuredNewSessionCommand',
              'func configuredClaudePrefix(cfg Config) string {\n\treturn normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n}\n\nfunc configuredChatGPTPrefix(cfg Config) string {\n\treturn normalizeCommandToken(cfg.ChatGPTPrefix, defaultChatGPTPrefix)\n}\n\nfunc configuredNewSessionCommand')

          # -----------------------------------------------------------------
          # AgentSettings parity: C/A/G all own phones, PIN and reply behavior.
          # -----------------------------------------------------------------
          rep('agents.go',
              '\tReplyAck                *bool `json:"replyAck,omitempty"`\n\tProgressUpdates         *bool `json:"progressUpdates,omitempty"`\n\tProgressIntervalSeconds int   `json:"progressIntervalSeconds,omitempty"`',
              '\tReplyAck                *bool `json:"replyAck,omitempty"`\n\tAckDelaySeconds         int   `json:"ackDelaySeconds,omitempty"`\n\tProgressUpdates         *bool `json:"progressUpdates,omitempty"`\n\tProgressIntervalSeconds int   `json:"progressIntervalSeconds,omitempty"`')
          rep('agents.go',
              'func (s AgentSettings) progressEnabled() bool {\n\tif s.ProgressUpdates == nil {\n\t\treturn true\n\t}\n\treturn *s.ProgressUpdates\n}\n',
              'func (s AgentSettings) progressEnabled() bool {\n\tif s.ProgressUpdates == nil {\n\t\treturn true\n\t}\n\treturn *s.ProgressUpdates\n}\n\nfunc (s AgentSettings) ackDelay() time.Duration {\n\tif s.AckDelaySeconds <= 0 {\n\t\treturn 0\n\t}\n\treturn time.Duration(s.AckDelaySeconds) * time.Second\n}\n')
          between('agents.go',
                  'func agentSettings(cfg Config, agent string) AgentSettings {',
                  '\n}\n\nfunc agentDisplayName',
                  '''func agentSettings(cfg Config, agent string) AgentSettings {
\tswitch agent {
\tcase "A":
\t\treturn cfg.Claude.AgentSettings
\tcase "G":
\t\treturn cfg.ChatGPT.AgentSettings
\tdefault:
\t\treturn cfg.Codex.AgentSettings
\t}
}''')
          between('agents.go',
                  'func agentDisplayName(agent string) string {',
                  '\n}\n\nfunc agentPhoneForSender',
                  '''func agentDisplayName(agent string) string {
\tswitch strings.ToUpper(strings.TrimSpace(agent)) {
\tcase "A":
\t\treturn "Claude"
\tcase "G":
\t\treturn "ChatGPT Chat"
\tcase "B", "CA", "AC":
\t\treturn "Codex and Claude"
\tcase "CG", "GC":
\t\treturn "Codex and ChatGPT Chat"
\tcase "AG", "GA":
\t\treturn "Claude and ChatGPT Chat"
\tcase "CAG", "CGA", "ACG", "AGC", "GCA", "GAC":
\t\treturn "Codex, Claude, and ChatGPT Chat"
\tdefault:
\t\treturn "Codex"
\t}
}''')
          between('agents.go',
                  'func agentForSender(cfg Config, raw string) (agent string, phone AgentPhone, ok bool) {',
                  '\n}\n\n// allAgentPhones',
                  '''func agentForSender(cfg Config, raw string) (agent string, phone AgentPhone, ok bool) {
\tvar marker strings.Builder
\tfound := false
\tsms, voice := false, false
\tfor _, candidate := range []string{"C", "A", "G"} {
\t\tp, exists := agentPhoneForSender(cfg, candidate, raw)
\t\tif !exists {
\t\t\tcontinue
\t\t}
\t\tif !found {
\t\t\tphone = p
\t\t\tfound = true
\t\t}
\t\tif p.AllowsSMS() {
\t\t\tmarker.WriteString(candidate)
\t\t\tsms = true
\t\t}
\t\tif p.AllowsVoice() {
\t\t\tvoice = true
\t\t}
\t}
\tif !found {
\t\treturn "", AgentPhone{}, false
\t}
\tswitch {
\tcase sms && voice:
\t\tphone.Access = AccessAll
\tcase sms:
\t\tphone.Access = AccessSMS
\tdefault:
\t\tphone.Access = AccessVoice
\t}
\treturn marker.String(), phone, true
}''')
          rep('agents.go',
              'for _, agent := range []string{"C", "A"} {\n\t\tout = append(out, agentSettings(cfg, agent).Phones...)',
              'for _, agent := range []string{"C", "A", "G"} {\n\t\tout = append(out, agentSettings(cfg, agent).Phones...)')

          between('agents.go',
                  'func normalizeAgents(cfg *Config) error {',
                  '\n}\n\n// migrateAgentSettings',
                  '''func normalizeAgents(cfg *Config) error {
\tclaimedNames := map[string]string{}
\tfor _, agent := range []string{"C", "A", "G"} {
\t\tsettings := agentSettings(*cfg, agent)
\t\tcleaned, err := normalizeAgentPhones(settings.Phones, nil)
\t\tif err != nil {
\t\t\treturn fmt.Errorf("%s numbers: %w", agentDisplayName(agent), err)
\t\t}
\t\tif agent == "G" {
\t\t\tfor i := range cleaned {
\t\t\t\tcleaned[i].Access = AccessSMS
\t\t\t}
\t\t\tsettings.CallerNames = ""
\t\t} else {
\t\t\tnames, err := normalizeAllowedCallerLabels(settings.CallerNames, true)
\t\t\tif err != nil {
\t\t\t\treturn fmt.Errorf("%s caller names: %w", agentDisplayName(agent), err)
\t\t\t}
\t\t\tfor _, name := range names {
\t\t\t\tkey := strings.ToLower(name)
\t\t\t\tif other, taken := claimedNames[key]; taken {
\t\t\t\t\treturn fmt.Errorf("%s caller names: %q is already an allowed caller on %s; a caller can reach one agent only", agentDisplayName(agent), name, agentDisplayName(other))
\t\t\t\t}
\t\t\t\tclaimedNames[key] = agent
\t\t\t}
\t\t\tsettings.CallerNames = strings.Join(names, "\\n")
\t\t}
\t\tsettings.Phones = cleaned
\t\tsettings.Instruction = "" // retained only for old bridge.json compatibility
\t\tif settings.RequireCode && settings.CodeHash == "" {
\t\t\treturn fmt.Errorf("%s: set a security code before requiring one", agentDisplayName(agent))
\t\t}
\t\tswitch agent {
\t\tcase "A":
\t\t\tcfg.Claude.AgentSettings = settings
\t\tcase "G":
\t\t\tcfg.ChatGPT.AgentSettings = settings
\t\tdefault:
\t\t\tcfg.Codex.AgentSettings = settings
\t\t}
\t}
\treturn nil
}''')
          rep('agents.go',
              '\tif cfg.Security.AgentsMigrated {\n\t\t// Already moved. Running it again would refill a list the user has since\n\t\t// emptied, or hand one agent\'s code back to the other.\n\t\tensureAgentReplyDefaults(cfg)\n\t\treturn\n\t}',
              '\tif cfg.Security.AgentsMigrated {\n\t\t// Already moved. Running it again would refill a list the user has since\n\t\t// emptied, or hand one agent\'s code back to the other.\n\t\tensureAgentReplyDefaults(cfg)\n\t\tmigrateChatGPTAgent(cfg)\n\t\treturn\n\t}')
          rep('agents.go',
              '\tensureAgentReplyDefaults(cfg)\n\tif migrated {',
              '\tensureAgentReplyDefaults(cfg)\n\tmigrateChatGPTAgent(cfg)\n\tif migrated {')

          between('agents.go',
                  '// ensureAgentReplyDefaults gives an agent that has never been configured the',
                  '// setAgentCode stores a per-agent security code.',
                  '''// migrateChatGPTAgent gives G: its own allowlist without breaking upgraded
// installs that already used G through a Codex/Claude phone permission.
func migrateChatGPTAgent(cfg *Config) {
\tif cfg.Security.ChatGPTAgentMigrated {
\t\treturn
\t}
\tcfg.Security.ChatGPTAgentMigrated = true
\tif len(cfg.ChatGPT.Phones) == 0 {
\t\tseen := map[string]bool{}
\t\tfor _, agent := range []string{"C", "A"} {
\t\t\tfor _, p := range agentSettings(*cfg, agent).Phones {
\t\t\t\tif !p.AllowsSMS() || seen[p.Number] {
\t\t\t\t\tcontinue
\t\t\t\t}
\t\t\t\tseen[p.Number] = true
\t\t\t\tp.Access = AccessSMS
\t\t\t\tcfg.ChatGPT.Phones = append(cfg.ChatGPT.Phones, p)
\t\t\t}
\t\t}
\t}
\t// Preserve an existing PIN only when the existing SMS agents agree on it.
\tif cfg.ChatGPT.CodeHash == "" {
\t\tvar secure []AgentSettings
\t\tfor _, agent := range []string{"C", "A"} {
\t\t\ts := agentSettings(*cfg, agent)
\t\t\tif s.RequireCode && s.CodeHash != "" {
\t\t\t\tsecure = append(secure, s)
\t\t\t}
\t\t}
\t\tif len(secure) > 0 {
\t\t\tfirst, same := secure[0], true
\t\t\tfor _, s := range secure[1:] {
\t\t\t\tif s.CodeHash != first.CodeHash || s.CodeSalt != first.CodeSalt {
\t\t\t\t\tsame = false
\t\t\t\t}
\t\t\t}
\t\t\tif same {
\t\t\t\tcfg.ChatGPT.RequireCode = true
\t\t\t\tcfg.ChatGPT.CodeHash = first.CodeHash
\t\t\t\tcfg.ChatGPT.CodeSalt = first.CodeSalt
\t\t\t}
\t\t}
\t}
}

// ensureAgentReplyDefaults gives every destination the same controls. Codex and
// Claude acknowledge immediately; ChatGPT's default config supplies a 30-second
// delay so quick conversational answers do not generate a redundant receipt.
func ensureAgentReplyDefaults(cfg *Config) {
\tfor _, agent := range []string{"C", "A", "G"} {
\t\ts := agentSettings(*cfg, agent)
\t\tif s.ReplyAck == nil {
\t\t\ts.ReplyAck = boolPtr(true)
\t\t}
\t\tif s.ProgressUpdates == nil {
\t\t\ts.ProgressUpdates = boolPtr(true)
\t\t}
\t\tif s.ProgressIntervalSeconds <= 0 {
\t\t\ts.ProgressIntervalSeconds = 120
\t\t}
\t\tif s.AckDelaySeconds < 0 {
\t\t\ts.AckDelaySeconds = 0
\t\t}
\t\tswitch agent {
\t\tcase "A":
\t\t\tcfg.Claude.AgentSettings = s
\t\tcase "G":
\t\t\tcfg.ChatGPT.AgentSettings = s
\t\tdefault:
\t\t\tcfg.Codex.AgentSettings = s
\t\t}
\t}
}

''')
          rep('agents.go',
              '\tif agent == "A" {\n\t\tcfg.Claude.AgentSettings = s\n\t} else {\n\t\tcfg.Codex.AgentSettings = s\n\t}\n\treturn nil\n}\n\n// verifyAgentCode',
              '\tswitch agent {\n\tcase "A":\n\t\tcfg.Claude.AgentSettings = s\n\tcase "G":\n\t\tcfg.ChatGPT.AgentSettings = s\n\tdefault:\n\t\tcfg.Codex.AgentSettings = s\n\t}\n\treturn nil\n}\n\n// verifyAgentCode')
          between('agents.go',
                  'func salvageAgents(cfg *Config) {',
                  '',
                  '') if False else None
          # salvageAgents is the final function in this file.
          s = read('agents.go')
          a = s.find('func salvageAgents(cfg *Config) {')
          if a < 0:
              raise SystemExit('agents.go: salvageAgents not found')
          salvage = '''func salvageAgents(cfg *Config) {
\tclaimedNames := map[string]bool{}
\tfor _, agent := range []string{"C", "A", "G"} {
\t\ts := agentSettings(*cfg, agent)
\t\tseenNumbers := map[string]bool{}
\t\tkept := make([]AgentPhone, 0, len(s.Phones))
\t\tfor _, p := range s.Phones {
\t\t\tnumber := normalizeUSPhone(p.Number)
\t\t\tif number == "" || seenNumbers[number] {
