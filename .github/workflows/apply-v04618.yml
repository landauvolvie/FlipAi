name: apply-v04618

on:
  push:
    branches:
      - fix/chatgpt-latest-turn-clean-prompt-v04618
    paths:
      - scripts/apply_v04618.py
      - .github/workflows/apply-v04618.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-latest-turn-clean-prompt-v04618
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v0.46.18 patch
        run: python scripts/apply_v04618.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt_webview_windows.go sms_sticky_chatgpt.go testdata/chatgpt/drive.mjs chatgpt_sms_prompt_v04618_test.go config.go VERSION docs/RELEASE-NOTES.md
          git commit -m "Fix ChatGPT latest-turn extraction and clean SMS prompt"
          git push origin HEAD:fix/chatgpt-latest-turn-clean-prompt-v04618
