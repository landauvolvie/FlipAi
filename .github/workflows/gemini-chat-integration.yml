name: gemini-chat-integration

on:
  push:
    branches:
      - feature/gemini-chat-v04621

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[gemini-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-chat-v04621
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply Gemini Chat integration
        run: python tools/integrate_gemini_chat.py
      - name: Normalize generated Go indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('zzzzzz_gemini_chat_ui.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\n\\t', '\n\t')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Format
        run: gofmt -w *.go
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "FlipAi Gemini integration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Gemini Chat browser agent [gemini-integrated]"
          git push origin HEAD:feature/gemini-chat-v04621
