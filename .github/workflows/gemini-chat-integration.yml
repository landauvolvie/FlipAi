name: gemini-chat-integration

on:
  push:
    branches:
      - feature/gemini-chat-v04621

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gemini-chat-v04621
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Remove unrelated formatting diffs
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- \
            chatgpt_asar_test.go \
            chatgpt_cloud_map.go \
            chatgpt_sms_prompt_v04618_test.go \
            chatgpt_webview.go \
            chatgpt_webview_other.go \
            chatgpt_webview_test.go \
            chatgpt_webview_windows.go \
            claudeconnect.go \
            codex_smoke.go \
            codex_turn_image_capture_test.go \
            codex_windows_env_test.go \
            mail_notify_test.go \
            voice_agent_voice.go \
            voice_cables.go \
            voice_receiver_windows.go \
            voice_route.go \
            voice_ui_script.go
      - name: Polish Gemini UI comments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('zzzzzz_gemini_chat_ui.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('page with a fourth, independent Gemini Chat pane.', 'page with a fifth, independent Gemini Chat pane.')
          s = s.replace('avoids disturbing the mature Codex/Gemini CLI layout.', 'avoids disturbing the mature Codex/Claude CLI layout.')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary integration machinery
        run: git rm .github/workflows/gemini-chat-integration.yml tools/integrate_gemini_chat.py
      - name: Format intended Go changes only
        run: |
          gofmt -w \
            agents.go bridge.go commands.go config.go \
            gemini_chat_routes_test.go gemini_chat_webview.go gemini_chat_webview_lifecycle.go \
            gemini_chat_webview_mode_windows.go gemini_chat_webview_other.go gemini_chat_webview_windows.go \
            main.go sms_gemini_chat.go sms_sticky_chatgpt.go \
            ui_actions.go ui_actions_agents.go ui_page_agents.go ui_page_agents_test.go webui.go zzzzzz_gemini_chat_ui.go
          git diff --check
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Commit clean feature branch
        shell: bash
        run: |
          git config user.name "FlipAi Gemini cleanup"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Clean Gemini Chat v0.46.21 feature branch [gemini-clean]"
          git push origin HEAD:feature/gemini-chat-v04621
