name: apply-chatgpt-work-new-fix

on:
  push:
    branches: [fix/chatgpt-work-new-mode]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'

      - name: Apply targeted fresh-Work readiness fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('chatgpt_webview_windows.go')
          s = p.read_text()
          old = """  const controls=()=>Array.from(document.querySelectorAll('button,[role=\"button\"],[role=\"tab\"],[role=\"menuitem\"],[role=\"option\"]')).filter(visible);
            const exact=name=>controls().filter(n=>{const t=norm(n.innerText||n.textContent||'');const a=norm(n.getAttribute('aria-label'));return t===name||a===name||t===name+' mode'||a===name+' mode';});
            const findSelected=name=>exact(name).find(selected)||null;
            wanted=norm(wanted)==='work'?'work':'chat';
            const other=wanted==='work'?'chat':'work';

            if(findSelected(wanted))return {ok:true,mode:wanted,href:location.href};
          """.replace('            ', '  ')
          new = """  const controls=()=>Array.from(document.querySelectorAll('button,[role=\"button\"],[role=\"tab\"],[role=\"menuitem\"],[role=\"option\"]')).filter(visible);
            const exact=name=>controls().filter(n=>{const t=norm(n.innerText||n.textContent||'');const a=norm(n.getAttribute('aria-label'));return t===name||a===name||t===name+' mode'||a===name+' mode';});
            const findSelected=name=>exact(name).find(selected)||null;
            const composerReady=()=>!!document.querySelector('#prompt-textarea,textarea[data-testid=\"prompt-textarea\"],[data-testid=\"prompt-textarea\"],[contenteditable=\"true\"][data-virtualkeyboard],[contenteditable=\"true\"]');
            wanted=norm(wanted)==='work'?'work':'chat';
            const other=wanted==='work'?'chat':'work';

            // A fresh navigation can restore /api/auth/session before ChatGPT's SPA
            // has rendered the composer and mode controls. NEW must wait for the UI
            // before verifying Work, otherwise OW NEW: fails while ordinary OW: works.
            for(let i=0;i<100&&!composerReady();i++)await sleep(200);

            if(findSelected(wanted))return {ok:true,mode:wanted,href:location.href};
          """.replace('            ', '  ')
          if old not in s:
              raise SystemExit('expected ChatGPT mode-selection block not found')
          p.write_text(s.replace(old, new, 1))

          t = Path('chatgpt_webview_windows_test.go')
          ts = t.read_text()
          marker = 'func TestChatGPTWebViewDoesNotUseGlobalUIAutomation(t *testing.T) {'
          test = r'''func TestChatGPTWorkModeWaitsForFreshPageUI(t *testing.T) {
          	b, err := os.ReadFile("chatgpt_webview_windows.go")
          	if err != nil {
          		t.Fatal(err)
          	}
          	s := string(b)
          	for _, want := range []string{
          		"const composerReady=()=>!!document.querySelector",
          		"for(let i=0;i<100&&!composerReady();i++)await sleep(200);",
          		"modeResult := ensureMode(body.Mode)",
          	} {
          		if !strings.Contains(s, want) {
          			t.Fatalf("fresh ChatGPT Work mode lost readiness guard %q", want)
          		}
          	}
          }

          '''.replace('          ', '')
          if 'TestChatGPTWorkModeWaitsForFreshPageUI' not in ts:
              if marker not in ts:
                  raise SystemExit('test insertion marker not found')
              ts = ts.replace(marker, test + marker, 1)
              t.write_text(ts)

          cfg = Path('config.go')
          cs = cfg.read_text()
          if 'const version = "0.46.58"' not in cs:
              raise SystemExit('config.go version marker not found')
          cfg.write_text(cs.replace('const version = "0.46.58"', 'const version = "0.46.59"', 1))

          iss = Path('installer/FlipAi.iss')
          ins = iss.read_text()
          if '#define MyVersion "0.46.58"' not in ins:
              raise SystemExit('installer version marker not found')
          iss.write_text(ins.replace('#define MyVersion "0.46.58"', '#define MyVersion "0.46.59"', 1))

          Path('VERSION').write_text('0.46.59\n')
          Path('docs/RELEASE-NOTES.md').write_text('''# FlipAi v0.46.59

This release fixes starting an explicit new ChatGPT Work session from SMS.

## ChatGPT Work NEW

- `OW:` continues to use ChatGPT Work exactly as before.
- `OW NEW:` now waits for ChatGPT's fresh page UI to finish rendering before FlipAi verifies Work mode.
- The fix targets the fresh-session path that could report a valid signed-in session before the Work selector and composer were ready.
- FlipAi still refuses to send a task if it cannot verify Work mode, so the safety check is preserved rather than bypassed.

## Validation

- Added regression coverage for the fresh-page readiness guard used before Work-mode verification.
- The normal release pipeline still runs Linux and Windows tests, real-browser call-flow checks, vet/race checks, Google Voice checks, Microsoft Defender scans, installer smoke tests, SBOM generation, checksums, and provenance attestation before publishing.

No Authenticode/code-signing certificate is included in this release.
''')
          PY

          gofmt -w chatgpt_webview_windows.go chatgpt_webview_windows_test.go
          go test ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 go test -c -o /tmp/flipai.test.exe .

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-chatgpt-work-new-fix.yml
          git add chatgpt_webview_windows.go chatgpt_webview_windows_test.go config.go installer/FlipAi.iss VERSION docs/RELEASE-NOTES.md
          git commit -m 'Fix explicit new ChatGPT Work sessions and release v0.46.59'
          git push origin HEAD:fix/chatgpt-work-new-mode
