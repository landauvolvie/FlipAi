name: gemini-completion-v04624-integrate

on:
  push:
    branches:
      - fix/gemini-completion-v04624
    paths:
      - scripts/apply_gemini_completion_v04624.py
      - .github/workflows/gemini-completion-v04624-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemini-completion-v04624
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply Gemini completion fix
        run: python3 scripts/apply_gemini_completion_v04624.py

      - name: Format changed Go files
        run: gofmt -w config.go gemini_completion_regression_test.go

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Remove temporary integration files
        run: |
          rm -f scripts/apply_gemini_completion_v04624.py
          rm -f .github/workflows/gemini-completion-v04624-integrate.yml

      - name: Commit integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Gemini finished-response detection"
          git push origin HEAD:fix/gemini-completion-v04624
