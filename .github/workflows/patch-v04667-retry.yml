name: patch-v04667-retry

on:
  push:
    branches:
      - fix/chatgpt-route-boundaries-v04667
    paths:
      - .github/workflows/patch-v04667-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-route-boundaries-v04667
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Apply corrected route patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          wf = Path('.github/workflows/patch-v04667.yml').read_text()
          m = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > /tmp/patch.py", wf)
          if not m:
              raise SystemExit('Could not recover the patch payload')
          Path('/tmp/patch.py').write_bytes(base64.b64decode(m.group(1)))
          PY
          python3 /tmp/patch.py
          python3 - <<'PY'
          from pathlib import Path
          for name in ('chatgpt_webview_windows.go', 'chatgpt_webview_windows_test.go'):
              p = Path(name)
              fixed = []
              for line in p.read_text().splitlines(True):
                  depth = 0
                  while line.startswith('\\t'):
                      depth += 1
                      line = line[2:]
                  fixed.append('\t' * depth + line)
              p.write_text(''.join(fixed))
          PY
          rm -f .github/workflows/patch-v04667.yml .github/workflows/patch-v04667-retry.yml
          gofmt -w chatgpt_webview_windows.go chatgpt_webview_windows_test.go config.go
          go test ./...
      - name: Commit corrected v0.46.67
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ChatGPT Chat/Work route boundaries and prepare v0.46.67"
          git push origin HEAD:fix/chatgpt-route-boundaries-v04667
