name: prepare-chatgpt-g-sticky-v04614

on:
  push:
    branches:
      - feature/chatgpt-g-sticky-routing-v04614

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[v0.46.14-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recover and run preparation script
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          path = '.github/workflows/prepare-chatgpt-g-sticky-v04614.yml'
          raw = subprocess.check_output(['git', 'show', 'HEAD^:' + path], text=True)
          lines = raw.splitlines()
          start = lines.index("          python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          PY')
          body = []
          for line in lines[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              body.append(line)
          code = '\n'.join(body) + '\n'
          exec(compile(code, 'prepare_v04614.py', 'exec'), {'__name__': '__main__'})
          PY
      - name: Commit prepared v0.46.14
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add G sticky ChatGPT SMS and reboot recovery v0.46.14 [v0.46.14-ready]"
          git push
