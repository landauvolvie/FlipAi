name: prepare-chatgpt-g-sticky-v04614

on:
  push:
    branches:
      - feature/chatgpt-g-sticky-routing-v04614

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[v0.46.14-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Implement G routing, sticky agents, and reboot recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              s = s.replace(old, new, count)
              p.write_text(s, encoding='utf-8')

          # Version and durable per-sender sticky routing state.
          rep('config.go', 'const version = "0.46.13"', 'const version = "0.46.14"')
          rep('config.go', '''\tLastAgent           string    `json:"lastAgent,omitempty"`\n''', '''\tLastAgent           string    `json:"lastAgent,omitempty"`\n\t// LastAgentBySender remembers the most recently selected SMS destination\n\t// for each allowed phone. An explicit C:, A:, or G: changes it; follow-up\n\t// texts without a prefix keep going to that agent across app/PC restarts.\n\tLastAgentBySender map[string]string `json:"lastAgentBySender,omitempty"`\n''')
          Path('VERSION').write_text('0.46.14\n', encoding='utf-8')

          # ChatGPT is a first-class SMS destination for naming/reply behavior,
          # while its sender authorization comes from the existing C/A allowlists.
          rep('agents.go', '''// agentSettings returns the settings for "C" (Codex) or "A" (Claude).\nfunc agentSettings(cfg Config, agent string) AgentSettings {\n\tif agent == "A" {\n\t\treturn cfg.Claude.AgentSettings\n\t}\n\treturn cfg.Codex.AgentSettings\n}\n\nfunc agentDisplayName(agent string) string {\n\tswitch agent {\n\tcase "A":\n\t\treturn "Claude"\n\tcase "B":\n\t\treturn "ChatGPT / Codex and Claude"\n\tdefault:\n\t\treturn "ChatGPT / Codex"\n\t}\n}\n''', '''// agentSettings returns reply behavior for an SMS destination. ChatGPT Chat\n// deliberately reuses the shared Google Voice reply/progress defaults; phone\n// authorization and optional security-code checking are resolved from the\n// sender's existing Codex/Claude allowlist entry before G: is accepted.\nfunc agentSettings(cfg Config, agent string) AgentSettings {\n\tswitch agent {\n\tcase "A":\n\t\treturn cfg.Claude.AgentSettings\n\tcase "G":\n\t\treturn AgentSettings{\n\t\t\tReplyAck: boolPtr(cfg.GoogleVoice.ReplyAck),\n\t\t\tProgressUpdates: boolPtr(cfg.GoogleVoice.ProgressUpdates),\n\t\t\tProgressIntervalSeconds: cfg.GoogleVoice.ProgressIntervalSeconds,\n\t\t}\n\tdefault:\n\t\treturn cfg.Codex.AgentSettings\n\t}\n}\n\nfunc agentDisplayName(agent string) string {\n\tswitch agent {\n\tcase "A":\n\t\treturn "Claude"\n\tcase "G":\n\t\treturn "ChatGPT Chat"\n\tcase "B":\n\t\treturn "Codex and Claude"\n\tdefault:\n\t\treturn "Codex"\n\t}\n}\n''')

          # Reserve G so customized C/A shortcuts can never make routing ambiguous.
          rep('ui_actions.go', '''\t\t\tif strings.EqualFold(codexPrefix, claudePrefix) {\n\t\t\t\treturn fmt.Errorf("Codex and Claude prefixes must be different")\n\t\t\t}\n''', '''\t\t\tif strings.EqualFold(codexPrefix, claudePrefix) {\n\t\t\t\treturn fmt.Errorf("Codex and Claude prefixes must be different")\n\t\t\t}\n\t\t\tif strings.EqualFold(codexPrefix, chatGPTSMSPrefix) || strings.EqualFold(claudePrefix, chatGPTSMSPrefix) {\n\t\t\t\treturn fmt.Errorf("G is reserved for ChatGPT Chat; choose a different Codex or Claude prefix")\n\t\t\t}\n''')
          # Keep the old field readable for config compatibility, but there is no
          # longer any UI action that changes or uses a default SMS destination.
          rep('ui_actions.go', '''\t\tif r.Form.Has("defaultAgent") {\n\t\t\tif v := strings.ToUpper(strings.TrimSpace(r.FormValue("defaultAgent"))); v == "A" || v == "C" {\n\t\t\t\tcfg.DefaultAgent = v\n\t\t\t}\n\t\t}\n''', '')

          # Incoming Google Voice messages now resolve through the sticky router.
          rep('bridge.go', '''\t\trc, err := parseRemoteCommandForMessage(raw, b.cfg, senderAgent, m)\n''', '''\t\tsticky := b.stickySMSAgent(sender)\n\t\trc, err := parseRemoteCommandForMessageSticky(raw, b.cfg, senderAgent, sticky, m)\n''')
          rep('bridge.go', '''\t\trc.Sender = sender\n\n\t\t// STATUS needs no agent, so answer it inline.''', '''\t\trc.Sender = sender\n\t\tif !rc.Status && rc.Agent != "" {\n\t\t\tif err := b.rememberStickySMSAgent(sender, rc.Agent); err != nil {\n\t\t\t\tb.event("warn", "routing", "Could not persist the selected SMS agent: "+truncate(err.Error(), 180), sender, rc.Agent, id)\n\t\t\t}\n\t\t}\n\n\t\t// STATUS needs no agent, so answer it inline.''')
          rep('bridge.go', '''\t\tagentName := "Codex"\n\t\tif rc.Agent == "A" {\n\t\t\tagentName = "Claude"\n\t\t}\n''', '''\t\tagentName := agentDisplayName(rc.Agent)\n''')
          rep('bridge.go', '''\tif !rc.Status && !rc.New && len(m.Attachments) > 0 {\n\t\tinbound, cleanupInbound, prepErr = prepareInboundAttachments(m.Attachments)\n\t\tif cleanupInbound != nil {\n\t\t\tdefer cleanupInbound()\n\t\t}\n\t}\n''', '''\tif !rc.Status && !rc.New && len(m.Attachments) > 0 {\n\t\tif rc.Agent == "G" {\n\t\t\tprepErr = errors.New("ChatGPT Chat over Google Voice supports text messages in this release; switch to C: or A: for an attachment")\n\t\t} else {\n\t\t\tinbound, cleanupInbound, prepErr = prepareInboundAttachments(m.Attachments)\n\t\t\tif cleanupInbound != nil {\n\t\t\t\tdefer cleanupInbound()\n\t\t\t}\n\t\t}\n\t}\n''')
          rep('bridge.go', '''\t} else if rc.New {\n\t\tb.event("info", "agent", "Starting a new agent conversation", rc.Sender, rc.Agent, m.ID)\n\t\tif rc.Agent == "C" {\n\t\t\terr = b.newCodexThread(ctx)\n\t\t\tfinal = "New Codex conversation started."\n\t\t} else {\n\t\t\t// Claude sessions are created by the CLI on the turn that uses them,\n\t\t\t// so there is no session to start here the way there is for Codex.\n\t\t\t// Clearing the id and minting the name now is what makes the next\n\t\t\t// Claude text open a fresh conversation and every text after that\n\t\t\t// continue it.\n\t\t\tb.startNewClaudeSession()\n\t\t\tfinal = "New Claude conversation started."\n\t\t}\n\t} else if rc.Agent == "A" {\n\t\tb.event("info", "agent", "Claude command started", rc.Sender, "A", m.ID)\n\t\tfinal, err = b.runClaudeWithAttachments(ctx, rc.Text, rc.Sender, inbound)\n\t} else {\n\t\tb.event("info", "agent", "Codex command started", rc.Sender, "C", m.ID)\n\t\tfinal, err = b.runCodexWithAttachments(ctx, rc.Text, rc.Sender, inbound)\n\t}\n''', '''\t} else if rc.New {\n\t\tb.event("info", "agent", "Starting a new agent conversation", rc.Sender, rc.Agent, m.ID)\n\t\tswitch rc.Agent {\n\t\tcase "C":\n\t\t\terr = b.newCodexThread(ctx)\n\t\t\tfinal = "New Codex conversation started."\n\t\tcase "G":\n\t\t\terr = b.newChatGPTConversation(ctx)\n\t\t\tfinal = "New ChatGPT conversation started."\n\t\tdefault:\n\t\t\t// Claude sessions are created by the CLI on the turn that uses them.\n\t\t\tb.startNewClaudeSession()\n\t\t\tfinal = "New Claude conversation started."\n\t\t}\n\t} else if rc.Agent == "A" {\n\t\tb.event("info", "agent", "Claude command started", rc.Sender, "A", m.ID)\n\t\tfinal, err = b.runClaudeWithAttachments(ctx, rc.Text, rc.Sender, inbound)\n\t} else if rc.Agent == "G" {\n\t\tb.event("info", "agent", "ChatGPT Chat command started", rc.Sender, "G", m.ID)\n\t\tfinal, err = b.runChatGPTSMS(ctx, rc.Text)\n\t} else {\n\t\tb.event("info", "agent", "Codex command started", rc.Sender, "C", m.ID)\n\t\tfinal, err = b.runCodexWithAttachments(ctx, rc.Text, rc.Sender, inbound)\n\t}\n''')
          rep('bridge.go', '''\tagentName := "Codex"\n\tif rc.Agent == "A" {\n\t\tagentName = "Claude"\n\t}\n''', '''\tagentName := agentDisplayName(rc.Agent)\n''')

          # Clear stale process-only state left on disk by Windows shutdown. This
          # is the key reboot bug: Connected is durable, Running/SignedIn/port are not.
          p = Path('chatgpt_webview_lifecycle.go')
          s = p.read_text(encoding='utf-8')
          s += '''\n// prepareChatGPTRuntimeForTray discards process-only flags left behind when\n// Windows terminated FlipAi without letting the WebView write its shutdown\n// state. Connected and the conversation id are durable; Running, SignedIn and\n// the loopback control endpoint only describe a live process.\nfunc prepareChatGPTRuntimeForTray(dataDir string) {\n\ts := loadChatGPTRuntime(dataDir)\n\tif !s.Connected || chatGPTBrowserStillOpen(dataDir) {\n\t\treturn\n\t}\n\tmutateChatGPTRuntime(dataDir, func(v *ChatGPTWebRuntime) {\n\t\tv.Running = false\n\t\tv.Starting = false\n\t\tv.Visible = false\n\t\tv.LoginActive = false\n\t\tv.SignedIn = false\n\t\tv.ControlPort = 0\n\t\tv.ControlToken = ""\n\t\tv.LastEvent = "background-restart-pending"\n\t\tv.LastError = ""\n\t})\n\tchatGPTActivity(dataDir, "info", "chatgpt-session", "Windows/app restart detected; discarded stale ChatGPT browser process state and queued the saved session for invisible restore.", 0)\n}\n'''
          p.write_text(s, encoding='utf-8')
          rep('chatgpt_tray_supervisor_windows.go', '''\tgo runChatGPTBackgroundSupervisor(context.Background(), dataDir)\n''', '''\tprepareChatGPTRuntimeForTray(dataDir)\n\tgo runChatGPTBackgroundSupervisor(context.Background(), dataDir)\n''')

          # Supervisor now verifies a supposedly-running worker instead of trusting
          # stale JSON, and self-heals a healthy WebView that never restores auth.
          old_supervisor = '''func runChatGPTBackgroundSupervisor(ctx context.Context, dataDir string) {\n\tticker := time.NewTicker(1500 * time.Millisecond)\n\tdefer ticker.Stop()\n\tvar lastAttempt time.Time\n\tvar announced bool\n\tfor {\n\t\ts := loadChatGPTRuntime(dataDir)\n\t\twant := s.Connected && !s.LoginActive\n\t\tif !want {\n\t\t\tannounced = false\n\t\t} else if !s.Running && !s.Starting && time.Since(lastAttempt) >= 5*time.Second {\n\t\t\tlastAttempt = time.Now()\n\t\t\tif !announced {\n\t\t\t\tchatGPTActivity(dataDir, "info", "chatgpt-session", "Restoring the saved ChatGPT session invisibly in the background.", 0)\n\t\t\t\tannounced = true\n\t\t\t}\n\t\t\tif err := platformEnsureChatGPTWorker(dataDir); err != nil {\n\t\t\t\tchatGPTActivity(dataDir, "error", "chatgpt-session", "Could not restore the saved ChatGPT background session: "+err.Error(), 0)\n\t\t\t}\n\t\t} else if s.Running && s.SignedIn {\n\t\t\tannounced = false\n\t\t}\n\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\tcase <-ticker.C:\n\t\t}\n\t}\n}\n'''
          new_supervisor = '''func runChatGPTBackgroundSupervisor(ctx context.Context, dataDir string) {\n\tticker := time.NewTicker(1500 * time.Millisecond)\n\tdefer ticker.Stop()\n\tvar lastAttempt time.Time\n\tvar notReadySince time.Time\n\tvar announced bool\n\tfor {\n\t\ts := loadChatGPTRuntime(dataDir)\n\t\twant := s.Connected && !s.LoginActive\n\t\tif !want {\n\t\t\tannounced = false\n\t\t\tnotReadySince = time.Time{}\n\t\t} else {\n\t\t\t// Running/Starting are process-local facts. After a hard reboot their\n\t\t\t// persisted values can be stale, so verify the private loopback worker.\n\t\t\tif s.Running && !chatGPTBrowserStillOpen(dataDir) {\n\t\t\t\tmutateChatGPTRuntime(dataDir, func(v *ChatGPTWebRuntime) {\n\t\t\t\t\tv.Running = false; v.Starting = false; v.SignedIn = false\n\t\t\t\t\tv.ControlPort = 0; v.ControlToken = ""\n\t\t\t\t\tv.LastEvent = "background-restart-pending"\n\t\t\t\t})\n\t\t\t\tchatGPTActivity(dataDir, "warn", "chatgpt-session", "Saved ChatGPT browser state had no live worker; restarting it invisibly.", 0)\n\t\t\t\ts = loadChatGPTRuntime(dataDir)\n\t\t\t}\n\t\t\tif s.Starting && time.Since(s.UpdatedAt) > 20*time.Second {\n\t\t\t\tmutateChatGPTRuntime(dataDir, func(v *ChatGPTWebRuntime) { v.Starting = false; v.LastEvent = "background-restart-pending" })\n\t\t\t\ts = loadChatGPTRuntime(dataDir)\n\t\t\t}\n\t\t\tif !s.Running && !s.Starting && time.Since(lastAttempt) >= 5*time.Second {\n\t\t\t\tlastAttempt = time.Now()\n\t\t\t\tif !announced {\n\t\t\t\t\tchatGPTActivity(dataDir, "info", "chatgpt-session", "Restoring the saved ChatGPT session invisibly in the background.", 0)\n\t\t\t\t\tannounced = true\n\t\t\t\t}\n\t\t\t\tif err := platformEnsureChatGPTWorker(dataDir); err != nil {\n\t\t\t\t\tchatGPTActivity(dataDir, "error", "chatgpt-session", "Could not restore the saved ChatGPT background session: "+err.Error(), 0)\n\t\t\t\t}\n\t\t\t} else if s.Running && s.SignedIn {\n\t\t\t\tannounced = false\n\t\t\t\tnotReadySince = time.Time{}\n\t\t\t} else if s.Running {\n\t\t\t\tif notReadySince.IsZero() {\n\t\t\t\t\tnotReadySince = time.Now()\n\t\t\t\t} else if time.Since(notReadySince) > 75*time.Second && time.Since(lastAttempt) > 30*time.Second {\n\t\t\t\t\tlastAttempt = time.Now()\n\t\t\t\t\tchatGPTActivity(dataDir, "warn", "chatgpt-session", "ChatGPT browser stayed loaded without restoring the saved sign-in; recycling the hidden worker once and retrying.", 0)\n\t\t\t\t\t_ = platformStopChatGPTWorker(dataDir)\n\t\t\t\t\twaitForChatGPTStopped(dataDir, 4*time.Second)\n\t\t\t\t\t_ = platformEnsureChatGPTWorker(dataDir)\n\t\t\t\t\tnotReadySince = time.Now()\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\n\t\tselect {\n\t\tcase <-ctx.Done():\n\t\t\treturn\n\t\tcase <-ticker.C:\n\t\t}\n\t}\n}\n'''
          rep('chatgpt_webview.go', old_supervisor, new_supervisor)
          # A cold Windows boot can take longer than 35s for network/WebView/auth.
          rep('chatgpt_webview.go', 'context.WithTimeout(r.Context(), 35*time.Second)', 'context.WithTimeout(r.Context(), 90*time.Second)', 2)

          # Give G: NEW a real new-chat operation without sending a dummy prompt.
          marker = '''\tmux.HandleFunc("/test", func(rw http.ResponseWriter, r *http.Request) {\n'''
          addition = '''\tmux.HandleFunc("/new", func(rw http.ResponseWriter, r *http.Request) {\n\t\tif !authorized(r) {\n\t\t\thttp.Error(rw, "FlipAi token required", http.StatusForbidden)\n\t\t\treturn\n\t\t}\n\t\tif r.Method != http.MethodPost {\n\t\t\thttp.Error(rw, "POST required", http.StatusMethodNotAllowed)\n\t\t\treturn\n\t\t}\n\t\tvar ignored bool\n\t\tif err := chatGPTEval(dev, `(()=>{location.href='https://chatgpt.com/';return true})()`, false, &ignored); err != nil {\n\t\t\trw.WriteHeader(http.StatusBadGateway)\n\t\t\t_ = json.NewEncoder(rw).Encode(map[string]any{"ok": false, "detail": err.Error()})\n\t\t\treturn\n\t\t}\n\t\tif !waitForChatGPTPageSignedIn(dev, 45*time.Second) {\n\t\t\trw.WriteHeader(http.StatusUnauthorized)\n\t\t\t_ = json.NewEncoder(rw).Encode(map[string]any{"ok": false, "detail": "ChatGPT did not restore the saved sign-in after opening a new chat"})\n\t\t\treturn\n\t\t}\n\t\tmutateChatGPTRuntime(dataDir, func(s *ChatGPTWebRuntime) {\n\t\t\ts.Connected = true; s.SignedIn = true; s.ConversationID = ""\n\t\t\ts.LastEvent = "new-chat-ready"; s.LastError = ""\n\t\t})\n\t\t_ = json.NewEncoder(rw).Encode(map[string]any{"ok": true})\n\t})\n'''
          rep('chatgpt_webview_windows.go', marker, addition + marker)

          # Remove the old default-agent presentation. Routing now follows the
          # per-sender sticky selection; G is fixed for ChatGPT Chat.
          rep('ui_page_agents.go', 'For a shared number, start a text with <b>{{.Prefix}}:</b> to choose {{.Name}}; an unprefixed text uses the default agent. Calls have no SMS shortcut, so if both agents allow the same caller, the default agent answers.', 'For a shared number, <b>C:</b> or <b>A:</b> switches the active SMS agent and unprefixed follow-ups stay with the most recently selected agent. <b>G:</b> switches to ChatGPT Chat. Calls keep their existing Codex/Claude routing.')
          rep('ui_page_agents.go', '{{if eq .S.DefaultAgent "C"}}<span class="pill brand">Default agent</span>{{end}}\n', '')
          rep('ui_page_agents.go', '{{if not .CodexAccess.IsDefault}}<button class="btn" type="submit" name="defaultAgent" value="C" formnovalidate>{{icon "check"}}Make default</button>{{end}}\n', '')
          rep('ui_page_agents.go', '{{if eq .S.DefaultAgent "A"}}<span class="pill brand">Default agent</span>{{end}}\n', '')
          rep('ui_page_agents.go', '{{if not .ClaudeAccess.IsDefault}}<button class="btn" type="submit" name="defaultAgent" value="A" formnovalidate>{{icon "check"}}Make default</button>{{end}}\n', '')
          rep('ui_page_agents.go', '<p>Codex and Claude each keep their own routing, workspace, access, conversation, and SMS instruction here.</p>', '<p>C: selects Codex, A: selects Claude, and G: selects ChatGPT Chat. After a selection, unprefixed follow-up texts stay with that agent until you switch again.</p>')
          rep('ui_page_agents.go', 'Must differ from the Claude shortcut.', 'Must differ from the Claude shortcut and reserved G: ChatGPT shortcut.')
          rep('ui_page_agents.go', 'Must differ from the Codex shortcut.', 'Must differ from the Codex shortcut and reserved G: ChatGPT shortcut.')

          # Put the G behavior directly in the ChatGPT pane.
          marker = '''      <section class="card">\n        <div class="card-head divided"><div><h2>Connection</h2><p>Saved connection and live browser readiness are tracked separately so a normal startup delay is never mistaken for a lost login.</p></div></div>\n'''
          sms_card = '''      <section class="card">\n        <div class="card-head divided"><div><h2>Google Voice SMS</h2><p>ChatGPT Chat is now a normal FlipAi SMS destination.</p></div></div>\n        <div class="card-body">\n          <div class="rows">\n            <div class="row"><div class="label">Shortcut<span>Send this once to switch the phone conversation to regular ChatGPT Chat.</span></div><div class="value"><b class="mono">G: your message</b></div></div>\n            <div class="row"><div class="label">Follow-up texts<span>No default agent. After C:, A:, or G:, every unprefixed follow-up stays with that selected agent until you switch.</span></div><div class="value"><span class="pill ok">Sticky per phone</span></div></div>\n            <div class="row"><div class="label">New ChatGPT chat<span>Starts a clean saved ChatGPT conversation and keeps G selected.</span></div><div class="value"><b class="mono">G: NEW</b></div></div>\n          </div>\n        </div>\n      </section>\n\n'''
          rep('zzzz_chatgpt_direct_ui.go', marker, sms_card + marker)

          # New sticky routing + ChatGPT SMS transport implementation.
          Path('sms_sticky_chatgpt.go').write_text(r'''package main

import (
    "context"
    "encoding/json"
    "errors"
    "fmt"
    "net/http"
    "path/filepath"
    "strings"
    "time"
)

const (
    chatGPTSMSAgent  = "G"
    chatGPTSMSPrefix = "G"
)

func explicitSMSAgent(raw string, cfg Config) string {
    raw = strings.TrimSpace(raw)
    if raw == "" {
        return ""
    }
    candidates := []string{raw}
    if f := strings.Fields(raw); len(f) > 1 {
        candidates = append(candidates, strings.TrimSpace(strings.TrimPrefix(raw, f[0])))
    }
    newWord := configuredNewSessionCommand(cfg)
    for _, v := range candidates {
        for _, x := range []struct{ agent, prefix string }{
            {"C", configuredCodexPrefix(cfg)},
            {"A", configuredClaudePrefix(cfg)},
            {"G", chatGPTSMSPrefix},
        } {
            if _, ok := stripAgentCommandPrefix(v, x.prefix); ok || isAgentNewSession(v, x.prefix, newWord) {
                return x.agent
            }
        }
    }
    return ""
}

func smsTargetAllowed(sourceAgent, target string) bool {
    switch target {
    case "G":
        return sourceAgent == "A" || sourceAgent == "C" || sourceAgent == "B"
    case "C":
        return sourceAgent == "C" || sourceAgent == "B"
    case "A":
        return sourceAgent == "A" || sourceAgent == "B"
    default:
        return false
    }
}

func selectStickySMSAgent(raw string, cfg Config, sourceAgent, sticky string) (string, error) {
    if explicit := explicitSMSAgent(raw, cfg); explicit != "" {
        if !smsTargetAllowed(sourceAgent, explicit) {
            return "", wrongAgentForNumber(sourceAgent, explicit)
        }
        return explicit, nil
    }
    sticky = strings.ToUpper(strings.TrimSpace(sticky))
    if smsTargetAllowed(sourceAgent, sticky) {
        return sticky, nil
    }
    // A phone that can reach only one CLI agent has no ambiguity. Shared phones
    // have no default: the first conversation must name C:, A:, or G: once.
    if sourceAgent == "C" || sourceAgent == "A" {
        return sourceAgent, nil
    }
    return "", errors.New("no SMS agent is selected for this phone yet; start the message with C: for Codex, A: for Claude, or G: for ChatGPT Chat")
}

func chatGPTSecurityCandidates(cfg Config, sourceAgent string) []AgentSettings {
    switch sourceAgent {
    case "A":
        return []AgentSettings{cfg.Claude.AgentSettings}
    case "B":
        return []AgentSettings{cfg.Codex.AgentSettings, cfg.Claude.AgentSettings}
    default:
        return []AgentSettings{cfg.Codex.AgentSettings}
    }
}

// authorizeChatGPTRaw keeps G from weakening an existing SMS security-code
// policy. If the sender has a code-free path through either already-allowed
// agent, G is code-free too. Otherwise either valid existing agent code works.
func authorizeChatGPTRaw(raw string, cfg Config, sourceAgent string) (string, error) {
    candidates := chatGPTSecurityCandidates(cfg, sourceAgent)
    allRequire := len(candidates) > 0
    for _, s := range candidates {
        if !s.RequireCode {
            allRequire = false
            break
        }
    }
    if !allRequire {
        return strings.TrimSpace(raw), nil
    }
    f := strings.Fields(raw)
    if len(f) < 2 {
        return "", errors.New("missing the SMS security code or the ChatGPT command")
    }
    for _, s := range candidates {
        if verifyAgentCode(s, f[0]) {
            return strings.TrimSpace(strings.TrimPrefix(raw, f[0])), nil
        }
    }
    return "", errors.New("invalid SMS security code for ChatGPT Chat")
}

func parseChatGPTSMSCommand(raw string, cfg Config, sourceAgent string) (remoteCommand, error) {
    rest, err := authorizeChatGPTRaw(raw, cfg, sourceAgent)
    if err != nil {
        return remoteCommand{}, err
    }
    if strings.EqualFold(rest, "STATUS") {
        return remoteCommand{Status: true}, nil
    }
    newWord := configuredNewSessionCommand(cfg)
    if strings.EqualFold(rest, newWord) || isAgentNewSession(rest, chatGPTSMSPrefix, newWord) {
        return remoteCommand{Agent: "G", New: true}, nil
    }
    text := rest
    if tail, ok := stripAgentCommandPrefix(rest, chatGPTSMSPrefix); ok {
        text = tail
    }
    text = strings.TrimSpace(text)
    if text == "" {
        return remoteCommand{}, errors.New("empty ChatGPT command")
    }
    return remoteCommand{Agent: "G", Text: text}, nil
}

func parseRemoteCommandForMessageSticky(raw string, cfg Config, sourceAgent, sticky string, m GmailMessage) (remoteCommand, error) {
    target, err := selectStickySMSAgent(raw, cfg, sourceAgent, sticky)
    if err != nil {
        return remoteCommand{}, err
    }
    if strings.TrimSpace(raw) != "" {
        if target == "G" {
            return parseChatGPTSMSCommand(raw, cfg, sourceAgent)
        }
        return parseRemoteCommand(raw, cfg, target)
    }
    if target == "G" {
        return remoteCommand{}, errors.New("ChatGPT Chat over Google Voice supports text messages in this release; switch to C: or A: for an attachment")
    }
    return parseRemoteCommandForMessage(raw, cfg, target, m)
}

func stickySMSKey(sender string) string {
    if n := normalizeUSPhone(sender); n != "" {
        return n
    }
    return strings.TrimSpace(sender)
}

func (b *Bridge) stickySMSAgent(sender string) string {
    key := stickySMSKey(sender)
    b.mu.Lock()
    defer b.mu.Unlock()
    if b.state.LastAgentBySender == nil {
        return ""
    }
    return b.state.LastAgentBySender[key]
}

func (b *Bridge) rememberStickySMSAgent(sender, agent string) error {
    agent = strings.ToUpper(strings.TrimSpace(agent))
    if agent != "C" && agent != "A" && agent != "G" {
        return fmt.Errorf("unknown sticky SMS agent %q", agent)
    }
    key := stickySMSKey(sender)
    if key == "" {
        return errors.New("SMS sender is empty")
    }
    b.mu.Lock()
    if b.state.LastAgentBySender == nil {
        b.state.LastAgentBySender = map[string]string{}
    }
    b.state.LastAgentBySender[key] = agent
    s := b.state
    b.mu.Unlock()
    return saveState(b.statePath, s)
}

type chatGPTSMSReply struct {
    OK             bool   `json:"ok"`
    Reply          string `json:"reply"`
    Detail         string `json:"detail"`
    ConversationID string `json:"conversationId"`
}

func chatGPTBrowserSend(ctx context.Context, dataDir, prompt string) (string, error) {
    readyCtx, cancel := context.WithTimeout(ctx, 2*time.Minute)
    s, err := ensureChatGPTReady(readyCtx, dataDir)
    cancel()
    if err != nil {
        return "", err
    }
    payload, _ := json.Marshal(map[string]any{"prompt": prompt, "new": false})
    turnCtx, cancel := context.WithTimeout(ctx, 100*time.Second)
    b, code, err := chatGPTControlRequest(turnCtx, s, http.MethodPost, "/chat", strings.NewReader(string(payload)))
    cancel()
    if err != nil {
        return "", err
    }
    var out chatGPTSMSReply
    _ = json.Unmarshal(b, &out)
    if code != http.StatusOK || !out.OK {
        if strings.TrimSpace(out.Detail) == "" {
            out.Detail = strings.TrimSpace(string(b))
        }
        return "", errors.New(out.Detail)
    }
    if strings.TrimSpace(out.Reply) == "" {
        return "", errors.New("ChatGPT returned an empty reply")
    }
    return strings.TrimSpace(out.Reply), nil
}

func chatGPTBrowserNewConversation(ctx context.Context, dataDir string) error {
    readyCtx, cancel := context.WithTimeout(ctx, 2*time.Minute)
    s, err := ensureChatGPTReady(readyCtx, dataDir)
    cancel()
    if err != nil {
        return err
    }
    reqCtx, cancel := context.WithTimeout(ctx, 55*time.Second)
    b, code, err := chatGPTControlRequest(reqCtx, s, http.MethodPost, "/new", strings.NewReader(`{}`))
    cancel()
    if err != nil {
        return err
    }
    if code != http.StatusOK {
        var out chatGPTSMSReply
        _ = json.Unmarshal(b, &out)
        if out.Detail != "" {
            return errors.New(out.Detail)
        }
        return fmt.Errorf("ChatGPT new-chat request returned HTTP %d", code)
    }
    return nil
}

func (b *Bridge) runChatGPTSMS(ctx context.Context, command string) (string, error) {
    dataDir := filepath.Dir(b.statePath)
    return chatGPTBrowserSend(ctx, dataDir, b.composePrompt("G", command))
}

func (b *Bridge) newChatGPTConversation(ctx context.Context) error {
    return chatGPTBrowserNewConversation(ctx, filepath.Dir(b.statePath))
}
