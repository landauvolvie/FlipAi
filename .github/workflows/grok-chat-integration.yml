name: grok-chat-integration

on:
  push:
    branches:
      - feature/grok-chat-v04622-int

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[grok-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/grok-chat-v04622-int
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Adapt generator to current compact config layout
        run: python tools/patch_grok_generator.py
      - name: Apply Grok Chat integration
        run: python tools/integrate_grok_chat.py
      - name: Normalize Grok sticky routing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sms_sticky_chatgpt.go')
          s = p.read_text(encoding='utf-8')
          # Earlier generic six-agent normalization and the current sticky-router
          # adapter can both append X. Collapse only exact adjacent duplicates.
          for duplicate, single in [
              (' || target == "X" || target == "X"', ' || target == "X"'),
              (' || sourceAgent == "X" || sourceAgent == "X"', ' || sourceAgent == "X"'),
              (' && agent != "X" && agent != "X"', ' && agent != "X"'),
          ]:
              s = s.replace(duplicate, single)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Format intended source files
        run: |
          gofmt -w \
            config.go commands.go agents.go bridge.go sms_sticky_chatgpt.go webui.go main.go \
            ui_actions_agents.go ui_actions.go ui_page_agents.go ui_page_agents_test.go \
            grok_chat_webview.go grok_chat_webview_lifecycle.go grok_chat_webview_mode_windows.go \
            grok_chat_webview_other.go grok_chat_webview_windows.go sms_grok_chat.go \
            grok_chat_routes_test.go zzzzzzz_grok_chat_ui.go
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Remove integration scaffolding
        run: git rm tools/integrate_grok_chat.py tools/patch_grok_generator.py .github/workflows/grok-chat-integration.yml
      - name: Commit integrated source
        shell: bash
        run: |
          git config user.name "FlipAi Grok integration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Grok Chat browser agent [grok-integrated]"
          git push origin HEAD:feature/grok-chat-v04622-int
