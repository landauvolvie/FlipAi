name: v04625-version-fix
on:
  push:
    branches:
      - fix/gemini-said-prefix-v04625
    paths:
      - .github/workflows/v04625-version-fix.yml
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gemini-said-prefix-v04625
          fetch-depth: 0
      - name: Synchronize version metadata
        shell: python
        run: |
          from pathlib import Path
          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.46.24"'
          assert old in s, 'config.go version anchor missing'
          p.write_text(s.replace(old, 'const version = "0.46.25"', 1))

          p = Path('installer/FlipAi.iss')
          s = p.read_text()
          old = '#define MyVersion "0.46.20"'
          assert old in s, 'installer version anchor missing'
          p.write_text(s.replace(old, '#define MyVersion "0.46.25"', 1))
      - name: Test
        run: go test ./...
      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/v04625-version-fix.yml
      - name: Commit synchronized metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.go installer/FlipAi.iss .github/workflows/v04625-version-fix.yml
          git commit -m "Synchronize v0.46.25 release metadata"
          git push origin HEAD:fix/gemini-said-prefix-v04625
