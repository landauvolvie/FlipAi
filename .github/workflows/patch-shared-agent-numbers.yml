name: patch-shared-agent-numbers

on:
  push:
    branches: [fix/shared-agent-phone-number]
    paths:
      - .github/workflows/patch-shared-agent-numbers.yml
      - scripts/patch_shared_agent_numbers.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-agent-phone-number
          fetch-depth: 0
      - name: Apply shared-number fix
        run: python scripts/patch_shared_agent_numbers.py
      - name: Commit patched product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow phone numbers on multiple agents"
          git push origin HEAD:fix/shared-agent-phone-number
