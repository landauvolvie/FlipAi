name: patch-shared-agent-numbers

on:
  push:
    branches: [fix/shared-agent-phone-number]
    paths:
      - .github/workflows/patch-shared-agent-numbers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-agent-phone-number
          fetch-depth: 0

      - name: Allow one phone number on both agents
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # The allowlist remains per-agent, but a real phone may deliberately
          # be present on both. The SMS shortcut is then the routing selector.
          replace_once('agents.go',
          '''// FlipAi used to keep a single allowlist of phone numbers, one security code,
          // and one set of reply preferences, all shared, with an agent chosen per message
          // by a "C:" or "A:" prefix. That put the answer to "who may command this agent"
          // in a different place from the agent itself. Now a number belongs to exactly
          // one agent, carries what it is allowed to do, and each agent has its own code,
          // its own framing line, and its own reply behaviour.''',
          '''// FlipAi used to keep a single allowlist of phone numbers, one security code,
          // and one set of reply preferences, all shared. Each agent now owns its own
          // allowlist, access kind, security code and reply behaviour. The same real phone
          // may deliberately appear on both agents; in that case C:/A: selects the SMS
          // destination and an unprefixed SMS uses the configured default agent.''')

          replace_once('agents.go',
          '''\t// Phones is this agent's allowlist. A number may appear on one agent only.
          \tPhones []AgentPhone `json:"phones,omitempty"`''',
          '''\t// Phones is this agent's allowlist. The same number may also be present on
          \t// the other agent; each copy keeps its own SMS/voice access policy.
          \tPhones []AgentPhone `json:"phones,omitempty"`''')

          replace_once('agents.go',
          '''func agentDisplayName(agent string) string {
          \tif agent == "A" {
          \t\treturn "Claude"
          \t}
          \treturn "ChatGPT / Codex"
          }

          // agentForSender answers the only question that matters when a text or a call
          // arrives: which agent, if any, does this number reach, and for what.
          func agentForSender(cfg Config, raw string) (agent string, phone AgentPhone, ok bool) {
          \tnumber := normalizeUSPhone(raw)
          \tif number == "" {
          \t\treturn "", AgentPhone{}, false
          \t}
          \tfor _, candidate := range []string{"C", "A"} {
          \t\tfor _, p := range agentSettings(cfg, candidate).Phones {
          \t\t\tif p.Number == number {
          \t\t\t\treturn candidate, p, true
          \t\t\t}
          \t\t}
          \t}
          \treturn "", AgentPhone{}, false
          }''',
          '''func agentDisplayName(agent string) string {
          \tswitch agent {
          \tcase "A":
          \t\treturn "Claude"
          \tcase "B":
          \t\treturn "ChatGPT / Codex and Claude"
          \tdefault:
          \t\treturn "ChatGPT / Codex"
          \t}
          }

          func agentPhoneForSender(cfg Config, agent, raw string) (AgentPhone, bool) {
          \tnumber := normalizeUSPhone(raw)
          \tif number == "" {
          \t\treturn AgentPhone{}, false
          \t}
          \tfor _, p := range agentSettings(cfg, agent).Phones {
          \t\tif p.Number == number {
          \t\t\treturn p, true
          \t\t}
          \t}
          \treturn AgentPhone{}, false
          }

          // combinedAgentPhone is used only while admitting a message from a number that
          // exists on both agents. The actual per-agent permissions stay separate; this
          // synthetic value tells the transport whether at least one/both copies permit
          // the transport being attempted.
          func combinedAgentPhone(a, b AgentPhone) AgentPhone {
          \tp := a
          \tsms := a.AllowsSMS() || b.AllowsSMS()
          \tvoice := a.AllowsVoice() || b.AllowsVoice()
          \tswitch {
          \tcase sms && voice:
          \t\tp.Access = AccessAll
          \tcase sms:
          \t\tp.Access = AccessSMS
          \tdefault:
          \t\tp.Access = AccessVoice
          \t}
          \treturn p
          }

          // agentForSender resolves a unique number directly. "B" is an internal marker
          // meaning the number is allowed to text both agents, so the SMS shortcut must
          // choose the destination. If only one copy permits SMS, that agent remains the
          // only SMS destination even though the number may also be allowed to call the
          // other agent.
          func agentForSender(cfg Config, raw string) (agent string, phone AgentPhone, ok bool) {
          \tc, cOK := agentPhoneForSender(cfg, "C", raw)
          \ta, aOK := agentPhoneForSender(cfg, "A", raw)
          \tswitch {
          \tcase cOK && aOK:
          \t\tswitch {
          \t\tcase c.AllowsSMS() && a.AllowsSMS():
          \t\t\treturn "B", combinedAgentPhone(c, a), true
          \t\tcase c.AllowsSMS():
          \t\t\treturn "C", c, true
          \t\tcase a.AllowsSMS():
          \t\t\treturn "A", a, true
          \t\tdefault:
          \t\t\treturn "B", combinedAgentPhone(c, a), true
          \t\t}
          \tcase cOK:
          \t\treturn "C", c, true
          \tcase aOK:
          \t\treturn "A", a, true
          \tdefault:
          \t\treturn "", AgentPhone{}, false
          \t}
          }''')

          replace_once('agents.go',
          '''// normalizeAgentPhones cleans one agent's list and rejects a number that is
          // already claimed by the other agent. Exclusivity is the point: a number reaches
          // one agent, so there is never a question of which one answered.
          func normalizeAgentPhones(list []AgentPhone, claimedElsewhere map[string]string) ([]AgentPhone, error) {''',
          '''// normalizeAgentPhones cleans one agent's list. Duplicates inside the same
          // list collapse, while the same number on the other agent is intentionally valid.
          func normalizeAgentPhones(list []AgentPhone, _ map[string]string) ([]AgentPhone, error) {''')

          replace_once('agents.go',
          '''\t\tif other, taken := claimedElsewhere[number]; taken {
          \t\t\treturn nil, fmt.Errorf("%s is already allowed on %s; a number can reach one agent only", formatUSPhone(number), agentDisplayName(other))
          \t\t}
          ''', '')

          replace_once('agents.go',
          '''// normalizeAgents cleans both agents together, because exclusivity can only be
          // checked with both lists in hand.
          func normalizeAgents(cfg *Config) error {
          \tclaimed := map[string]string{}
          \tclaimedNames := map[string]string{}
          \tfor _, agent := range []string{"C", "A"} {
          \t\tsettings := agentSettings(*cfg, agent)
          \t\tcleaned, err := normalizeAgentPhones(settings.Phones, claimed)
          \t\tif err != nil {
          \t\t\treturn fmt.Errorf("%s numbers: %w", agentDisplayName(agent), err)
          \t\t}
          \t\tfor _, p := range cleaned {
          \t\t\tclaimed[p.Number] = agent
          \t\t}''',
          '''// normalizeAgents cleans each phone list independently. Caller names remain
          // exclusive because a phone call has no C:/A: shortcut with which to resolve the
          // same displayed contact name on two agents.
          func normalizeAgents(cfg *Config) error {
          \tclaimedNames := map[string]string{}
          \tfor _, agent := range []string{"C", "A"} {
          \t\tsettings := agentSettings(*cfg, agent)
          \t\tcleaned, err := normalizeAgentPhones(settings.Phones, nil)
          \t\tif err != nil {
          \t\t\treturn fmt.Errorf("%s numbers: %w", agentDisplayName(agent), err)
          \t\t}''')

          replace_once('agents.go',
          '''// salvageAgents keeps FlipAi startable when a stored configuration cannot
          // satisfy the rules -- a hand-edited file, or one written by a build that
          // allowed a number on both agents. Whatever does not fit is dropped rather than
          // refusing to load, and the first agent to claim a number keeps it.
          func salvageAgents(cfg *Config) {
          \tclaimed := map[string]bool{}
          \tclaimedNames := map[string]bool{}
          \tfor _, agent := range []string{"C", "A"} {
          \t\ts := agentSettings(*cfg, agent)
          \t\tkept := make([]AgentPhone, 0, len(s.Phones))
          \t\tfor _, p := range s.Phones {
          \t\t\tnumber := normalizeUSPhone(p.Number)
          \t\t\tif number == "" || claimed[number] {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tclaimed[number] = true''',
          '''// salvageAgents keeps FlipAi startable when a stored configuration has bad
          // entries. A shared number is valid and is preserved on both agents; only invalid
          // or duplicate entries inside the same agent are dropped. Caller names remain
          // exclusive because calls have no SMS shortcut.
          func salvageAgents(cfg *Config) {
          \tclaimedNames := map[string]bool{}
          \tfor _, agent := range []string{"C", "A"} {
          \t\ts := agentSettings(*cfg, agent)
          \t\tseenNumbers := map[string]bool{}
          \t\tkept := make([]AgentPhone, 0, len(s.Phones))
          \t\tfor _, p := range s.Phones {
          \t\t\tnumber := normalizeUSPhone(p.Number)
          \t\t\tif number == "" || seenNumbers[number] {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tseenNumbers[number] = true''')

          # Resolve the internal shared-number marker by the user's configured
          # SMS shortcut. The security code may precede the shortcut, so inspect
          # both the full text and the text after its first token.
          replace_once('attachments.go',
          '''func parseRemoteCommandForMessage(raw string, cfg Config, agent string, m GmailMessage) (remoteCommand, error) {
          \tif strings.TrimSpace(raw) != "" {''',
          '''func agentForSharedSMSCommand(raw string, cfg Config) string {
          \tpick := func(text string) string {
          \t\ttext = strings.TrimSpace(text)
          \t\tnewSession := configuredNewSessionCommand(cfg)
          \t\tif _, ok := stripAgentCommandPrefix(text, configuredCodexPrefix(cfg)); ok ||
          \t\t\tisAgentNewSession(text, configuredCodexPrefix(cfg), newSession) {
          \t\t\treturn "C"
          \t\t}
          \t\tif _, ok := stripAgentCommandPrefix(text, configuredClaudePrefix(cfg)); ok ||
          \t\t\tisAgentNewSession(text, configuredClaudePrefix(cfg), newSession) {
          \t\t\treturn "A"
          \t\t}
          \t\treturn ""
          \t}
          \tif agent := pick(raw); agent != "" {
          \t\treturn agent
          \t}
          \tfields := strings.Fields(strings.TrimSpace(raw))
          \tif len(fields) > 1 {
          \t\trest := strings.TrimSpace(strings.TrimPrefix(strings.TrimSpace(raw), fields[0]))
          \t\tif agent := pick(rest); agent != "" {
          \t\t\treturn agent
          \t\t}
          \t}
          \tif cfg.DefaultAgent == "A" {
          \t\treturn "A"
          \t}
          \treturn "C"
          }

          func parseRemoteCommandForMessage(raw string, cfg Config, agent string, m GmailMessage) (remoteCommand, error) {
          \tif agent == "B" {
          \t\tagent = agentForSharedSMSCommand(raw, cfg)
          \t}
          \tif strings.TrimSpace(raw) != "" {''')

          # The UI should explain the behavior instead of presenting sharing as
          # an error or a security mistake.
          replace_once('ui_page_agents.go',
          '''    <div><h2>Allowed phone numbers</h2><p>Only these numbers can reach {{.Name}}, by text or by call. This list belongs to {{.Name}} alone: a number on the other agent&#39;s list cannot reach {{.Name}}, and a number here cannot reach the other agent — not even by asking for it by name in a text.</p></div>''',
          '''    <div><h2>Allowed phone numbers</h2><p>Only these numbers can reach {{.Name}}, by text or by call. The same phone can be allowed on both agents. For a shared number, start a text with <b>{{.Prefix}}:</b> to choose {{.Name}}; an unprefixed text uses the default agent. Calls have no SMS shortcut, so if both agents allow the same caller, the default agent answers.</p></div>''')

          # Existing isolation tests should continue proving that permission on
          # only one agent never leaks to the other; only the explicit duplicate
          # prohibition changes.
          replace_once('agent_isolation_test.go',
          '''\t// And a number still may not be claimed twice either.
          \tdup := defaultConfig(t.TempDir())
          \tdup.Codex.Phones = []AgentPhone{{Number: "8455551000", Access: AccessAll}}
          \tdup.Claude.Phones = []AgentPhone{{Number: "(845) 555-1000", Access: AccessAll}}
          \tif err := normalizeAgents(&dup); err == nil {
          \t\tt.Fatal("the same number was accepted on both agents")
          \t}''',
          '''\t// A phone number may deliberately be shared. SMS routing is then explicit
          \t// through C:/A: while each agent still keeps its own access policy.
          \tdup := defaultConfig(t.TempDir())
          \tdup.Codex.Phones = []AgentPhone{{Number: "8455551000", Access: AccessAll}}
          \tdup.Claude.Phones = []AgentPhone{{Number: "(845) 555-1000", Access: AccessAll}}
          \tif err := normalizeAgents(&dup); err != nil {
          \t\tt.Fatalf("the same phone should be allowed on both agents: %v", err)
          \t}
          \tif len(dup.Codex.Phones) != 1 || len(dup.Claude.Phones) != 1 {
          \t\tt.Fatalf("shared phone was not preserved on both agents: C=%+v A=%+v", dup.Codex.Phones, dup.Claude.Phones)
          \t}''')

          replace_once('agent_isolation_test.go',
          '''\tif got := len(cfg.Claude.Phones); got != 0 {
          \t\tt.Errorf("the duplicate number stayed on the second agent: %+v", cfg.Claude.Phones)
          \t}''',
          '''\tif got := len(cfg.Claude.Phones); got != 1 || cfg.Claude.Phones[0].Number != "8455551000" {
          \t\tt.Errorf("the valid shared number was not preserved on the second agent: %+v", cfg.Claude.Phones)
          \t}''')

          Path('shared_agent_number_test.go').write_text(r'''package main

import (
    "strings"
    "testing"
)

func TestSharedNumberUsesSMSShortcutAndDefault(t *testing.T) {
    cfg := defaultConfig(t.TempDir())
    cfg.DefaultAgent = "C"
    shared := AgentPhone{Number: "8455551000", Access: AccessAll}
    cfg.Codex.Phones = []AgentPhone{shared}
    cfg.Claude.Phones = []AgentPhone{shared}
    if err := normalizeAgents(&cfg); err != nil {
        t.Fatalf("shared number rejected: %v", err)
    }

    owner, phone, ok := agentForSender(cfg, shared.Number)
    if !ok || owner != "B" || !phone.AllowsSMS() {
        t.Fatalf("shared SMS number resolved to owner=%q phone=%+v ok=%v", owner, phone, ok)
    }

    for raw, want := range map[string]string{
        "C: codex task":  "C",
        "A: claude task": "A",
    } {
        rc, err := parseRemoteCommandForMessage(raw, cfg, owner, GmailMessage{})
        if err != nil || rc.Agent != want {
            t.Errorf("%q routed to %+v, err=%v; want %s", raw, rc, err, want)
        }
    }

    cfg.DefaultAgent = "A"
    rc, err := parseRemoteCommandForMessage("unprefixed task", cfg, owner, GmailMessage{})
    if err != nil || rc.Agent != "A" {
        t.Fatalf("unprefixed shared SMS did not use default Claude: %+v %v", rc, err)
    }
}

func TestSharedNumberDoesNotWidenPerAgentSMSAccess(t *testing.T) {
    cfg := defaultConfig(t.TempDir())
    cfg.Codex.Phones = []AgentPhone{{Number: "8455551000", Access: AccessSMS}}
    cfg.Claude.Phones = []AgentPhone{{Number: "8455551000", Access: AccessVoice}}
    if err := normalizeAgents(&cfg); err != nil {
        t.Fatal(err)
    }

    owner, phone, ok := agentForSender(cfg, "8455551000")
    if !ok || owner != "C" || !phone.AllowsSMS() {
        t.Fatalf("SMS permission should remain Codex-only: owner=%q phone=%+v ok=%v", owner, phone, ok)
    }
    if _, err := parseRemoteCommandForMessage("A: should fail", cfg, owner, GmailMessage{}); err == nil || !strings.Contains(err.Error(), "cannot address") {
        t.Fatalf("Claude voice-only copy unexpectedly gained SMS permission: %v", err)
    }
}

func TestSharedNumberSecurityCodeCanPrecedeShortcut(t *testing.T) {
    cfg := defaultConfig(t.TempDir())
    shared := AgentPhone{Number: "8455551000", Access: AccessAll}
    cfg.Codex.Phones = []AgentPhone{shared}
    cfg.Claude.Phones = []AgentPhone{shared}
    if err := setAgentCode(&cfg, "A", "claude1"); err != nil {
        t.Fatal(err)
    }
    s := cfg.Claude.AgentSettings
    s.RequireCode = true
    cfg.Claude.AgentSettings = s
    if err := normalizeAgents(&cfg); err != nil {
        t.Fatal(err)
    }

    owner, _, ok := agentForSender(cfg, "8455551000")
    if !ok || owner != "B" {
        t.Fatalf("expected shared marker, got %q (ok=%v)", owner, ok)
    }
    rc, err := parseRemoteCommandForMessage("claude1 A: protected task", cfg, owner, GmailMessage{})
    if err != nil || rc.Agent != "A" || rc.Text != "protected task" {
        t.Fatalf("security-code + shortcut routing failed: %+v %v", rc, err)
    }
}

func TestSharedVoiceCallerUsesDefaultAgentWhenBothAllowCalls(t *testing.T) {
    cfg := defaultConfig(t.TempDir())
    cfg.DefaultAgent = "A"
    cfg.Codex.Phones = []AgentPhone{{Number: "8455551000", Access: AccessAll}}
    cfg.Claude.Phones = []AgentPhone{{Number: "8455551000", Access: AccessAll}}
    if err := normalizeAgents(&cfg); err != nil {
        t.Fatal(err)
    }
    vc := defaultVoiceCallConfig()
    vc.Enabled = true
    d := decideVoiceCall(vc, cfg, "8455551000", "")
    if !d.Allowed || d.Agent != "A" {
        t.Fatalf("shared caller should use default Claude when both allow calls: %+v", d)
    }
}
''', encoding='utf-8')

          # v0.46.2 is the user-facing release for this routing correction.
          replace_once('config.go', 'const version = "0.46.1"', 'const version = "0.46.2"')
          Path('VERSION').write_text('0.46.2\n', encoding='utf-8')
          Path('docs/RELEASE-NOTES.md').write_text('''# FlipAi v0.46.2

This release allows the same phone number to be authorized on both Codex and Claude.

## Shared phone numbers

A number can now appear in both agents' Allowed phone numbers lists. Each agent still keeps its own access setting (Texts and calls, Texts only, or Calls only), security code, workspace, conversation, and reply behavior.

When a shared number is allowed to text both agents, the configured SMS shortcuts choose the destination: `C:` routes to Codex and `A:` routes to Claude by default. If the message is unprefixed, FlipAi sends it to the configured default agent. A per-agent security code may still come first, for example `mycode A: check this`.

Sharing a number does not widen permissions. If the number is Texts only on Codex and Calls only on Claude, an `A:` text remains blocked because Claude was not granted SMS access.

Phone calls do not contain an SMS shortcut. If the same caller is allowed to call both agents, the configured default agent receives the call. If only one agent grants call access, that agent receives it.

## Fixed

The Agents page no longer rejects a number merely because it is already present on the other agent. Shared numbers also survive restart/config recovery instead of being silently removed from the second agent.

## Verified

The release workflow runs the real-browser Google Voice call-flow harness, full Linux and Windows test suites, `go vet`, race tests, Windows x64 build, Google Voice receiver validation, installer build, install/uninstall smoke test, Microsoft Defender scan when available, and SHA-256 generation before publishing.
''', encoding='utf-8')

          # This one-shot workflow should not become permanent project behavior.
          Path('.github/workflows/patch-shared-agent-numbers.yml').unlink()

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow phone numbers on multiple agents"
          git push origin HEAD:fix/shared-agent-phone-number
