name: apply-v064

on:
  push:
    branches:
      - codex-full-access-thread-handoff-v0.6.4

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.6.4 changes
        run: python scripts/apply_v064.py
      - name: Commit generated feature changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION config.go bridge.go codex.go activity_web.go codex_test.go v064_features_test.go
          git diff --cached --quiet && exit 0
          git commit -m "Apply v0.6.4 full access, thread handoff, and optional SMS code"
          git push origin HEAD:codex-full-access-thread-handoff-v0.6.4
