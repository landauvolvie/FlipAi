name: sync-v04658-build-metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync v0.46.58 build metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync compiled and installer versions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.46.57"'
          new = 'const version = "0.46.58"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('unexpected compiled version in config.go')
          p.write_text(s)

          p = Path('installer/FlipAi.iss')
          s = p.read_text()
          old = '#define MyVersion "0.46.57"'
          new = '#define MyVersion "0.46.58"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('unexpected installer version in installer/FlipAi.iss')
          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config.go installer/FlipAi.iss
          if git diff --cached --quiet; then
            echo 'Build metadata already synchronized.'
            exit 0
          fi
          git commit -m 'Sync v0.46.58 build metadata'
          git push origin HEAD:main
