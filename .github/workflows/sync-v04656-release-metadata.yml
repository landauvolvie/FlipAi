name: sync-v04657-release-metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync v0.46.57 release metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync version metadata and trigger release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('config.go')
          s = p.read_text()
          for old in ('const version = "0.46.55"', 'const version = "0.46.56"'):
              if old in s:
                  s = s.replace(old, 'const version = "0.46.57"', 1)
                  break
          if 'const version = "0.46.57"' not in s:
              raise SystemExit('unexpected compiled version in config.go')
          p.write_text(s)

          p = Path('installer/FlipAi.iss')
          s = p.read_text()
          for old in ('#define MyVersion "0.46.55"', '#define MyVersion "0.46.56"'):
              if old in s:
                  s = s.replace(old, '#define MyVersion "0.46.57"', 1)
                  break
          if '#define MyVersion "0.46.57"' not in s:
              raise SystemExit('unexpected installer version in installer/FlipAi.iss')
          p.write_text(s)

          p = Path('VERSION')
          p.write_text('0.46.57\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config.go installer/FlipAi.iss VERSION
          if git diff --cached --quiet; then
            echo 'Release metadata already synchronized.'
            exit 0
          fi
          git commit -m 'Sync v0.46.57 release metadata'
          git push origin HEAD:main
