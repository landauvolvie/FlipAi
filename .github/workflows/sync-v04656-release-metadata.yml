name: sync-v04656-release-metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync v0.46.56 release metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync compiled and installer versions, then retry release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.46.55"'
          new = 'const version = "0.46.56"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('unexpected compiled version in config.go')
          p.write_text(s)

          p = Path('installer/FlipAi.iss')
          s = p.read_text()
          old = '#define MyVersion "0.46.55"'
          new = '#define MyVersion "0.46.56"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('unexpected installer version in installer/FlipAi.iss')
          p.write_text(s)

          p = Path('.github/workflows/release.yml')
          s = p.read_text()
          marker = '# Release metadata synchronized for v0.46.56.'
          if marker not in s:
              anchor = '# Touching this workflow intentionally retries a release after version metadata is synchronized.'
              if anchor not in s:
                  raise SystemExit('release workflow retry anchor not found')
              s = s.replace(anchor, anchor + '\n' + marker, 1)
              p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config.go installer/FlipAi.iss .github/workflows/release.yml
          if git diff --cached --quiet; then
            echo 'Release metadata already synchronized.'
            exit 0
          fi
          git commit -m 'Sync v0.46.56 release metadata'
          git push origin HEAD:main
