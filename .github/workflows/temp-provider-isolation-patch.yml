name: temp-provider-isolation-patch

on:
  push:
    branches:
      - fix/browser-agent-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-agent-reliability
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patch
        run: python3 scripts/temp_patch_bridge.py
      - name: Format and test
        run: |
          gofmt -w bridge.go bridge_provider_isolation_test.go
          go test ./...
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "FlipAi CI"
          git config user.email "actions@users.noreply.github.com"
          git add bridge.go bridge_provider_isolation_test.go
          git commit -m "Apply provider-isolated SMS queue"
          git push origin HEAD:fix/browser-agent-reliability
