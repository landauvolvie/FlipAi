name: temp-provider-isolation-patch

on:
  push:
    branches:
      - fix/browser-agent-reliability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/browser-agent-reliability
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply patches
        run: |
          python3 scripts/temp_patch_bridge.py
          python3 scripts/temp_patch_readonly_tests.py
      - name: Format and test
        run: |
          gofmt -w bridge.go bridge_provider_isolation_test.go browser_agent_readonly_test_regression_test.go chatgpt_webview_windows.go claude_chat_webview_windows.go gemini_chat_webview_windows.go grok_chat_webview_windows.go copilot_chat_webview.go copilot_chat_webview_windows.go muse_chat_webview.go muse_chat_webview_windows.go
          go test ./...
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "FlipAi CI"
          git config user.email "actions@users.noreply.github.com"
          git add bridge.go bridge_provider_isolation_test.go browser_agent_readonly_test_regression_test.go chatgpt_webview_windows.go claude_chat_webview_windows.go gemini_chat_webview_windows.go grok_chat_webview_windows.go copilot_chat_webview.go copilot_chat_webview_windows.go muse_chat_webview.go muse_chat_webview_windows.go
          git commit -m "Make every browser connection test read-only"
          git push origin HEAD:fix/browser-agent-reliability
