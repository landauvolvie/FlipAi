name: apply-long-turn-no-cap-v2

on:
  push:
    branches:
      - fix/long-running-model-progress-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/long-running-model-progress-20260907
          fetch-depth: 0
      - name: Remove elapsed-time cap from agent turns
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('bridge.go'); s=p.read_text(); old='\\ttimeout := time.Duration(b.cfg.TurnTimeoutMinutes) * time.Minute\\n\\tif timeout <= 0 {\\n\\t\\ttimeout = 90 * time.Minute\\n\\t}\\n\\tctx, cancel := context.WithTimeout(parent, timeout)\\n\\tdefer cancel()\\n'; new='\\t// Agent/model turns have no elapsed-time deadline. Long browser work, Codex,\\n\\t// Claude Code, research, and image generation may legitimately run for many\\n\\t// minutes. The turn ends only when the provider completes/fails or when the\\n\\t// parent app context is cancelled during a real shutdown.\\n\\tctx, cancel := context.WithCancel(parent)\\n\\tdefer cancel()\\n'; assert old in s, 'expected Bridge.execute timeout block was not found'; p.write_text(s.replace(old,new,1))"
          if git diff --quiet -- bridge.go; then
            echo "Bridge is already uncapped; nothing to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bridge.go
          git commit -m 'Remove elapsed-time cap from agent turns'
          git push origin HEAD:fix/long-running-model-progress-20260907
