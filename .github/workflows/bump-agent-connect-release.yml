name: prepare-agent-connect-release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bump-agent-connect-release.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump FlipAi to 0.46.1
        shell: bash
        env:
          RELEASE_NOTES_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('config.go')
          text = p.read_text(encoding='utf-8')
          old = 'const version = "0.46.0"'
          new = 'const version = "0.46.1"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r} in config.go')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          printf '0.46.1\n' > VERSION
          printf '%s' "$RELEASE_NOTES_B64" | base64 --decode > docs/RELEASE-NOTES.md
          rm .github/workflows/bump-agent-connect-release.yml

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare FlipAi v0.46.1 release"
          git push origin HEAD:main
