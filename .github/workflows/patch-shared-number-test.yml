name: patch-shared-number-test

on:
  push:
    branches: [fix/shared-agent-phone-number]
    paths:
      - .github/workflows/patch-shared-number-test.yml
      - scripts/patch_shared_number_ui_test.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-agent-phone-number
          fetch-depth: 0
      - run: python scripts/patch_shared_number_ui_test.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update shared number lifecycle test"
          git push origin HEAD:fix/shared-agent-phone-number
