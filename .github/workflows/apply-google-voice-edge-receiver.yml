name: Apply Google Voice Edge receiver

on:
  push:
    branches:
      - fix/google-voice-incoming-edge
    paths:
      - .github/workflows/apply-google-voice-edge-receiver.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/google-voice-incoming-edge
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Switch Google Voice runtime to real Edge
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          win = Path('voice_call_windows.go')
          text = win.read_text(encoding='utf-8')
          old = 'func runGoogleVoiceWindow(dataDir string, visible bool) error {'
          new = '''func runGoogleVoiceWindow(dataDir string, visible bool) error {
          \treturn runGoogleVoiceEdgeWindow(dataDir, visible)
          }

          // runGoogleVoiceWebViewWindow is retained as a fallback implementation
          // for diagnostics, but it is no longer used for live calling because
          // WebView2 does not implement Web Push and therefore cannot reliably
          // receive Google Voice incoming calls.
          func runGoogleVoiceWebViewWindow(dataDir string, visible bool) error {'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one runGoogleVoiceWindow, found {text.count(old)}')
          win.write_text(text.replace(old, new, 1), encoding='utf-8')

          cfg = Path('config.go')
          text = cfg.read_text(encoding='utf-8')
          if 'const version = "0.26.1"' not in text:
              raise SystemExit('expected 0.26.1 config version')
          cfg.write_text(text.replace('const version = "0.26.1"', 'const version = "0.26.2"', 1), encoding='utf-8')

          iss = Path('installer/FlipAi.iss')
          text = iss.read_text(encoding='utf-8')
          if '#define MyVersion "0.26.1"' not in text:
              raise SystemExit('expected 0.26.1 installer version')
          iss.write_text(text.replace('#define MyVersion "0.26.1"', '#define MyVersion "0.26.2"', 1), encoding='utf-8')

          Path('VERSION').write_text('0.26.2\n', encoding='utf-8')
          '@ | Set-Content apply_edge_receiver.py -Encoding utf8
          python apply_edge_receiver.py
          Remove-Item apply_edge_receiver.py
          go mod tidy
          gofmt -w voice_edge_windows.go voice_call_windows.go

      - name: Test
        shell: pwsh
        run: go test ./...

      - name: Vet
        shell: pwsh
        run: go vet ./...

      - name: Race test
        shell: pwsh
        run: go test -race ./...

      - name: Remove one-shot workflow and verify diff
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-google-voice-edge-receiver.yml
          git diff --check
          git status --short

      - name: Commit tested receiver
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Receive Google Voice calls through supported Edge browser"
          git push origin HEAD:fix/google-voice-incoming-edge
