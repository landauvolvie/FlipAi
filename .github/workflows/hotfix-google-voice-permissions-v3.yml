name: Google Voice WebView hotfix v3

on:
  push:
    branches:
      - claude/google-voice-calling-3ui1px
    paths:
      - .github/workflows/hotfix-google-voice-permissions-v3.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out calling branch
        uses: actions/checkout@v4
        with:
          ref: claude/google-voice-calling-3ui1px
          fetch-depth: 0

      - name: Vendor current WebView2 module
        shell: pwsh
        run: |
          $version = "v0.0.0-20260205173254-56598839c808"
          $module = (go mod download -json "github.com/jchv/go-webview2@$version" | ConvertFrom-Json)
          if (-not $module.Dir) { throw "Could not locate the go-webview2 module cache" }
          if (Test-Path third_party/go-webview2) { Remove-Item third_party/go-webview2 -Recurse -Force }
          New-Item -ItemType Directory -Path third_party/go-webview2 -Force | Out-Null
          Copy-Item (Join-Path $module.Dir '*') third_party/go-webview2 -Recurse -Force
          Get-ChildItem third_party/go-webview2 -Recurse -Force | ForEach-Object {
            if (-not $_.PSIsContainer) { $_.IsReadOnly = $false }
          }

      - name: Apply call permission and dialing fixes
        shell: pwsh
        run: |
          python tools/hotfix_voice_v0261.py
          go mod tidy
          gofmt -w config.go voice_call_windows.go voice_permissions_windows_test.go third_party/go-webview2/pkg/edge/chromium.go
          git diff --check

      - name: Run full Go test suite
        shell: pwsh
        run: go test ./...

      - name: Vet Windows build
        shell: pwsh
        run: go vet ./...

      - name: Remove one-shot hotfix files
        shell: pwsh
        run: |
          Remove-Item .github/workflows/hotfix-google-voice-permissions.yml -Force
          Remove-Item .github/workflows/hotfix-google-voice-permissions-v3.yml -Force
          Remove-Item tools/hotfix_voice_v0261.py -Force
          git diff --check
          git status --short

      - name: Commit tested hotfix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Google Voice WebView permissions and dialing"
          git push origin HEAD:claude/google-voice-calling-3ui1px
