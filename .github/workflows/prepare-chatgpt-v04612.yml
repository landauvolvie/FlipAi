name: prepare-chatgpt-v04612
on:
  push:
    branches: [feature/chatgpt-webview-chat-v04612]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire routes and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('webui.go'); s=p.read_text()
          old='\tm.HandleFunc("/folders.json", a.requireAuth(a.foldersJSON))'
          new=old+'\n\tm.HandleFunc("/chatgpt/status.json", a.requireAuth(a.chatGPTStatusJSON))'
          if '/chatgpt/status.json' not in s:
              assert old in s
              s=s.replace(old,new,1)
          old='\t\t"/claude/disconnect":     a.claudeDisconnect,'
          new=old+'\n\t\t"/chatgpt/connect":       a.chatGPTConnect,\n\t\t"/chatgpt/test":          a.chatGPTTest,\n\t\t"/chatgpt/chat":          a.chatGPTChat,\n\t\t"/chatgpt/disconnect":    a.chatGPTDisconnect,'
          if '"/chatgpt/connect"' not in s:
              assert old in s
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('main.go'); s=p.read_text()
          old='if !hostResponding(cfg.Listen) && !platformVoiceStillOpen() {'
          new='if !hostResponding(cfg.Listen) && !platformVoiceStillOpen() && !chatGPTBrowserStillOpen(dataDir) {'
          if 'chatGPTBrowserStillOpen(dataDir)' not in s:
              assert old in s
              s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('config.go'); s=p.read_text()
          if 'const version = "0.46.12"' not in s:
              assert 'const version = "0.46.11"' in s
              s=s.replace('const version = "0.46.11"','const version = "0.46.12"',1)
          p.write_text(s)
          Path('VERSION').write_text('0.46.12\n')
          Path('.github/workflows/prepare-chatgpt-v04612.yml').unlink()
          PY
      - name: Commit prepared code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare live ChatGPT WebView release v0.46.12"
          git push
