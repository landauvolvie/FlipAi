name: prepare-v0463

on:
  push:
    branches: [release/gmail-immediate-v0.46.3]
    paths:
      - .github/workflows/prepare-v0463.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/gmail-immediate-v0.46.3

      - name: Bump version and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('config.go')
          s = p.read_text()
          old = 'const version = "0.46.2"'
          new = 'const version = "0.46.3"'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one {old!r}, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))

          Path('VERSION').write_text('0.46.3\n')
          Path('docs/RELEASE-NOTES.md').write_text('''# FlipAi v0.46.3

This release fixes Gmail / Google Voice detection so a valid Gmail App Password starts active mailbox monitoring automatically and new Google Voice texts are detected with the lowest practical latency.

## Gmail monitoring

- Gmail monitoring starts as soon as the App Password connection is usable; incomplete phone/security setup no longer leaves the mailbox at “Not checked yet”.
- App Password mode uses IMAP IDLE, so Gmail wakes FlipAi when new mail arrives instead of waiting for a normal polling interval.
- The first mailbox check happens immediately when the bridge starts.
- The 30-second mailbox poll remains only as a fallback if the IMAP IDLE connection is dropped.
- Gmail keeps detecting and queueing new texts even while Codex or Claude is busy with a previous turn.

## Verified

Regression tests cover Gmail startup gating, immediate IMAP-IDLE wake, initial mailbox checks, and mailbox detection during long agent turns. The release workflow also runs the real-browser Google Voice harness, Linux and Windows test suites, `go vet`, race tests, Windows x64 build, Google Voice receiver validation, installer build, install/uninstall smoke test, Microsoft Defender scan when available, and SHA-256 generation before publishing.
''')
          PY
          rm -f .github/workflows/prepare-v0463.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Prepare FlipAi v0.46.3'
          git push origin HEAD:release/gmail-immediate-v0.46.3
