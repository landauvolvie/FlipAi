name: prepare-chatgpt-v04613

on:
  push:
    branches:
      - fix/chatgpt-persistent-background-v04613

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[v0.46.13-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare v0.46.13 metadata
        shell: python
        run: |
          from pathlib import Path

          cfg = Path('config.go')
          s = cfg.read_text(encoding='utf-8')
          old = 'const version = "0.46.12"'
          new = 'const version = "0.46.13"'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('version constant marker changed')
          cfg.write_text(s, encoding='utf-8')
          Path('VERSION').write_text('0.46.13\n', encoding='utf-8')

          Path('docs/RELEASE-NOTES.md').write_text('''# FlipAi v0.46.13

This release makes the dedicated ChatGPT Chat connection persistent and always-on after the one-time sign-in.

## Connect once, then stay connected

- A successful ChatGPT sign-in is now stored as a durable connection state separate from the currently loading page state.
- Existing v0.46.12 signed-in profiles migrate automatically; users do not need to connect again just because they upgraded.
- Closing the one-time ChatGPT sign-in window no longer means the next turn is sent before the replacement background WebView is ready.
- The FlipAi tray automatically restores a previously connected ChatGPT WebView off-screen after the sign-in window closes, after FlipAi restarts, and after Windows restarts.
- Closing the normal FlipAi control window does not stop the ChatGPT background browser. Explicit Disconnect still removes only FlipAi's dedicated ChatGPT profile.

## Readiness race fixed

v0.46.12 treated "the WebView control endpoint exists" as "ChatGPT is signed in and ready." On a fresh hidden WebView those happen at different times. The Activity log could therefore show a failed turn and a successful sign-in verification in the same second.

v0.46.13 waits for the current ChatGPT page to verify the saved session before a test or chat turn is sent. New-chat navigation also waits for the restored session before using the composer.

## Better recovery and diagnostics

- Background worker launch state is tracked so the tray supervisor and a user turn do not intentionally start duplicate workers.
- Activity records saved-session restore, background startup, readiness, and failures with timing.
- ChatGPT Runtime.evaluate failures now say ChatGPT rather than the misleading old Google Voice wording inherited from a shared helper.
- The Agents page separates Saved connection, Live sign-in, and Browser session so a normal restore delay is visible without looking disconnected.

## Privacy and desktop behavior

The ChatGPT integration still uses FlipAi's own persistent WebView2 profile. It does not copy cookies or tokens out of that profile, does not use Windows accessibility, SendKeys, global mouse/keyboard input, coordinates, or the visible ChatGPT desktop app, and does not open a remote DevTools port.

## Testing

The suite covers v0.46.12 profile migration, durable connection state across temporary page sign-out/loading, tray-only automatic background startup, ChatGPT-specific control errors, the exact ChatGPT page driver in real Chromium, Windows race tests, installer lifecycle, Google Voice regressions, and the existing full Linux/Windows test suites.

## What to test

Install v0.46.13 over v0.46.12. If ChatGPT already shows Connected, close the ChatGPT sign-in window and send another test/chat message. Then restart FlipAi or Windows and try again without pressing Connect ChatGPT. Activity should show the saved session restoring invisibly and then becoming ready.
''', encoding='utf-8')

          wf = Path('.github/workflows/prepare-chatgpt-v04613.yml')
          if wf.exists():
              wf.unlink()
      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare persistent ChatGPT release v0.46.13 [v0.46.13-ready]"
          git push
