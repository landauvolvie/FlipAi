name: prepare-chatgpt-v04613
on:
  push:
    branches: [fix/chatgpt-persistent-background-v04613]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('config.go'); s=p.read_text()
          if 'const version = "0.46.13"' not in s:
              assert 'const version = "0.46.12"' in s
              s=s.replace('const version = "0.46.12"','const version = "0.46.13"',1)
          p.write_text(s)
          Path('VERSION').write_text('0.46.13\n')
          Path('.github/workflows/prepare-chatgpt-v04613.yml').unlink()
          PY
      - name: Commit prepared release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare persistent ChatGPT release v0.46.13"
          git push
