name: oneoff-updater-patch

on:
  push:
    branches: [codex/silent-auto-download-updater]
    paths:
      - .github/workflows/oneoff-updater-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/silent-auto-download-updater

      - name: Apply updater release fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected text not found in {path}: {old[:120]!r}')
              s2 = s.replace(old, new, count)
              p.write_text(s2, encoding='utf-8')

          replace('config.go', 'const version = "0.46.25"', 'const version = "0.46.26"')

          replace('update.go', '\tupdatedVersion    = "0.46.26"\n', '', 1) if False else None
          replace('update.go', '\tpublishedVersion    = "0.46.26"\n', '', 1)
          replace('update.go', 'versionLess(publishedVersion, r.Version)', 'versionLess(version, r.Version)', 1)
          replace('update.go', '"FlipAi/"+publishedVersion', '"FlipAi/"+version', 2)

          replace('zzzzzzzz_quiet_updater_ui.go', 'func currentPublishedVersion() string { return publishedVersion }\n\n', '', 1)
          replace('zzzzzzzz_quiet_updater_ui.go', '<span class="side-version">v{{publishedVersion}}</span>', '<span class="side-version">v{{.Shell.Version}}</span>', 1)
          replace('zzzzzzzz_quiet_updater_ui.go', 'page.Funcs(template.FuncMap{"updaterState": updaterUIState, "publishedVersion": currentPublishedVersion})', 'page.Funcs(template.FuncMap{"updaterState": updaterUIState})', 1)

          replace('platform_windows.go', 'exec.Command(path, "/SILENT", "/NORESTART", "/SUPPRESSMSGBOXES", mode)', 'exec.Command(path, "/VERYSILENT", "/NORESTART", "/SUPPRESSMSGBOXES", mode)', 1)

          old = '''\t// The banner must appear on an ordinary page, not only in Settings.\n\tbody := a.do(t, http.MethodGet, "/", nil).Body.String()\n\tif !strings.Contains(body, "FlipAi "+next+" is available") || !strings.Contains(body, `action="/update/install"`) {\n\t\tt.Fatal("the update banner is missing from the page")\n\t}\n\tif !strings.Contains(body, "not a fresh setup") {\n\t\tt.Fatal("the banner should say an update keeps existing settings")\n\t}\n'''
          new = '''\t// An available release appears only as the compact sidebar download state.\n\tbody := a.do(t, http.MethodGet, "/", nil).Body.String()\n\tif !strings.Contains(body, `title="Downloading FlipAi `+next+`"`) {\n\t\tt.Fatal("the sidebar download indicator is missing from the page")\n\t}\n\tif strings.Contains(body, `class="banner update"`) || strings.Contains(body, `action="/update/install"`) {\n\t\tt.Fatal("the retired page-wide updater UI is still present")\n\t}\n'''
          replace('ui_test.go', old, new, 1)
          replace('ui_test.go', '\t\t"Check for updates",\n', '', 1)

          old = '''\tif !strings.Contains(body, "side-update") {\n\t\tt.Error("the sidebar version line should become an update indicator")\n\t}\n'''
          new = '''\tif !strings.Contains(body, `title="Downloading FlipAi 99.0.0"`) {\n\t\tt.Error("the sidebar version line should become an update indicator")\n\t}\n'''
          replace('update_behavior_test.go', old, new, 1)
          old = '''\tif strings.Contains(plain, "side-update") {\n\t\tt.Error("no update available should leave the plain version line")\n\t}\n'''
          new = '''\tif strings.Contains(plain, `title="Downloading FlipAi`) || strings.Contains(plain, `id="flipai-update-install"`) {\n\t\tt.Error("no update available should leave the plain version line")\n\t}\n'''
          replace('update_behavior_test.go', old, new, 1)

          replace('quiet_updater_test.go', 'if !strings.Contains(body, "side-update-downloading") {', 'if !strings.Contains(body, `title="Downloading FlipAi 99.0.0"`) {', 1)
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "landauvolvie"
          git config user.email "landauvolvie@gmail.com"
          git add config.go update.go zzzzzzzz_quiet_updater_ui.go platform_windows.go ui_test.go update_behavior_test.go quiet_updater_test.go
          git commit -m "Fix updater release regressions"
          git push origin HEAD:codex/silent-auto-download-updater
