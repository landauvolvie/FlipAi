name: fix-v04617-ci

on:
  push:
    branches:
      - fix/full-single-google-voice-replies-v04616
    paths:
      - .github/workflows/fix-v04617-ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply v0.46.17 migration-boundary and test fixes
        shell: bash
        run: |
          set -euo pipefail
          python -c "import gzip,base64;exec(gzip.decompress(base64.b64decode('')).decode())"
          gofmt -w main.go ui_test.go shared_agent_number_test.go sms_sticky_chatgpt_test.go agent_parity_v04617_test.go ui_page_agents_test.go chatgpt_direct_test.go chatgpt_persistence_test.go
          rm -f .github/workflows/fix-v04617-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix v0.46.17 fresh-install migration and regressions"
          git push origin HEAD:fix/full-single-google-voice-replies-v04616
