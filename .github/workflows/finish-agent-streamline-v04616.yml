This release fixes incomplete Google Voice replies and makes Codex, Claude, and ChatGPT Chat follow one consistent agent-settings model.

## Full ChatGPT answers reach Google Voice

Long answers are reassembled before the Google Voice email gateway is used. FlipAi no longer sends numbered `1/2`, `2/2` fragments that can be reduced to only their first lines; the full answer is delivered as one logical reply.

## Smarter ChatGPT receipt confirmation

Codex and Claude keep their immediate “working on it” receipt text. ChatGPT Chat stays quiet for fast turns; only if the final reply has not arrived after 30 seconds does FlipAi send one “ChatGPT Chat working on it” confirmation. Normal long-turn progress texts can continue afterward.

## One familiar settings model

ChatGPT Chat now has its own allowed-phone list and optional PIN, just like the other agents. C:, A:, and ChatGPT's configurable shortcut are sticky per phone with no default agent: select an agent once and unprefixed follow-ups stay there until another shortcut is used.

Connection controls are kept at the top of each agent: Connect when disconnected; Disconnect and Test when connected. The ChatGPT page no longer shows duplicate connection/action sections.

## One SMS instruction

Codex, Claude, and ChatGPT now use one editable SMS instruction. The default is: `This reply will be sent by SMS. Keep it short and plain text.` Changing that one field changes the framing for every agent.
'''
