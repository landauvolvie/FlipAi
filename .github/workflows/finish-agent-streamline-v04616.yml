name: finish-agent-streamline-v04616

on:
  push:
    branches:
      - fix/full-single-google-voice-replies-v04616
    paths:
      - .github/workflows/finish-agent-streamline-v04616.yml

permissions:
  contents: write

jobs:
  streamline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Streamline agent settings and ChatGPT SMS behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def load(name):
              return Path(name).read_text()
          def save(name, text):
              Path(name).write_text(text)
          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)
          def sub1(text, pattern, repl, label, flags=0):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {n}')
              return out

          # -----------------------------------------------------------------
          # Config: one shared SMS instruction, a real ChatGPT agent settings
          # block, and a configurable G shortcut. DefaultAgent stays readable
          # only for old bridge.json files; routing no longer consults it.
          # -----------------------------------------------------------------
          p = 'config.go'; s = load(p)
          s = once(s,
              'const defaultReplyStyleHint = "Your answer is delivered to the user as an SMS text message, so keep it brief and in plain text."',
              'const defaultReplyStyleHint = "This reply will be sent by SMS. Keep it short and plain text."',
              'short shared SMS instruction')
          s = once(s,
              '\tCodexPrefix        string `json:"codexPrefix,omitempty"`\n\tClaudePrefix       string `json:"claudePrefix,omitempty"`\n\tNewSessionCommand  string `json:"newSessionCommand,omitempty"`',
              '\tCodexPrefix        string `json:"codexPrefix,omitempty"`\n\tClaudePrefix       string `json:"claudePrefix,omitempty"`\n\tChatGPTPrefix      string `json:"chatgptPrefix,omitempty"`\n\tNewSessionCommand  string `json:"newSessionCommand,omitempty"`',
              'ChatGPT prefix config')
          s = once(s,
              '\tCodex       CodexConfig       `json:"codex"`\n\tClaude      ClaudeConfig      `json:"claude"`',
              '\tCodex       CodexConfig       `json:"codex"`\n\tClaude      ClaudeConfig      `json:"claude"`\n\tChatGPT     ChatGPTConfig     `json:"chatgpt"`',
              'ChatGPT config field')
          s = once(s,
              'type ClaudeConfig struct {\n\tAgentSettings',
              'type ChatGPTConfig struct {\n\tAgentSettings\n}\n\ntype ClaudeConfig struct {\n\tAgentSettings',
              'ChatGPT config type')
          s = once(s,
              '\tAgentsMigrated bool `json:"agentsMigrated,omitempty"`',
              '\tAgentsMigrated bool `json:"agentsMigrated,omitempty"`\n\n\t// ChatGPTAccessMigrated records the one-time copy that preserves G: access\n\t// for phones that were already allowed before ChatGPT had its own list.\n\tChatGPTAccessMigrated bool `json:"chatgptAccessMigrated,omitempty"`',
              'ChatGPT access migration flag')
          s = once(s,
              '\t\tDefaultAgent: "C", CodexPrefix: defaultCodexPrefix, ClaudePrefix: defaultClaudePrefix, NewSessionCommand: defaultNewSessionCommand,',
              '\t\tDefaultAgent: "C", CodexPrefix: defaultCodexPrefix, ClaudePrefix: defaultClaudePrefix, ChatGPTPrefix: defaultChatGPTPrefix, NewSessionCommand: defaultNewSessionCommand,',
              'default ChatGPT prefix')
          s = once(s,
              '\t\tCodex:    CodexConfig{ApprovalPolicy: "never"},\n\t\tClaude:   ClaudeConfig{PermissionMode: claudeFullAccess, UseChrome: true, SessionMode: claudeSessionModePrint},',
              '\t\tCodex:    CodexConfig{ApprovalPolicy: "never"},\n\t\tClaude:   ClaudeConfig{PermissionMode: claudeFullAccess, UseChrome: true, SessionMode: claudeSessionModePrint},\n\t\tChatGPT:  ChatGPTConfig{},',
              'default ChatGPT settings')
          # Progress cadence can now be per-agent for G as well.
          s = once(s,
              '\tcase "C":\n\t\tif v := c.Codex.ProgressIntervalSeconds; v > 0 {\n\t\t\tseconds = v\n\t\t}\n\t}',
              '\tcase "C":\n\t\tif v := c.Codex.ProgressIntervalSeconds; v > 0 {\n\t\t\tseconds = v\n\t\t}\n\tcase "G":\n\t\tif v := c.ChatGPT.ProgressIntervalSeconds; v > 0 {\n\t\t\tseconds = v\n\t\t}\n\t}',
              'ChatGPT progress interval')
          s = sub1(s,
              r'// replyStyleHintFor resolves.*?func \(c Config\) replyStyleHintFor\(agent string\) string \{.*?\n\}',
              '''// replyStyleHintFor resolves the one shared SMS instruction used by every\n// agent. Agent-specific instruction fields remain readable for downgrade\n// compatibility, but v0.46.16 deliberately ignores them so one edit changes\n// Codex, Claude and ChatGPT together.\nfunc (c Config) replyStyleHintFor(_ string) string {\n\tif shared := strings.TrimSpace(c.GoogleVoice.ReplyStyleHint); shared != "" {\n\t\treturn shared\n\t}\n\treturn defaultReplyStyleHint\n}''',
              'shared reply instruction helper', re.S)
          s = once(s,
              '\tcfg.CodexPrefix = normalizeCommandToken(cfg.CodexPrefix, defaultCodexPrefix)\n\tcfg.ClaudePrefix = normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n\tcfg.NewSessionCommand = normalizeCommandToken(cfg.NewSessionCommand, defaultNewSessionCommand)\n\tif strings.EqualFold(cfg.CodexPrefix, cfg.ClaudePrefix) {\n\t\tcfg.CodexPrefix, cfg.ClaudePrefix = defaultCodexPrefix, defaultClaudePrefix\n\t}',
              '\tcfg.CodexPrefix = normalizeCommandToken(cfg.CodexPrefix, defaultCodexPrefix)\n\tcfg.ClaudePrefix = normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n\tcfg.ChatGPTPrefix = normalizeCommandToken(cfg.ChatGPTPrefix, defaultChatGPTPrefix)\n\tcfg.NewSessionCommand = normalizeCommandToken(cfg.NewSessionCommand, defaultNewSessionCommand)\n\tif strings.EqualFold(cfg.CodexPrefix, cfg.ClaudePrefix) || strings.EqualFold(cfg.CodexPrefix, cfg.ChatGPTPrefix) || strings.EqualFold(cfg.ClaudePrefix, cfg.ChatGPTPrefix) {\n\t\tcfg.CodexPrefix, cfg.ClaudePrefix, cfg.ChatGPTPrefix = defaultCodexPrefix, defaultClaudePrefix, defaultChatGPTPrefix\n\t}',
              'three unique agent prefixes')
          save(p, s)

          # Commands: G is configured exactly like C/A.
          p = 'commands.go'; s = load(p)
          s = once(s,
              '\tdefaultCodexPrefix       = "C"\n\tdefaultClaudePrefix      = "A"\n\tdefaultNewSessionCommand = "NEW"',
              '\tdefaultCodexPrefix       = "C"\n\tdefaultClaudePrefix      = "A"\n\tdefaultChatGPTPrefix     = "G"\n\tdefaultNewSessionCommand = "NEW"',
              'default ChatGPT command prefix')
          s = once(s,
              'func configuredClaudePrefix(cfg Config) string {\n\treturn normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n}\n\nfunc configuredNewSessionCommand',
              'func configuredClaudePrefix(cfg Config) string {\n\treturn normalizeCommandToken(cfg.ClaudePrefix, defaultClaudePrefix)\n}\n\nfunc configuredChatGPTPrefix(cfg Config) string {\n\treturn normalizeCommandToken(cfg.ChatGPTPrefix, defaultChatGPTPrefix)\n}\n\nfunc configuredNewSessionCommand',
              'configured ChatGPT prefix helper')
          save(p, s)

          # -----------------------------------------------------------------
          # Agent settings: ChatGPT owns phones/PIN/reply behavior just like C/A.
          # -----------------------------------------------------------------
          p = 'agents.go'; s = load(p)
          s = sub1(s,
              r'func agentSettings\(cfg Config, agent string\) AgentSettings \{.*?\n\}',
              '''func agentSettings(cfg Config, agent string) AgentSettings {\n\tswitch agent {\n\tcase "A":\n\t\treturn cfg.Claude.AgentSettings\n\tcase "G":\n\t\treturn cfg.ChatGPT.AgentSettings\n\tdefault:\n\t\treturn cfg.Codex.AgentSettings\n\t}\n}''',
              'agentSettings G support', re.S)
          # Replace the inbound SMS resolver with a list-driven 3-agent version.
          s = sub1(s,
              r'// agentForSender resolves.*?func agentForSender\(cfg Config, raw string\) \(agent string, phone AgentPhone, ok bool\) \{.*?\n\}',
              '''// smsAgentsForSender returns every agent this phone may text. It is the\n// authority for C/A/G routing; a prefix can select only a member of this set.\nfunc smsAgentsForSender(cfg Config, raw string) []string {\n\tvar out []string\n\tfor _, agent := range []string{"C", "A", "G"} {\n\t\tif p, ok := agentPhoneForSender(cfg, agent, raw); ok && p.AllowsSMS() {\n\t\t\tout = append(out, agent)\n\t\t}\n\t}\n\treturn out\n}\n\n// agentForSender is retained for the bridge admission check. A unique phone\n// returns its agent; a phone allowed on several agents returns B, meaning\n// "multiple", while selectStickySMSAgent does the exact destination choice.\nfunc agentForSender(cfg Config, raw string) (agent string, phone AgentPhone, ok bool) {\n\tmatches := smsAgentsForSender(cfg, raw)\n\tif len(matches) == 0 {\n\t\treturn "", AgentPhone{}, false\n\t}\n\tfirst, _ := agentPhoneForSender(cfg, matches[0], raw)\n\tif len(matches) == 1 {\n\t\treturn matches[0], first, true\n\t}\n\tfirst.Access = AccessSMS\n\treturn "B", first, true\n}''',
              '3-agent sender resolution', re.S)
          s = once(s,
              'for _, agent := range []string{"C", "A"} {\n\t\tout = append(out, agentSettings(cfg, agent).Phones...)',
              'for _, agent := range []string{"C", "A", "G"} {\n\t\tout = append(out, agentSettings(cfg, agent).Phones...)',
              'all agent phone lists')
          # normalizeAgents: include G, but caller names only apply to voice agents.
          s = once(s,
              'for _, agent := range []string{"C", "A"} {\n\t\tsettings := agentSettings(*cfg, agent)',
              'for _, agent := range []string{"C", "A", "G"} {\n\t\tsettings := agentSettings(*cfg, agent)',
              'normalize all 3 agents')
          s = once(s,
              '\t\tnames, err := normalizeAllowedCallerLabels(settings.CallerNames, true)\n\t\tif err != nil {\n\t\t\treturn fmt.Errorf("%s caller names: %w", agentDisplayName(agent), err)\n\t\t}',
              '\t\tvar names []string\n\t\tif agent != "G" {\n\t\t\tvar err error\n\t\t\tnames, err = normalizeAllowedCallerLabels(settings.CallerNames, true)\n\t\t\tif err != nil {\n\t\t\t\treturn fmt.Errorf("%s caller names: %w", agentDisplayName(agent), err)\n\t\t\t}\n\t\t} else {\n\t\t\t// ChatGPT Chat is an SMS destination; calls remain on Codex/Claude.\n\t\t\tsettings.CallerNames = ""\n\t\t}',
              'ChatGPT has no caller-name routing')
          s = once(s,
              '\t\tif agent == "A" {\n\t\t\tcfg.Claude.AgentSettings = settings\n\t\t} else {\n\t\t\tcfg.Codex.AgentSettings = settings\n\t\t}\n\t}\n\tif cfg.DefaultAgent != "A" && cfg.DefaultAgent != "C" {\n\t\tcfg.DefaultAgent = "C"\n\t}\n\treturn nil',
              '\t\tswitch agent {\n\t\tcase "A":\n\t\t\tcfg.Claude.AgentSettings = settings\n\t\tcase "G":\n\t\t\tcfg.ChatGPT.AgentSettings = settings\n\t\tdefault:\n\t\t\tcfg.Codex.AgentSettings = settings\n\t\t}\n\t}\n\treturn nil',
              'store normalized G settings and remove default routing')
          # Make old installations keep G access exactly once by copying their
          # existing SMS-capable phones into the new ChatGPT list.
          marker = '\tensureAgentReplyDefaults(cfg)\n\tif migrated {'
          insert = '''\tif !cfg.Security.ChatGPTAccessMigrated {\n\t\tcfg.Security.ChatGPTAccessMigrated = true\n\t\tif len(cfg.ChatGPT.Phones) == 0 {\n\t\t\tseen := map[string]bool{}\n\t\t\tfor _, source := range []AgentSettings{cfg.Codex.AgentSettings, cfg.Claude.AgentSettings} {\n\t\t\t\tfor _, p := range source.Phones {\n\t\t\t\t\tif !p.AllowsSMS() || seen[p.Number] {\n\t\t\t\t\t\tcontinue\n\t\t\t\t\t}\n\t\t\t\t\tseen[p.Number] = true\n\t\t\t\t\tp.Access = AccessSMS\n\t\t\t\t\tcfg.ChatGPT.Phones = append(cfg.ChatGPT.Phones, p)\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t}\n\tensureAgentReplyDefaults(cfg)\n\tif migrated {'''
          s = once(s, marker, insert, 'one-time ChatGPT phone migration')
          # All reply defaults, including G.
          s = once(s,
              'for _, agent := range []string{"C", "A"} {\n\t\ts := agentSettings(*cfg, agent)\n\t\tif s.ReplyAck == nil {',
              'for _, agent := range []string{"C", "A", "G"} {\n\t\ts := agentSettings(*cfg, agent)\n\t\tif s.ReplyAck == nil {',
              'reply defaults for G')
          # First matching storage block in ensureAgentReplyDefaults after this point.
          s = sub1(s,
              r'(func ensureAgentReplyDefaults\(cfg \*Config\) \{.*?)(\t\tif agent == "A" \{\n\t\t\tcfg\.Claude\.AgentSettings = s\n\t\t\} else \{\n\t\t\tcfg\.Codex\.AgentSettings = s\n\t\t\})',
              r'''\1\t\tswitch agent {\n\t\tcase "A":\n\t\t\tcfg.Claude.AgentSettings = s\n\t\tcase "G":\n\t\t\tcfg.ChatGPT.AgentSettings = s\n\t\tdefault:\n\t\t\tcfg.Codex.AgentSettings = s\n\t\t}''',
              'store G reply defaults', re.S)
          # setAgentCode has its own C/A storage block.
          s = sub1(s,
              r'(func setAgentCode\(cfg \*Config, agent, code string\) error \{.*?)(\tif agent == "A" \{\n\t\tcfg\.Claude\.AgentSettings = s\n\t\} else \{\n\t\tcfg\.Codex\.AgentSettings = s\n\t\})',
              r'''\1\tswitch agent {\n\tcase "A":\n\t\tcfg.Claude.AgentSettings = s\n\tcase "G":\n\t\tcfg.ChatGPT.AgentSettings = s\n\tdefault:\n\t\tcfg.Codex.AgentSettings = s\n\t}''',
              'store G security code', re.S)
          save(p, s)

          # -----------------------------------------------------------------
          # Sticky routing: exact per-phone permissions across C/A/G; G no
          # longer borrows C/A permissions or PINs.
          # -----------------------------------------------------------------
          p = 'sms_sticky_chatgpt.go'; s = load(p)
          s = once(s,
              'const (\n    chatGPTSMSAgent  = "G"\n    chatGPTSMSPrefix = "G"\n)',
              'const chatGPTSMSAgent = "G"',
              'remove hard-coded ChatGPT prefix')
          start = s.index('func explicitSMSAgent')
          end = s.index('func stickySMSKey')
          replacement = r'''func explicitSMSAgent(raw string, cfg Config) string {
    raw = strings.TrimSpace(raw)
    if raw == "" {
        return ""
    }
    candidates := []string{raw}
    if f := strings.Fields(raw); len(f) > 1 {
        candidates = append(candidates, strings.TrimSpace(strings.TrimPrefix(raw, f[0])))
    }
    newWord := configuredNewSessionCommand(cfg)
    for _, v := range candidates {
        for _, x := range []struct{ agent, prefix string }{
            {"C", configuredCodexPrefix(cfg)},
            {"A", configuredClaudePrefix(cfg)},
            {"G", configuredChatGPTPrefix(cfg)},
        } {
            if _, ok := stripAgentCommandPrefix(v, x.prefix); ok || isAgentNewSession(v, x.prefix, newWord) {
                return x.agent
            }
        }
    }
    return ""
}

func smsTargetAllowed(cfg Config, sender, target string) bool {
    p, ok := agentPhoneForSender(cfg, target, sender)
    return ok && p.AllowsSMS()
}

func selectStickySMSAgent(raw string, cfg Config, sender, sticky string) (string, error) {
    if explicit := explicitSMSAgent(raw, cfg); explicit != "" {
        if !smsTargetAllowed(cfg, sender, explicit) {
            return "", fmt.Errorf("this phone is not allowed to text %s; add it under that agent first", agentDisplayName(explicit))
        }
        return explicit, nil
    }
    sticky = strings.ToUpper(strings.TrimSpace(sticky))
    if smsTargetAllowed(cfg, sender, sticky) {
        return sticky, nil
    }
    allowed := smsAgentsForSender(cfg, sender)
    if len(allowed) == 1 {
        return allowed[0], nil
    }
    return "", fmt.Errorf("no SMS agent is selected for this phone yet; start with %s: for Codex, %s: for Claude, or %s: for ChatGPT Chat",
        configuredCodexPrefix(cfg), configuredClaudePrefix(cfg), configuredChatGPTPrefix(cfg))
}

func authorizeChatGPTRaw(raw string, cfg Config) (string, error) {
    settings := agentSettings(cfg, "G")
    if !settings.RequireCode {
        return strings.TrimSpace(raw), nil
    }
    f := strings.Fields(raw)
    if len(f) < 2 {
        return "", errors.New("missing the ChatGPT Chat security code or command")
    }
    if !verifyAgentCode(settings, f[0]) {
        return "", errors.New("invalid security code for ChatGPT Chat")
    }
    return strings.TrimSpace(strings.TrimPrefix(raw, f[0])), nil
}

func parseChatGPTSMSCommand(raw string, cfg Config) (remoteCommand, error) {
    rest, err := authorizeChatGPTRaw(raw, cfg)
    if err != nil {
        return remoteCommand{}, err
    }
    if strings.EqualFold(rest, "STATUS") {
        return remoteCommand{Status: true}, nil
    }
    newWord := configuredNewSessionCommand(cfg)
    prefix := configuredChatGPTPrefix(cfg)
    if strings.EqualFold(rest, newWord) || isAgentNewSession(rest, prefix, newWord) {
        return remoteCommand{Agent: "G", New: true}, nil
    }
    text := rest
    if tail, ok := stripAgentCommandPrefix(rest, prefix); ok {
        text = tail
    }
    text = strings.TrimSpace(text)
    if text == "" {
        return remoteCommand{}, errors.New("empty ChatGPT command")
    }
    return remoteCommand{Agent: "G", Text: text}, nil
}

func parseRemoteCommandForMessageSticky(raw string, cfg Config, sender, sticky string, m GmailMessage) (remoteCommand, error) {
    target, err := selectStickySMSAgent(raw, cfg, sender, sticky)
    if err != nil {
        return remoteCommand{}, err
    }
    if strings.TrimSpace(raw) != "" {
        if target == "G" {
            return parseChatGPTSMSCommand(raw, cfg)
        }
        return parseRemoteCommand(raw, cfg, target)
    }
    if target == "G" {
        return remoteCommand{}, errors.New("ChatGPT Chat over Google Voice supports text messages in this release; switch to Codex or Claude for an attachment")
    }
    return parseRemoteCommandForMessage(raw, cfg, target, m)
}

'''
          s = s[:start] + replacement + s[end:]
          save(p, s)

          # -----------------------------------------------------------------
          # Bridge: delayed 30-second ACK only for ChatGPT; immediate for C/A.
          # -----------------------------------------------------------------
          p = 'bridge.go'; s = load(p)
          s = once(s,
              'type bridgeJob struct {\n\tmsg GmailMessage\n\tcmd remoteCommand\n}',
              'type bridgeJob struct {\n\tmsg     GmailMessage\n\tcmd     remoteCommand\n\tackDone chan struct{}\n}',
              'bridgeJob delayed ack channel')
          s = once(s,
              '\t\tb.execute(ctx, j.msg, j.cmd)\n\t}',
              '\t\tb.execute(ctx, j.msg, j.cmd)\n\t\tif j.ackDone != nil {\n\t\t\tclose(j.ackDone)\n\t\t}\n\t}',
              'cancel delayed ack when turn finishes')
          s = once(s,
              'rc, err := parseRemoteCommandForMessageSticky(raw, b.cfg, senderAgent, sticky, m)',
              'rc, err := parseRemoteCommandForMessageSticky(raw, b.cfg, sender, sticky, m)',
              'sticky parser gets sender permissions')
          old = '''\t\tagentName := agentDisplayName(rc.Agent)
\t\tb.event("success", "routing", "Authenticated SMS routed to "+agentName, sender, rc.Agent, id)
\t\tdepth := b.enqueue(bridgeJob{msg: m, cmd: rc})
\t\tif agentSettings(b.cfg, rc.Agent).ackEnabled() {
\t\t\tline := "✓ " + agentName + " working on it…"
\t\t\tif depth > 1 {
\t\t\t\tline = fmt.Sprintf("✓ Queued for %s (%d ahead)…", agentName, depth-1)
\t\t\t}
\t\t\tb.notify(ctx, m, line)
\t\t}'''.replace('\\t','\t').replace('\\n','\n')
          new = '''\t\tagentName := agentDisplayName(rc.Agent)
\t\tb.event("success", "routing", "Authenticated SMS routed to "+agentName, sender, rc.Agent, id)
\t\tjob := bridgeJob{msg: m, cmd: rc}
\t\tsettings := agentSettings(b.cfg, rc.Agent)
\t\tif rc.Agent == "G" && settings.ackEnabled() && !rc.Status && !rc.New {
\t\t\tjob.ackDone = make(chan struct{})
\t\t}
\t\tdepth := b.enqueue(job)
\t\tif settings.ackEnabled() {
\t\t\tif rc.Agent == "G" && job.ackDone != nil {
\t\t\t\tgo b.delayedChatGPTAck(ctx, job.ackDone, m, depth)
\t\t\t} else {
\t\t\t\tline := "✓ " + agentName + " working on it…"
\t\t\t\tif depth > 1 {
\t\t\t\t\tline = fmt.Sprintf("✓ Queued for %s (%d ahead)…", agentName, depth-1)
\t\t\t\t}
\t\t\t\tb.notify(ctx, m, line)
\t\t\t}
\t\t}'''.replace('\\t','\t').replace('\\n','\n')
          s = once(s, old, new, 'agent receipt acknowledgment block')
          # Add helper before composePrompt.
          marker = '// composePrompt hands the SMS to the agent with as little framing as possible.'
          helper = '''const chatGPTReceiptDelay = 30 * time.Second

// delayedChatGPTAck keeps fast ChatGPT turns quiet. If the final turn has not
// returned after 30 seconds, the phone gets exactly one receipt confirmation.
func (b *Bridge) delayedChatGPTAck(ctx context.Context, done <-chan struct{}, m GmailMessage, depth int) {
\tt := time.NewTimer(chatGPTReceiptDelay)
\tdefer t.Stop()
\tselect {
\tcase <-done:
\t\treturn
\tcase <-ctx.Done():
\t\treturn
\tcase <-t.C:
\t}
\tline := "✓ ChatGPT Chat working on it…"
\tif depth > 1 {
\t\tline = fmt.Sprintf("✓ ChatGPT Chat is queued (%d ahead)…", depth-1)
\t}
\tb.notify(ctx, m, line)
}

'''
          s = once(s, marker, helper + marker, 'delayed ChatGPT ACK helper')
          # Update composePrompt comments to match shared instruction.
          s = s.replace('Each agent can carry its own wording — Codex and\n// Claude answer a text differently — and an agent with no wording of its own\n// falls back to the shared line.',
                        'One shared editable line is used for Codex, Claude and ChatGPT, so the\n// transport framing stays predictable across agents.')
          save(p, s)

          # -----------------------------------------------------------------
          # Agent form actions: G is accepted anywhere C/A are accepted.
          # -----------------------------------------------------------------
          p = 'ui_actions_agents.go'; s = load(p)
          s = sub1(s,
              r'func agentFromForm\(r \*http.Request, field string\) string \{.*?\n\}',
              '''func agentFromForm(r *http.Request, field string) string {\n\tswitch strings.ToUpper(strings.TrimSpace(r.FormValue(field))) {\n\tcase "A":\n\t\treturn "A"\n\tcase "G":\n\t\treturn "G"\n\tdefault:\n\t\treturn "C"\n\t}\n}''',
              'agentFromForm G support', re.S)
          s = sub1(s,
              r'func putAgentSettings\(cfg \*Config, agent string, s AgentSettings\) \{.*?\n\}',
              '''func putAgentSettings(cfg *Config, agent string, s AgentSettings) {\n\tswitch agent {\n\tcase "A":\n\t\tcfg.Claude.AgentSettings = s\n\tcase "G":\n\t\tcfg.ChatGPT.AgentSettings = s\n\tdefault:\n\t\tcfg.Codex.AgentSettings = s\n\t}\n}''',
              'putAgentSettings G support', re.S)
          s = once(s,
              '\t\t\tAccess: normalizeAccess(r.FormValue("newAccess")),',
              '\t\t\tAccess: func() string { if agent == "G" { return AccessSMS }; return normalizeAccess(r.FormValue("newAccess")) }(),',
              'ChatGPT numbers are SMS-only')
          s = once(s,
              '\tif agent != "A" {\n\t\tagent = "C"\n\t}',
              '\tif agent != "A" && agent != "G" {\n\t\tagent = "C"\n\t}',
              'removeAgentNumber G support')
          save(p, s)

          # Agent save: configurable G shortcut, all 3 access forms, one shared instruction.
          p = 'ui_actions.go'; s = load(p)
          old = 'if r.Form.Has("codexPrefix") || r.Form.Has("claudePrefix") || r.Form.Has("newSessionCommand") {'
          s = once(s, old, 'if r.Form.Has("codexPrefix") || r.Form.Has("claudePrefix") || r.Form.Has("chatgptPrefix") || r.Form.Has("newSessionCommand") {', 'save G prefix trigger')
          s = once(s,
              'codexPrefix, claudePrefix, newSession := configuredCodexPrefix(*cfg), configuredClaudePrefix(*cfg), configuredNewSessionCommand(*cfg)',
