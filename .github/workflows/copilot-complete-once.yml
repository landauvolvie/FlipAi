name: copilot-complete-once

on:
  push:
    branches: [copilot-chat]
    paths:
      - .github/workflows/copilot-complete-once.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot-chat
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Complete Copilot integration
        run: python3 scripts/complete_copilot.py
      - name: Format
        run: gofmt -w bridge.go webui.go ui_actions.go ui_page_agents.go copilot_chat_*.go sms_copilot_chat.go browser_chat_attachments.go agents.go commands.go sms_sticky_chatgpt.go zzzzzzzzzzzzz_copilot_chat_ui.go
      - name: Test
        run: go test ./...
      - name: Commit completed integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge.go webui.go ui_actions.go ui_page_agents.go copilot_chat_*.go sms_copilot_chat.go browser_chat_attachments.go agents.go commands.go sms_sticky_chatgpt.go zzzzzzzzzzzzz_copilot_chat_ui.go
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "Complete Microsoft Copilot Chat integration"
          git push origin HEAD:copilot-chat
