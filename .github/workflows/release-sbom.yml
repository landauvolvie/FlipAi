name: release-sbom

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0
          cyclonedx-gomod mod -json -output FlipAi-SBOM.cdx.json
      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" FlipAi-SBOM.cdx.json --clobber
