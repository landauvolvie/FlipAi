name: Restore full config for v0.27.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-config-v027.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore complete config and keep v0.27.0
        shell: bash
        run: |
          set -euo pipefail
          git show 1911800a4a9c5ef2d21c5a38b54e783beff5098e:config.go > config.go
          python - <<'PY'
          from pathlib import Path
          p = Path('config.go')
          text = p.read_text()
          old = 'const version = "0.26.2"'
          new = 'const version = "0.27.0"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old version constant, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          grep -q 'const version = "0.27.0"' config.go
          grep -q 'type UpdateConfig struct' config.go
          grep -q 'type GmailConfig struct' config.go
          grep -q 'type GoogleVoiceConfig struct' config.go
          grep -q 'type CodexConfig struct' config.go
          grep -q 'type ClaudeConfig struct' config.go
          grep -q 'type SecurityConfig struct' config.go
          git diff --check

      - name: Commit restored config
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config.go
          git commit -m 'Restore full config and set v0.27.0'
          git push origin HEAD:main
