name: patch-gmail-busy-poll

on:
  push:
    branches: [fix/gmail-monitor-starts-immediately]
    paths:
      - .github/workflows/patch-gmail-busy-poll.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-monitor-starts-immediately

      - name: Keep mailbox polling while an agent is busy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bridge.go')
          text = p.read_text()
          old = "\tif b.busy || b.paused {\n"
          new = "\tif b.paused {\n"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one busy/pause poll gate, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit the patch and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-gmail-busy-poll.yml
          git add bridge.go
          git commit -m "Detect Gmail while agent turns are busy"
          git push origin HEAD:fix/gmail-monitor-starts-immediately
