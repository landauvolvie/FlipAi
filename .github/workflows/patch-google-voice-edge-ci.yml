name: Patch Google Voice Edge CI

on:
  push:
    branches:
      - 'fix/google-voice-edge-ci'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fix/google-voice-edge-ci'
          fetch-depth: 0
      - name: Patch stale window check
        run: python scripts/patch_edge_ci.py
      - name: Verify and commit
        run: |
          git diff --check
          grep -q 'Get-Process -Name FlipAi,msedge' .github/workflows/build.yml
          grep -q 'Get-Process -Name FlipAi,msedge' .github/workflows/release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: detect Google Voice Edge app window'
          git push origin HEAD:fix/google-voice-edge-ci
