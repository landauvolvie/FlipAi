name: sync-release-version

on:
  push:
    branches:
      - feat/muse-chat
    paths:
      - .github/workflows/sync-release-version.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/muse-chat
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Synchronize release version
        run: |
          sed -i 's/const version = "0.46.69"/const version = "0.46.70"/' config.go
          sed -i 's/#define MyVersion "0.46.69"/#define MyVersion "0.46.70"/' installer/FlipAi.iss
          rm .github/workflows/sync-release-version.yml
          grep -q 'const version = "0.46.70"' config.go
          grep -q '#define MyVersion "0.46.70"' installer/FlipAi.iss
          go test ./...
          go vet ./...
      - name: Commit synchronized version
        run: |
          git config user.name "FlipAi release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize v0.46.70 release version"
          git push origin HEAD:feat/muse-chat
