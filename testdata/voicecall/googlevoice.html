<!doctype html>
<meta charset="utf-8">
<title>Google Voice</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  .shell { display: flex; }
  .threads { width: 260px; padding: 12px; }
  .thread { padding: 8px 0; }
  #callarea:empty { display: none; }
  #callarea > div { padding: 16px; border: 1px solid #ccc; margin: 12px; width: 320px; }
  .caller { font-size: 20px; font-weight: 600; }
  button { display: inline-block; padding: 8px 14px; margin: 6px 6px 0 0; }
</style>
<body>
<div class="shell">
  <!-- A decoy conversation. Google Voice always has other numbers on screen;
       none of them may be treated as the caller of a ringing call. -->
  <div class="threads">
    <div class="thread">Mom<br>(212) 555-0000<br>see you soon</div>
    <div class="thread">Pharmacy<br>+1 617-555-0143<br>prescription ready</div>
  </div>
  <div id="callarea"></div>
</div>
<script>
// A stand-in for the parts of Google Voice the FlipAi bridge actually touches:
// a ringing dialog with an Answer button, an in-call dialog with Hang up, the
// media element that plays the remote caller, and the microphone capture the
// page opens when the call connects.
//
// The caller is simulated as a steady tone: a real AudioContext oscillator
// feeding the stream this page assigns to its remote <audio> element, exactly
// where Google Voice puts the incoming WebRTC audio. FlipAi is expected to
// lift that stream toward the agent and to silence the element locally.
window.gv = {
  gumSettings: null,
  gumTrackLabel: '',
  gumError: '',
  playCalled: false,
  playError: '',
  micLevel: 0,
  callerCtx: null,

  ring(display, ariaLabel, answerLabel) {
    const area = document.getElementById('callarea');
    area.textContent = '';
    const dialog = document.createElement('div');
    dialog.setAttribute('role', 'dialog');
    if (ariaLabel) dialog.setAttribute('aria-label', ariaLabel);

    const who = document.createElement('div');
    who.className = 'caller';
    for (const [i, line] of String(display).split('\n').entries()) {
      if (i) who.append(document.createElement('br'));
      who.append(document.createTextNode(line));
    }
    const sub = document.createElement('div');
    sub.textContent = 'Incoming call';

    const answer = document.createElement('button');
    answer.textContent = 'Answer';
    if (answerLabel) answer.setAttribute('aria-label', answerLabel);
    answer.addEventListener('click', () => window.gv.connect());
    const decline = document.createElement('button');
    decline.textContent = 'Decline';
    decline.addEventListener('click', () => window.gv.hangup());

    dialog.append(who, sub, answer, decline);
    area.append(dialog);
  },

  async connect() {
    const area = document.getElementById('callarea');
    area.textContent = '';
    const dialog = document.createElement('div');
    dialog.setAttribute('role', 'dialog');
    const hangup = document.createElement('button');
    hangup.textContent = 'Hang up';
    hangup.addEventListener('click', () => window.gv.hangup());
    const audio = document.createElement('audio');
    audio.id = 'remote';
    audio.autoplay = true;
    dialog.append(hangup, audio);
    area.append(dialog);

    // The remote caller: a 440Hz tone standing in for the incoming call
    // audio Google Voice attaches to its media element.
    const ctx = new AudioContext();
    window.gv.callerCtx = ctx;
    const osc = ctx.createOscillator();
    osc.frequency.value = 440;
    const dest = ctx.createMediaStreamDestination();
    osc.connect(dest);
    osc.start();
    window.gv.callerStream = dest.stream;
    audio.srcObject = dest.stream;

    // Google Voice opens the microphone when the call connects. FlipAi is
    // expected to hand back the agent's voice instead of a device.
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true}});
      window.gv.stream = stream;
      const track = stream.getAudioTracks()[0];
      window.gv.gumSettings = track.getSettings();
      window.gv.gumTrackLabel = track.label || '';
      // What the caller would hear: the level on the microphone stream this
      // page was given. A real Google Voice sends it into its own WebRTC
      // connection; measuring it here is the same observation.
      const an = ctx.createAnalyser();
      an.fftSize = 2048;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Float32Array(an.fftSize);
      window.gv._micPoll = setInterval(() => {
        an.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.sqrt(sum / buf.length);
        if (rms > window.gv.micLevel) window.gv.micLevel = rms;
      }, 100);
    } catch (e) {
      window.gv.gumError = String(e);
    }
    try {
      window.gv.playCalled = true;
      await audio.play();
    } catch (e) {
      window.gv.playError = String(e);
    }
  },

  hangup() {
    document.getElementById('callarea').textContent = '';
    if (window.gv._micPoll) { clearInterval(window.gv._micPoll); window.gv._micPoll = 0; }
    if (window.gv.stream) {
      window.gv.stream.getTracks().forEach(t => t.stop());
      window.gv.stream = null;
    }
    if (window.gv.callerCtx) { window.gv.callerCtx.close().catch(() => {}); window.gv.callerCtx = null; }
  },

  // What the page can see of FlipAi's routing.
  observed() {
    const remote = document.getElementById('remote');
    return {
      gumSettings: window.gv.gumSettings || null,
      gumTrackLabel: window.gv.gumTrackLabel,
      gumError: window.gv.gumError || '',
      playCalled: window.gv.playCalled,
      playError: window.gv.playError,
      micLevel: window.gv.micLevel,
      remoteMuted: remote ? remote.muted : null,
      remoteVolume: remote ? remote.volume : null,
      secureContext: window.isSecureContext,
      hasMediaDevices: !!navigator.mediaDevices
    };
  }
};
</script>
