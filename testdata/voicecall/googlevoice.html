<!doctype html>
<meta charset="utf-8">
<title>Google Voice</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 0; }
  .shell { display: flex; }
  .threads { width: 260px; padding: 12px; }
  .thread { padding: 8px 0; }
  #callarea:empty { display: none; }
  #callarea > div, .calldialog { padding: 16px; border: 1px solid #ccc; margin: 12px; width: 320px; }
  .caller { font-size: 20px; font-weight: 600; }
  button { display: inline-block; padding: 8px 14px; margin: 6px 6px 0 0; }
  #callframe { width: 380px; height: 220px; border: 1px dashed #999; }
</style>
<body>
<div class="shell">
  <!-- A decoy conversation. Google Voice always has other numbers on screen;
       none of them may be treated as the caller of a ringing call. -->
  <div class="threads">
    <div class="thread">Mom<br>(212) 555-0000<br>see you soon</div>
    <div class="thread">Pharmacy<br>+1 617-555-0143<br>prescription ready</div>
  </div>
  <div id="callarea"></div>
  <div id="framearea"></div>
</div>
<script>
// A stand-in for the parts of Google Voice the FlipAi bridge actually touches:
// a ringing dialog with an Answer button -- in the main document or inside a
// same-origin iframe, both of which the real page has used -- an in-call
// dialog with Hang up, a media element plus a microphone capture for the
// conversation itself, and the incoming-call notification Google sometimes
// raises before drawing anything.
window.gv = {
  gumConstraints: null,
  gumSettings: null,
  playCalled: false,
  playError: '',

  buildRing(doc, display, ariaLabel, answerLabel) {
    const dialog = doc.createElement('div');
    dialog.className = 'calldialog';
    dialog.setAttribute('role', 'dialog');
    if (ariaLabel) dialog.setAttribute('aria-label', ariaLabel);

    const who = doc.createElement('div');
    who.className = 'caller';
    for (const [i, line] of String(display).split('\n').entries()) {
      if (i) who.append(doc.createElement('br'));
      who.append(doc.createTextNode(line));
    }
    const sub = doc.createElement('div');
    sub.textContent = 'Incoming call';

    const answer = doc.createElement('button');
    answer.textContent = 'Answer';
    if (answerLabel) answer.setAttribute('aria-label', answerLabel);
    answer.addEventListener('click', () => window.gv.connect());
    const decline = doc.createElement('button');
    decline.textContent = 'Decline';
    decline.addEventListener('click', () => window.gv.hangup());

    dialog.append(who, sub, answer, decline);
    return dialog;
  },

  ring(display, ariaLabel, answerLabel) {
    const area = document.getElementById('callarea');
    area.textContent = '';
    area.append(window.gv.buildRing(document, display, ariaLabel, answerLabel));
  },

  // The same ring, rendered inside a same-origin iframe: nothing about it is
  // visible from the top document's own DOM queries.
  ringInFrame(display, ariaLabel, answerLabel) {
    const holder = document.getElementById('framearea');
    holder.textContent = '';
    const frame = document.createElement('iframe');
    frame.id = 'callframe';
    holder.append(frame);
    const doc = frame.contentDocument;
    doc.body.append(window.gv.buildRing(doc, display, ariaLabel, answerLabel));
  },

  // Google announcing the call through the Notifications API, as it does when
  // it raises a desktop notification for an incoming call.
  notifyIncoming(body) {
    try { new Notification('Incoming call', {body: body}); } catch (e) { window.gv.noteError = String(e); }
  },

  // renameHangup stands in for Google renaming the control that ends a call.
  // FlipAi recognizes a call from the controls the page draws, so a rename it
  // has never seen must not read as "there is no call" -- that would shut the
  // desktop app's voice session down in the middle of a conversation.
  renameHangup(label) {
    window.gv.hangupLabel = label;
    // Rename the control on screen too, so a call that is already up has the
    // name changed under FlipAi rather than starting out with a strange one.
    const area = document.getElementById('callarea');
    if (!area) return;
    for (const b of area.querySelectorAll('button')) {
      if (/hang\s*up/i.test(b.textContent || '')) b.textContent = label;
    }
  },

  async connect() {
    document.getElementById('framearea').textContent = '';
    const area = document.getElementById('callarea');
    area.textContent = '';
    const dialog = document.createElement('div');
    dialog.setAttribute('role', 'dialog');
    const hangup = document.createElement('button');
    hangup.textContent = window.gv.hangupLabel || 'Hang up';
    hangup.addEventListener('click', () => window.gv.hangup());
    // A call in progress always offers these, whatever the control that ends
    // it is called.
    for (const name of ['Mute', 'Keypad']) {
      const b = document.createElement('button');
      b.textContent = name;
      dialog.append(b);
    }
    const audio = document.createElement('audio');
    audio.id = 'remote';
    audio.autoplay = true;
    dialog.append(hangup, audio);
    area.append(dialog);

    // Google Voice opens the microphone when the call connects. This is the
    // request FlipAi has to redirect onto the virtual cable.
    const constraints = {audio: {echoCancellation: true}};
    window.gv.gumConstraints = null;
    try {
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      window.gv.stream = stream;
      window.gv.gumSettings = stream.getAudioTracks()[0].getSettings();
      // The remote party is rendered through the media element; its sink is
      // what has to land on the other virtual cable.
      audio.srcObject = stream;
    } catch (e) {
      window.gv.gumError = String(e);
    }
    try {
      window.gv.playCalled = true;
      await audio.play();
    } catch (e) {
      window.gv.playError = String(e);
    }
  },

  hangup() {
    document.getElementById('callarea').textContent = '';
    document.getElementById('framearea').textContent = '';
    if (window.gv.stream) {
      window.gv.stream.getTracks().forEach(t => t.stop());
      window.gv.stream = null;
    }
  },

  // What getUserMedia was ultimately called with, after FlipAi rewrote it.
  observed() {
    return {
      gumCalls: window.__flipRecordedCalls || [],
      gumSettings: window.gv.gumSettings || null,
      gumError: window.gv.gumError || '',
      noteError: window.gv.noteError || '',
      playCalled: window.gv.playCalled,
      playError: window.gv.playError,
      sinkId: (document.getElementById('remote') || {}).sinkId || '',
      secureContext: window.isSecureContext,
      hasMediaDevices: !!navigator.mediaDevices,
      hasSetSinkId: typeof HTMLMediaElement.prototype.setSinkId === 'function'
    };
  }
};
</script>
